name: Bug report
description: Report something that is broken or behaving incorrectly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more precisely you can
        describe what happened, the faster it can be reproduced and fixed.

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Which OS and version were you running the app on?
      placeholder: "e.g. Windows 11 24H2, macOS 15.1, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: >
        Find this in the app's About dialog, or in the filename of the
        installer/AppImage you downloaded.
      placeholder: "e.g. 0.2.1"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Open a new document at 64x64
        2. Select the pencil tool
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: >
        If applicable, drag and drop images or a short screen recording here.
      placeholder: Drag and drop files here, or paste an image.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help — log output, related issues, etc.
    validations:
      required: false
