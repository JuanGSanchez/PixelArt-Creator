name: Translation problem
description: Text that is wrong, untranslated or cut off in one of the app's languages, or a request for a new language.
title: "[Translation]: "
labels: ["translation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        The app is available in English and Spanish. The translation files are
        generated by the project's own tooling, so please report text problems here
        rather than editing those files in a pull request.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - The translation is wrong or reads badly
        - Text appears in English instead of the chosen language
        - Text is cut off or does not fit
        - I'd like a new language
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Which language?
      options:
        - Spanish (Español)
        - English
        - A new language (say which below)
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where in the app?
      description: >
        The window, menu, panel or dialog, and the control the text belongs to. For a
        new language, say which language and whether you can help check it.
      placeholder: "e.g. The Export dialog, the label next to the loop count"
    validations:
      required: true

  - type: input
    id: current-text
    attributes:
      label: Text shown now
      description: Copy it exactly, including punctuation.
    validations:
      required: false

  - type: input
    id: suggested-text
    attributes:
      label: Suggested text
      description: What it should say instead, if you know.
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App version
      description: >
        The release tag you are running, as listed at
        https://github.com/JuanGSanchez/PixelArt-Creator/releases, or the commit SHA
        if built from source (`git rev-parse --short HEAD`).
      placeholder: "e.g. v0.3.0, or 1a2b3c4 if built from source"
    validations:
      required: false

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot showing the text in place helps, especially for text that is cut off.
    validations:
      required: false
