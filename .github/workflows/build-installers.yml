# =============================================================================
# CI workflow (GitHub Actions) — PixelArt Creator — native installer BUILD
# matrix.
# Owned by the GitHub/DevOps role.
#
# SPLIT OUT OF ci.yml (this change, 2026-09-01): this job used to live inside
# ci.yml, self-guarded by a job-level `if:` so it only ever executed on a
# `v*` tag push or a `workflow_dispatch` selecting target=build-installers.
# GitHub still EVALUATES and LISTS a job on every trigger of the workflow
# FILE it lives in, even when its own `if:` is false — so every ordinary
# push and every pull request listed `build-installers` as skipped, forever,
# with no way for it to ever run in that context. Moving it into its own
# workflow file, triggered ONLY by the events that can actually make it run,
# removes it from ci.yml's per-push/per-PR job list entirely.
#
# ONE FILE PER ON-DEMAND JOB, not a combined file with the two (this one +
# regenerate-constraints.yml) sharing one `workflow_dispatch` — see that
# file's own header for why: a shared file would still show one of the two
# jobs as permanently skipped on every run of the OTHER job, exactly the
# defect this split exists to remove.
#
# Carried over from ci.yml's top level (verified, not assumed — see the
# handoff report for the explicit per-setting walk-through): `permissions:
# contents: read` (this job needs no more) and `env: QT_QPA_PLATFORM:
# offscreen` (the smoke-launch steps below boot the packaged app headless —
# a genuine dependency, not a copy-over: see "Deterministic smoke" above).
# `PIP_DISABLE_PIP_VERSION_CHECK: "1"` is carried too (every pip install step
# below benefits the same way it did inside ci.yml). ci.yml's top-level
# `concurrency: ci-${{ github.ref }}` is NOT carried over: this job already
# declared its OWN per-OS concurrency group below (unchanged), which already
# overrode the shared guard even when this job lived inside ci.yml.
# =============================================================================
name: build-installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen        # headless Qt smoke-launch (F11)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # THE ONE PLACE the frozen-binary toolchain versions are written. The install
  # step installs `nuitka==${NUITKA_PIN}` and the drift-guard step right after
  # it asserts the INSTALLED version equals this value, so the two cannot
  # disagree; testing/suites/deploy/test_workflow_pip_pins.py fails if either
  # stops referencing the variable, if a literal version appears beside them,
  # or if the guard step is removed. Moving a pin is a deliberate edit that a
  # dispatch run must clear (Nuitka 4.3 built an app that segfaults at launch:
  # run 38187303442, 2026-10-12; 4.2.2 is the version that run 38225872233
  # proved on all three OS).
  NUITKA_PIN: "4.2.2"
  # pyside6-deploy pip-installs an UNVERSIONED `patchelf` on the Linux leg when
  # no `patchelf` Python package is present (measured in run 38225872233:
  # "Collecting patchelf" -> patchelf-0.19.1.0), so the install step installs
  # this exact version first and pyside6-deploy then finds it already present.
  PATCHELF_PIN: "0.19.1.0"

jobs:
  # ===========================================================================
  # Phase-13 (REQ-P13-BUILD-002/-003/-004/-005, ADR-0038): native
  # installer BUILD matrix. SEPARATE from the always-on quality-gate TEST matrix
  # in ci.yml so PR CI is not slowed by full packaging on every push. Runs ONLY
  # on a build/tag trigger (ADR-0038 §3): `workflow_dispatch` (manual) or a
  # `v*` tag push — this file's own `on:` trigger above scopes it (moved out
  # of ci.yml's job-level `if:`, this change 2026-09-01 — see this file's
  # header).
  #
  # One matrix over ubuntu/windows/macos builds all three native distributables
  # on their respective OS legs and publishes each as a downloadable artifact
  # (actions/upload-artifact). fail-fast is OFF so a per-leg build failure fails
  # THAT leg VISIBLY without cancelling the others (BUILD-005). Python version
  # is read from .python-version via python-version-file: (single parametric
  # source, see the file header), not pinned as a literal here.
  #
  # OWN, PER-OS concurrency group (BUILD-005, ADR-0038): the build matrix uses a
  # DISTINCT group (build-installers-<ref>-<os>) instead of inheriting the
  # top-level ci-<ref> quality-gate guard. A routine quality-gate push to the ref
  # therefore can no longer cancel an in-flight native-installer build (the
  # Windows+Linux legs of run 28888610411 were cancelled mid-Nuitka-compile by
  # exactly that shared-guard collision). The group MUST include ${{ matrix.os }}:
  # a job-level group that did not vary per leg would place all three matrix legs
  # in ONE group and cancel-in-progress would make them cancel EACH OTHER (run
  # 28891596191: the macos+ubuntu legs were cancelled at t=0 by the windows leg
  # entering the same group). Per-OS groups keep cancel-in-progress:true useful —
  # a NEW build dispatch's per-OS leg still supersedes a stale same-OS leg for the
  # ref — while letting all three legs of one dispatch run concurrently.
  #
  # Deterministic smoke: PIXELART_SMOKE_EXIT_MS makes the packaged app boot the
  # full UI + bundled Qt plugins headless (QT_QPA_PLATFORM=offscreen, global env)
  # then auto-quit with exit 0 — proving the frozen binary launches on a clean
  # runner without a display (the shipped pixelart_creator/ui/app.py:main honours
  # the env var). PIXELART_SMOKE_EXIT_MS is set at job env level below and is thus
  # inherited by every smoke step; each smoke step asserts a zero exit explicitly.
  # ===========================================================================
  # NOTE (2026-08-02, cost-avoidance change): left FUNCTIONAL, NOT disabled —
  # this matrix still targets three HOSTED runners (ubuntu/windows/macos-latest)
  # and WILL consume metered hosted minutes (macOS at ~10x, Windows at ~1.67x
  # the Linux minute) if a `v*` tag is pushed or this workflow is dispatched
  # manually. Not touched because tagging/manual-dispatch is a deliberate act,
  # unlike the always-on quality-gate matrix in ci.yml.
  build-installers:
    name: build-installers (${{ matrix.os }})
    # BUILD/TAG trigger only (ADR-0038 §3) — enforced by this FILE's own
    # `on:` trigger above (push tags: ["v*"], workflow_dispatch), not by a
    # job-level `if:` here any more: this job lived in ci.yml behind an `if:`
    # guard until this change (2026-09-01), which is exactly what made it list
    # as skipped on every ordinary push/PR run there. No `if:` is needed now
    # that the file itself only ever triggers on the two events this job is
    # meant for.
    # Isolated PER-OS concurrency group (see job header): distinct from the
    # top-level ci-<ref> quality-gate guard so a routine push to the ref cannot
    # cancel an in-flight installer build, and varied by ${{ matrix.os }} so the
    # three matrix legs do NOT share a group and cancel each other.
    # cancel-in-progress:true supersedes only a stale same-OS leg for the ref.
    concurrency:
      group: build-installers-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast OFF: a per-leg packaging failure must fail THAT leg visibly
      # without cancelling the other two legs (BUILD-005).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Nuitka compile times can be long per leg (ADR-0038 negative/risk); ample
    # cap, still far under the 6h default.
    timeout-minutes: 90
    env:
      # Credential-gated macOS signing (ADR-0038 §4, Article XI). ABSENT by
      # default → the signing step self-skips and the leg ships the unsigned/
      # ad-hoc artifact; its absence does NOT fail the build. NEVER commit a
      # credential — these read GitHub secrets at CI time only.
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      # Deterministic headless smoke-launch window (ms) — see job header.
      PIXELART_SMOKE_EXIT_MS: "5000"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CI temp root (CI-PixelArtCreator)
        # Same routing as the quality-gate job's identically-named step (see
        # that step's comment for the full rationale). Deterministic leg name
        # includes ${{ matrix.os }} so the three parallel legs (ubuntu/
        # windows/macos) never collide. This job runs no pytest, but Nuitka's
        # own C-build intermediates and pip's install scratch both honour
        # TMP/TEMP/TMPDIR, so they are routed here too rather than left on
        # whatever default the runner OS would otherwise use.
        run: |
          CI_TEMP_ROOT="${RUNNER_TEMP}/CI-PixelArtCreator/ci-build-installers-${{ matrix.os }}"
          rm -rf "${CI_TEMP_ROOT}"
          mkdir -p "${CI_TEMP_ROOT}"
          echo "CI_TEMP_ROOT=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TEMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMPDIR=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "CI temp root for this leg: ${CI_TEMP_ROOT}"

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      # Ubuntu: the same Qt runtime libs the test matrix installs (needed for
      # Nuitka to bundle Qt + for the offscreen smoke-launch) plus patchelf
      # (Nuitka standalone RPATH fixups + AppImage packaging).
      - name: Install Qt runtime OS libraries + patchelf (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            patchelf

      - name: Install project + packaging toolchain (pyside6-deploy / Nuitka)
        # -c constraints.txt on the project install only (R-11): pins the
        # same runtime-dependency versions as the quality-gate/integration
        # jobs so a packaged installer is built from the SAME resolved
        # numpy/Pillow/PySide6/pycrdt/websockets versions the test matrix
        # verified. Nuitka itself is a build-toolchain dep, not part of the
        # project's dependency closure (and constraints.txt is a generated
        # lock of that closure), so it is pinned HERE, by an exact `==`.
        #
        # EVERY package this step installs from an index carries an exact
        # `==` pin (REQ-VI-BUILD-006; enforced by testing/suites/deploy/
        # test_workflow_pip_pins.py). Why: with `pip install nuitka` unpinned,
        # the 2026-10-12 run resolved Nuitka 4.3 on all three legs, and the
        # frozen app then crashed at launch (exit 139, empty output) where the
        # same source built with 4.2.2 printed its font line and exited 0. The
        # 2026-09-25 runs that were green had resolved 4.2.2 (and pip 26.2.1).
        # Moving either pin is a deliberate edit that a dispatch run must
        # clear, not something an index change can do between two runs.
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -c constraints.txt -e .
          python -m pip install "nuitka==${NUITKA_PIN}"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            python -m pip install "patchelf==${PATCHELF_PIN}"
          fi
        # pyside6-deploy ships inside the PySide6 wheel (a project runtime dep);
        # pre-installing Nuitka keeps the build non-interactive & reproducible.

      # Runtime drift guard (user ruling 2026-10-22: a toolchain change must be
      # impossible to miss). The `==` pin above is only a request to pip; this
      # step asserts what pip actually LEFT INSTALLED, so a resolver or
      # transitive install that moved Nuitka (or patchelf) fails the leg HERE,
      # by name, instead of surfacing as a segfaulting frozen app ten minutes
      # and one compile later. No `if:`, no `continue-on-error`: it runs on
      # every leg, and the static test refuses a guard that can be skipped.
      - name: Verify the pinned build toolchain (drift guard)
        run: |
          nuitka_installed="$(python -c "from importlib.metadata import version; print(version('nuitka'))" 2>/dev/null)" || nuitka_installed="(not installed)"
          if [ "${nuitka_installed}" != "${NUITKA_PIN}" ]; then
            echo "::error::TOOLCHAIN DRIFT GUARD: the installed Nuitka is ${nuitka_installed} but this workflow pins ${NUITKA_PIN} (env NUITKA_PIN). A frozen app built with an unproven Nuitka is not shippable. Move the pin only deliberately, with a dispatch run that clears it."
            exit 1
          fi
          nuitka_cli="$(python -m nuitka --version | tr -d '\r' | sed -n 1p)"
          if [ "${nuitka_cli}" != "${NUITKA_PIN}" ]; then
            echo "::error::TOOLCHAIN DRIFT GUARD: 'python -m nuitka --version' reports ${nuitka_cli}, expected ${NUITKA_PIN} (env NUITKA_PIN)."
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            patchelf_installed="$(python -c "from importlib.metadata import version; print(version('patchelf'))" 2>/dev/null)" || patchelf_installed="(not installed)"
            if [ "${patchelf_installed}" != "${PATCHELF_PIN}" ]; then
              echo "::error::TOOLCHAIN DRIFT GUARD: the installed patchelf is ${patchelf_installed} but this workflow pins ${PATCHELF_PIN} (env PATCHELF_PIN)."
              exit 1
            fi
          fi
          echo "toolchain drift guard OK: nuitka ${nuitka_installed} == NUITKA_PIN"
          # Record the rest of the build-relevant toolchain in the log, so a
          # drift in any of it shows up in a diff of two runs even where it is
          # not asserted. Informational: grep finding nothing is not an error.
          python -m pip list --format=freeze | grep -i -E '^(nuitka|patchelf|zstandard|ordered-set|pyside6|pyside6-addons|pyside6-essentials|shiboken6|pip|setuptools|wheel)==' || true

      # ---------------- Windows leg (BUILD-002): onefile .exe --------
      - name: Build Windows .exe (pyside6-deploy / Nuitka onefile)
        if: runner.os == 'Windows'
        # `mkdir -p dist` FIRST: root cause of the v0.3.0 failure (run
        # 35941799524) was NOT the Nuitka compile (it completed -- the
        # 44 MB onefile payload was built) but pyside6-deploy's own
        # deploy_lib/deploy_util.py:finalize(), which for `mode = onefile`
        # copies the compiled exe into `exec_directory` with a plain
        # `shutil.copy(generated_exec_path, output_path)` -- unlike the
        # standalone/macOS path (`shutil.copytree(..., dirs_exist_ok=True)`,
        # used on the Linux/macOS legs below), `shutil.copy` does NOT create
        # a missing destination directory. `exec_directory = dist` in the
        # spec was never created by anything before this run, so finalize()
        # raised `FileNotFoundError: ... dist\PixelArtCreator.exe` AFTER a
        # successful compile, and `dist\PixelArtCreator.exe` was never
        # written at all (confirmed by reading PySide6's own
        # deploy_lib/deploy_util.py and config.py locally, matching the CI
        # traceback line-for-line).
        run: |
          mkdir -p dist
          pyside6-deploy -c packaging/pysidedeploy-windows.spec --force --keep-deployment-files
          mkdir -p artifact
          cp dist/PixelArtCreator.exe "artifact/PixelArtCreator-windows.exe"

      - name: Verify the pinned build toolchain after the build (Windows)
        if: runner.os == 'Windows'
        # The drift guard above, REPEATED after the freeze (user ruling
        # 2026-10-22: the pin must hold for the compile itself, not only at
        # install time). pyside6-deploy can pip-install or replace Nuitka (or,
        # on Linux, patchelf) while it builds, which would leave the version
        # checked above different from the one that made the binary. The `if:`
        # is the build step's own, so no leg that froze the app can skip this.
        run: |
          nuitka_installed="$(python -c "from importlib.metadata import version; print(version('nuitka'))" 2>/dev/null)" || nuitka_installed="(not installed)"
          if [ "${nuitka_installed}" != "${NUITKA_PIN}" ]; then
            echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed Nuitka is ${nuitka_installed} but this workflow pins ${NUITKA_PIN} (env NUITKA_PIN); the build step changed the toolchain that made this binary."
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            patchelf_installed="$(python -c "from importlib.metadata import version; print(version('patchelf'))" 2>/dev/null)" || patchelf_installed="(not installed)"
            if [ "${patchelf_installed}" != "${PATCHELF_PIN}" ]; then
              echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed patchelf is ${patchelf_installed} but this workflow pins ${PATCHELF_PIN} (env PATCHELF_PIN)."
              exit 1
            fi
          fi
          echo "toolchain drift guard after the build OK: nuitka ${nuitka_installed} == NUITKA_PIN"

      - name: Smoke-launch the Windows .exe (offscreen, auto-quit)
        if: runner.os == 'Windows'
        run: |
          BIN="./artifact/PixelArtCreator-windows.exe"
          echo "smoke binary: ${BIN}"
          SMOKE_OUT="${CI_TEMP_ROOT}/smoke-windows.out"
          rc=0
          "${BIN}" > "${SMOKE_OUT}" || rc=$?
          cat "${SMOKE_OUT}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Windows smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
          echo "smoke OK: launched offscreen and self-exited 0 (PIXELART_SMOKE_EXIT_MS)"
          # The app prints one `interface-font: <family>` line in smoke mode
          # (REQ-VI-BUILD-006). Asserting it is what proves the installed
          # build found its bundled typeface instead of falling back to a
          # system font. `tr -d '\r'`: a Windows console build ends its lines
          # with CRLF. The same assertion follows every smoke launch below.
          FONT_LINE="$(tr -d '\r' < "${SMOKE_OUT}" | grep '^interface-font:' || true)"
          if [ "${FONT_LINE}" != "interface-font: Nifen Art" ]; then
            echo "::error::smoke output must carry exactly one 'interface-font: Nifen Art' line; got: '${FONT_LINE}'"
            exit 1
          fi
          echo "smoke font line OK: ${FONT_LINE}"
        # Exit 0 proves the packaged onefile .exe started, loaded the offscreen
        # platform plugin + full UI, and quit cleanly via PIXELART_SMOKE_EXIT_MS;
        # any non-zero exit or crash fails this leg visibly.

      - name: Check the Windows payload (fonts, themes, licence notices)
        if: runner.os == 'Windows'
        # A onefile .exe cannot be listed from outside, so the check runs on
        # the folder Nuitka packed it from: `--keep-deployment-files` leaves
        # it on disk as a `<name>.dist` folder. The search is for those
        # folders and nowhere else, never the checkout, because the source
        # tree holds the same files and would pass for the wrong reason. If
        # no such folder exists the step fails and lists what does, rather
        # than pass on nothing. packaging/check_payload.sh compares every file
        # the repository ships under pixelart_creator/fonts and
        # pixelart_creator/themes, byte for byte, and checks the licence
        # notices in OFL.txt (REQ-VI-BUILD-005). The empty-folder control
        # shows the check can fail before its result is trusted.
        run: |
          DIST_DIRS="$(find . -maxdepth 4 -type d -name '*.dist' -not -path './.git/*')"
          if [ -z "${DIST_DIRS}" ]; then
            echo "::error::no *.dist folder under the checkout: the Nuitka output the .exe was packed from is not on disk, so its contents cannot be listed"
            find . -maxdepth 3 -type d \( -name deployment -o -name '*.build' -o -name '*.onefile-build' \) -not -path './.git/*' || true
            exit 1
          fi
          CONTROL_DIR="${CI_TEMP_ROOT}/payload-control-empty"
          mkdir -p "${CONTROL_DIR}"
          if bash packaging/check_payload.sh "${CONTROL_DIR}" "control: empty folder" > /dev/null 2>&1; then
            echo "::error::payload check control FAILED: an empty folder passed"
            exit 1
          fi
          echo "payload check control OK: an empty folder is refused"
          while IFS= read -r DIST_DIR; do
            bash packaging/check_payload.sh "${DIST_DIR}" "windows .exe payload"
          done <<< "${DIST_DIRS}"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-windows
          path: artifact/PixelArtCreator-windows.exe
          if-no-files-found: error

      # ---------------- Linux leg (BUILD-004): AppImage --------------
      - name: Build Linux standalone (pyside6-deploy / Nuitka)
        if: runner.os == 'Linux'
        run: pyside6-deploy -c packaging/pysidedeploy-linux.spec --force --keep-deployment-files

      - name: Verify the pinned build toolchain after the build (Linux)
        if: runner.os == 'Linux'
        # The drift guard above, REPEATED after the freeze (user ruling
        # 2026-10-22: the pin must hold for the compile itself, not only at
        # install time). pyside6-deploy can pip-install or replace Nuitka (or,
        # on Linux, patchelf) while it builds, which would leave the version
        # checked above different from the one that made the binary. The `if:`
        # is the build step's own, so no leg that froze the app can skip this.
        run: |
          nuitka_installed="$(python -c "from importlib.metadata import version; print(version('nuitka'))" 2>/dev/null)" || nuitka_installed="(not installed)"
          if [ "${nuitka_installed}" != "${NUITKA_PIN}" ]; then
            echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed Nuitka is ${nuitka_installed} but this workflow pins ${NUITKA_PIN} (env NUITKA_PIN); the build step changed the toolchain that made this binary."
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            patchelf_installed="$(python -c "from importlib.metadata import version; print(version('patchelf'))" 2>/dev/null)" || patchelf_installed="(not installed)"
            if [ "${patchelf_installed}" != "${PATCHELF_PIN}" ]; then
              echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed patchelf is ${patchelf_installed} but this workflow pins ${PATCHELF_PIN} (env PATCHELF_PIN)."
              exit 1
            fi
          fi
          echo "toolchain drift guard after the build OK: nuitka ${nuitka_installed} == NUITKA_PIN"

      - name: Smoke-launch the Linux standalone binary (offscreen, auto-quit)
        if: runner.os == 'Linux'
        run: |
          # pyside6-deploy's own deploy_lib/deploy_util.py:finalize() copies
          # Nuitka's compiled standalone dist folder into `exec_directory`
          # renamed to the spec's `title` + ".dist"
          # (`shutil.copytree(generated_exec_path, exe_dir / (title +
          # ".dist"))`), confirmed by this leg's own build log: "[DEPLOY]
          # Executed file created in .../dist/PixelArtCreator.dist". `title =
          # PixelArtCreator` in pysidedeploy-linux.spec, so the folder is
          # dist/PixelArtCreator.dist -- NOT dist/__main__.dist (v0.3.0 run
          # 35941799524's assumption). The binary INSIDE that folder is NOT
          # assumed by name (a prior fix guessed `__main__`, matching the
          # pre-copy Nuitka name, and that guess was wrong too -- measured
          # via run 35995818253: the folder existed, the guessed binary name
          # did not). Instead it is DISCOVERED the same way the macOS leg
          # below discovers its inner Mach-O: the one top-level executable
          # regular file that is not a shared library.
          DIST_DIR="dist/PixelArtCreator.dist"
          if [ ! -d "${DIST_DIR}" ]; then
            echo "::error::standalone dist folder not found at ${DIST_DIR}"
            find dist -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "dist folder contents:"
          ls -la "${DIST_DIR}"
          BIN="$(find "${DIST_DIR}" -maxdepth 1 -type f -perm -u+x ! -name '*.so*' | head -n1)"
          if [ -z "${BIN}" ]; then
            echo "::error::no executable binary found at the top level of ${DIST_DIR}"
            exit 1
          fi
          echo "smoke binary: ${BIN}"
          SMOKE_OUT="${CI_TEMP_ROOT}/smoke-linux-standalone.out"
          rc=0
          "${BIN}" > "${SMOKE_OUT}" || rc=$?
          cat "${SMOKE_OUT}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Linux standalone smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
          echo "smoke OK: launched offscreen and self-exited 0 (PIXELART_SMOKE_EXIT_MS)"
          # The smoke output must carry the interface-font line (see the
          # Windows smoke step above for why).
          FONT_LINE="$(grep '^interface-font:' "${SMOKE_OUT}" || true)"
          if [ "${FONT_LINE}" != "interface-font: Nifen Art" ]; then
            echo "::error::smoke output must carry exactly one 'interface-font: Nifen Art' line; got: '${FONT_LINE}'"
            exit 1
          fi
          echo "smoke font line OK: ${FONT_LINE}"

      - name: Package Linux AppImage (appimagetool)
        if: runner.os == 'Linux'
        run: bash packaging/build_appimage.sh

      - name: Check the AppImage payload (fonts, themes, licence notices)
        if: runner.os == 'Linux'
        # The AppImage is unpacked with its own runtime (`--appimage-extract`
        # needs no FUSE) into the CI temp root, and the unpacked tree is what
        # packaging/check_payload.sh examines (REQ-VI-BUILD-005): every file
        # the repository ships under pixelart_creator/fonts and
        # pixelart_creator/themes, byte for byte, plus the licence notices in
        # OFL.txt. The empty-folder control shows the check can fail before
        # its result is trusted.
        run: |
          chmod +x artifact/PixelArtCreator-x86_64.AppImage
          APPIMAGE="$(pwd)/artifact/PixelArtCreator-x86_64.AppImage"
          EXTRACT_DIR="${CI_TEMP_ROOT}/appimage-extract"
          rm -rf "${EXTRACT_DIR}"
          mkdir -p "${EXTRACT_DIR}"
          (cd "${EXTRACT_DIR}" && "${APPIMAGE}" --appimage-extract > /dev/null)
          CONTROL_DIR="${CI_TEMP_ROOT}/payload-control-empty"
          mkdir -p "${CONTROL_DIR}"
          if bash packaging/check_payload.sh "${CONTROL_DIR}" "control: empty folder" > /dev/null 2>&1; then
            echo "::error::payload check control FAILED: an empty folder passed"
            exit 1
          fi
          echo "payload check control OK: an empty folder is refused"
          bash packaging/check_payload.sh "${EXTRACT_DIR}/squashfs-root" "linux AppImage"

      - name: Smoke-launch the AppImage (offscreen, auto-quit)
        if: runner.os == 'Linux'
        run: |
          chmod +x artifact/PixelArtCreator-x86_64.AppImage
          # --appimage-extract-and-run is intercepted by the AppImage runtime
          # (FUSE-free); AppRun then execs usr/bin/__main__, which self-exits via
          # PIXELART_SMOKE_EXIT_MS.
          SMOKE_OUT="${CI_TEMP_ROOT}/smoke-linux-appimage.out"
          rc=0
          ./artifact/PixelArtCreator-x86_64.AppImage --appimage-extract-and-run > "${SMOKE_OUT}" || rc=$?
          cat "${SMOKE_OUT}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::Linux AppImage smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
          echo "smoke OK: AppImage launched offscreen and self-exited 0"
          FONT_LINE="$(grep '^interface-font:' "${SMOKE_OUT}" || true)"
          if [ "${FONT_LINE}" != "interface-font: Nifen Art" ]; then
            echo "::error::smoke output must carry exactly one 'interface-font: Nifen Art' line; got: '${FONT_LINE}'"
            exit 1
          fi
          echo "smoke font line OK: ${FONT_LINE}"

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-linux
          path: artifact/PixelArtCreator-x86_64.AppImage
          if-no-files-found: error

      # ---------------- macOS leg (BUILD-003): .app in .dmg ----------
      - name: Build macOS .app (pyside6-deploy / Nuitka standalone bundle)
        if: runner.os == 'macOS'
        run: pyside6-deploy -c packaging/pysidedeploy-macos.spec --force --keep-deployment-files

      - name: Verify the pinned build toolchain after the build (macOS)
        if: runner.os == 'macOS'
        # The drift guard above, REPEATED after the freeze (user ruling
        # 2026-10-22: the pin must hold for the compile itself, not only at
        # install time). pyside6-deploy can pip-install or replace Nuitka (or,
        # on Linux, patchelf) while it builds, which would leave the version
        # checked above different from the one that made the binary. The `if:`
        # is the build step's own, so no leg that froze the app can skip this.
        run: |
          nuitka_installed="$(python -c "from importlib.metadata import version; print(version('nuitka'))" 2>/dev/null)" || nuitka_installed="(not installed)"
          if [ "${nuitka_installed}" != "${NUITKA_PIN}" ]; then
            echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed Nuitka is ${nuitka_installed} but this workflow pins ${NUITKA_PIN} (env NUITKA_PIN); the build step changed the toolchain that made this binary."
            exit 1
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            patchelf_installed="$(python -c "from importlib.metadata import version; print(version('patchelf'))" 2>/dev/null)" || patchelf_installed="(not installed)"
            if [ "${patchelf_installed}" != "${PATCHELF_PIN}" ]; then
              echo "::error::TOOLCHAIN DRIFT GUARD (after the build): the installed patchelf is ${patchelf_installed} but this workflow pins ${PATCHELF_PIN} (env PATCHELF_PIN)."
              exit 1
            fi
          fi
          echo "toolchain drift guard after the build OK: nuitka ${nuitka_installed} == NUITKA_PIN"

      - name: Assert macOS Info.plist CFBundleName (ADR-0067 R-3)
        # Durable gate, not a one-off probe: Qt's Cocoa platform plugin builds
        # the application-menu "About %1" text from CFBundleName
        # (qcocoahelpers.mm), so a regression here (e.g. a future edit to
        # packaging/pysidedeploy-macos.spec dropping --macos-app-name) must
        # fail the build rather than ship a wrong About entry silently. Reads
        # the value straight out of the built bundle's own Info.plist with
        # PlistBuddy (present on every macOS runner image) and prints it
        # quoted before asserting, so a failing run always shows the actual
        # value, never just "differs".
        if: runner.os == 'macOS'
        run: |
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n1)"
          PLIST="${APP}/Contents/Info.plist"
          CFBUNDLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "${PLIST}")"
          echo "CFBundleName (read from ${PLIST}): \"${CFBUNDLE_NAME}\""
          if [[ "${CFBUNDLE_NAME}" != "PixelArt Creator" ]]; then
            echo "::error::CFBundleName is \"${CFBUNDLE_NAME}\", expected \"PixelArt Creator\" -- Qt's macOS About entry reads \"About %1\" from CFBundleName (ADR-0067 R-3). Check packaging/pysidedeploy-macos.spec's --macos-app-name option."
            exit 1
          fi
          echo "CFBundleName check OK: \"${CFBUNDLE_NAME}\""

      - name: Ad-hoc sign + smoke-launch + wrap .dmg (unsigned baseline)
        if: runner.os == 'macOS'
        run: |
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n1)"
          echo "app bundle: ${APP}"
          # Ad-hoc sign so a local run of the unsigned build is permitted.
          codesign --force --deep --sign - "${APP}"
          # Smoke: launch the inner binary offscreen (auto-quits via env). The
          # standalone .app's inner Mach-O is located inside the bundle, so the
          # produced-artifact path is discovered via `find`, not a fixed stem.
          BIN="$(find "${APP}/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n1)"
          echo "smoke binary: ${BIN}"
          SMOKE_OUT="${CI_TEMP_ROOT}/smoke-macos.out"
          rc=0
          "${BIN}" > "${SMOKE_OUT}" || rc=$?
          cat "${SMOKE_OUT}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::macOS .app smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
          echo "smoke OK: .app inner binary launched offscreen and self-exited 0"
          # The smoke output must carry the interface-font line (see the
          # Windows smoke step above for why).
          FONT_LINE="$(grep '^interface-font:' "${SMOKE_OUT}" || true)"
          if [ "${FONT_LINE}" != "interface-font: Nifen Art" ]; then
            echo "::error::smoke output must carry exactly one 'interface-font: Nifen Art' line; got: '${FONT_LINE}'"
            exit 1
          fi
          echo "smoke font line OK: ${FONT_LINE}"
          mkdir -p artifact
          hdiutil create -volname "PixelArt Creator" -srcfolder "${APP}" \
            -ov -format UDZO artifact/PixelArtCreator-macos.dmg

      - name: Developer-ID sign + notarize + staple (runs only when credentials are configured; a failure fails the build)
        # Runs ONLY when an Apple Developer ID secret is supplied (ADR-0038 §4,
        # Article XI). Its ABSENCE self-skips this step and does NOT fail the leg
        # — the unsigned/ad-hoc .dmg above is the accepted Phase-13 artifact.
        # When the secret IS configured the step runs, and if it fails the leg
        # fails and the build is not green: nothing here is advisory, and no
        # `continue-on-error` may be added to it.
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID != '' }}
        run: |
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n1)"
          codesign --force --deep --options=runtime --timestamp \
            --sign "${APPLE_DEVELOPER_ID}" "${APP}"
          hdiutil create -volname "PixelArt Creator" -srcfolder "${APP}" \
            -ov -format UDZO artifact/PixelArtCreator-macos.dmg
          xcrun notarytool submit artifact/PixelArtCreator-macos.dmg \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --team-id "${APPLE_NOTARY_TEAM_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" --wait
          xcrun stapler staple artifact/PixelArtCreator-macos.dmg

      - name: Check the macOS .dmg payload (fonts, themes, licence notices)
        if: runner.os == 'macOS'
        # Runs after the optional Developer-ID step, so it examines the .dmg
        # that is uploaded, whichever step wrote it last. The .dmg is mounted
        # read-only and hidden from the Finder, and
        # packaging/check_payload.sh examines the mounted volume
        # (REQ-VI-BUILD-005): every file the repository ships under
        # pixelart_creator/fonts and pixelart_creator/themes, byte for byte,
        # plus the licence notices in OFL.txt. The volume is always detached
        # again, and the check's own result is what the step returns. The
        # empty-folder control shows the check can fail before its result is
        # trusted.
        run: |
          CONTROL_DIR="${CI_TEMP_ROOT}/payload-control-empty"
          mkdir -p "${CONTROL_DIR}"
          if bash packaging/check_payload.sh "${CONTROL_DIR}" "control: empty folder" > /dev/null 2>&1; then
            echo "::error::payload check control FAILED: an empty folder passed"
            exit 1
          fi
          echo "payload check control OK: an empty folder is refused"
          MOUNT_DIR="${CI_TEMP_ROOT}/dmg-mount"
          mkdir -p "${MOUNT_DIR}"
          hdiutil attach artifact/PixelArtCreator-macos.dmg -readonly -nobrowse -noverify -mountpoint "${MOUNT_DIR}"
          rc=0
          bash packaging/check_payload.sh "${MOUNT_DIR}" "macOS .dmg" || rc=$?
          hdiutil detach "${MOUNT_DIR}" || hdiutil detach "${MOUNT_DIR}" -force
          exit "${rc}"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-macos
          path: artifact/PixelArtCreator-macos.dmg
          if-no-files-found: error

      - name: Clean up CI temp root (CI-PixelArtCreator)
        # Same guard shape as the quality-gate job's identically-named step:
        # if: always() so a failed/cancelled leg still cleans up; refuses to
        # delete unless CI_TEMP_ROOT is non-empty, under ${RUNNER_TEMP}, and
        # still shaped CI-PixelArtCreator/<name>; reads the SAME exported
        # variable rather than recomputing the path; no wildcard. Runs on
        # every OS leg of this matrix — the guard and the variable are
        # OS-invariant even though `rm -rf`/`mkdir -p` are POSIX commands,
        # because `defaults.run.shell: bash` (job-level, above) makes every
        # step in this job — Windows included — run under bash.
        if: always()
        run: |
          if [[ -z "${CI_TEMP_ROOT:-}" ]]; then
            echo "::error::CI_TEMP_ROOT is not set; refusing to guess a path to delete."
            exit 1
          fi
          case "${CI_TEMP_ROOT}" in
            "${RUNNER_TEMP}"/CI-PixelArtCreator/*) ;;
            *)
              echo "::error::CI_TEMP_ROOT (${CI_TEMP_ROOT}) does not resolve under \${RUNNER_TEMP}/CI-PixelArtCreator/<name>; refusing to delete."
              exit 1
              ;;
          esac
          if [[ -d "${CI_TEMP_ROOT}" ]]; then
            echo "Removing CI temp root: ${CI_TEMP_ROOT}"
            rm -rf "${CI_TEMP_ROOT}"
            echo "Removed: ${CI_TEMP_ROOT}"
          else
            echo "CI temp root already absent (nothing to remove): ${CI_TEMP_ROOT}"
          fi

  # ===========================================================================
  # publish-release: creates a GitHub Release from the pushed `v*` tag,
  # attaching the three installer artifacts the matrix above just built and
  # generating release notes by extracting that version's OWN section out of
  # CHANGELOG.md (repo root — Keep a Changelog format, the `changelog`
  # skill's own `## [X.Y.Z] - YYYY-MM-DD` heading shape — see that file for
  # the pattern). REPO-ROOT PATH, VERIFIED, NOT `docs/CHANGELOG.md`: `docs/*`
  # is gitignored (`.gitignore:144`) and the file actually tracked by git is
  # `CHANGELOG.md` at the repository root (`git ls-files | grep -i
  # changelog` -> exactly one hit); a stray, untracked, gitignored
  # `docs/CHANGELOG.md` copy exists locally on disk but ships in no clone and
  # no CI checkout, so pointing this step at it would silently read a copy
  # nobody else has.
  #
  # TAG-PUSH ONLY, twice over: this file's own `on:` block (top of file)
  # already scopes the WHOLE workflow to `push: tags: ["v*"]` +
  # `workflow_dispatch`, and the job-level `if:` below narrows this ONE job
  # further so a manual `workflow_dispatch` run — which still exercises the
  # full install/build/smoke matrix above, unattached to any tag — never
  # publishes a release for it (a `workflow_dispatch` run has no
  # `refs/tags/` ref to satisfy `startsWith`, so the condition is false by
  # construction, not by a separate event-name check).
  #
  # `needs: build-installers` (the full 3-OS build matrix, `fail-fast:
  # false`): GitHub's own default `needs` gate blocks this job unless every
  # job it depends on SUCCEEDED, so a single red leg stops the release from
  # publishing at all — the release is never shipped with two installers and
  # a silently missing third.
  #
  # `contents: write` is scoped to THIS job only (job-level `permissions:`
  # override), never at the workflow top level — every other job in this
  # file keeps the top-level `contents: read`, and this is the one step in
  # the whole pipeline that needs to create a release object in the
  # repository.
  # ===========================================================================
  publish-release:
    name: publish-release
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all installer artifacts
        # No `name:` input -> downloads every artifact from this run, each
        # into its own `artifacts/<artifact-name>/` subdirectory (the three
        # names the build-installers matrix uploaded above: pixelart-
        # creator-windows, pixelart-creator-linux, pixelart-creator-macos).
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract this version's release notes from CHANGELOG.md
        # Small inline script (awk, no new dependency): captures every line
        # between the target version's own `## [X.Y.Z]` heading (exclusive)
        # and the NEXT `## [` heading (exclusive) — i.e. exactly that
        # version's Keep a Changelog section body, nothing more. The
        # version-heading match is a LITERAL prefix comparison
        # (`index($0, heading) == 1`), not a regex built from the version
        # string: an earlier draft built a dynamic regex with hand-escaped
        # dots and tripped this awk implementation's own escape-sequence
        # handling (`\\[`/`\\]` silently lost their backslash and became
        # bare regex metacharacters — verified interactively before this
        # landed, not assumed). `index()` needs no escaping and cannot
        # misfire on a version string containing regex metacharacters.
        # FAILS LOUDLY (`::error::` + non-zero exit) if no such heading
        # exists or the captured body is empty — a release must never
        # publish with fabricated or silently-missing notes.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v version="${VERSION}" '
            BEGIN { found = 0; capturing = 0; heading = "## [" version "]" }
            /^## \[/ {
              if (capturing) { exit }
              if (index($0, heading) == 1) { capturing = 1; found = 1; next }
            }
            capturing { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md || {
            echo "::error::No '## [${VERSION}]' section found in CHANGELOG.md for tag ${TAG} -- refusing to publish a release with fabricated or missing notes. Add the version's Keep a Changelog section (the 'changelog' skill's own heading shape) before re-tagging."
            exit 1
          }
          if [[ ! -s notes.md ]]; then
            echo "::error::'## [${VERSION}]' heading found in CHANGELOG.md but its section body is empty -- refusing to publish a release with empty notes."
            exit 1
          fi
          echo "extracted $(wc -l < notes.md) line(s) of release notes for version ${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release create "${TAG}" \
            artifacts/pixelart-creator-windows/PixelArtCreator-windows.exe \
            artifacts/pixelart-creator-linux/PixelArtCreator-x86_64.AppImage \
            artifacts/pixelart-creator-macos/PixelArtCreator-macos.dmg \
            --verify-tag \
            --notes-file notes.md \
            --title "PixelArt Creator ${VERSION}"
