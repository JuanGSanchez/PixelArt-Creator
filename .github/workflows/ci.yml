# =============================================================================
# CI pipeline (GitHub Actions) — PixelArt Creator
# Owned by the GitHub/DevOps role. Grounded by F11 (headless PySide6 CI) + F14
# (pyproject manifest). Mandatory software-dev extension (spec-driven-development
# .md §5) — may not be scoped out.
#
# Runs on push + pull_request: installs the project from pyproject.toml into a
# clean runner, then runs the full quality gate HEADLESS (QT_QPA_PLATFORM=
# offscreen) with the OS libraries PySide6 needs. Python version is a SINGLE
# PARAMETRIC SOURCE, not a literal pinned here: every actions/setup-python
# site below reads it from the repository's own .python-version file via
# the `python-version-file:` input, so bumping the interpreter is a one-file
# change (CI-STANDARDIZATION, 2026-08-24) instead of four hand-edited sites.
# A single-run concurrency guard cancels superseded runs for the same ref.
#
# REPRODUCIBILITY (constraints.txt): every `pip install -e ...` step
# below also passes `-c constraints.txt` — a committed, regenerable pip
# constraints file pinning the FULL resolved dependency closure (direct +
# transitive, 53 packages) so every CI run and every developer installs the
# SAME versions instead of re-resolving pyproject.toml's floors against
# whatever is newest on PyPI that day. pyproject.toml's public `dependencies`
# floors are UNCHANGED by this — see constraints.txt's own header for the
# mechanism, the exact regeneration command, and why one file safely serves
# all three OS legs of the matrix below.
#
# Phase-13 (REQ-P13-BUILD-001): the quality-gate job is a
# 3-OS matrix — ubuntu-latest + windows-latest + macos-latest — each leg running
# the FULL test suite headless (QT_QPA_PLATFORM=offscreen; the SAME pytest
# invocation on every OS via `shell: bash`) so the platform is provably portable
# (plan §3.1). The static/lint/type/coverage gates and the calibrated perf gates
# stay Ubuntu-only (`if: runner.os == 'Linux'`) — the perf ceilings are tuned to
# the Ubuntu runner and the source-lint results are OS-invariant. fail-fast is
# OFF so a genuine Windows/macOS regression does not cancel the other legs (each
# leg's result is captured). The Ubuntu Qt apt install is Linux-guarded; Windows
# and macOS need no extra system libs for offscreen Qt. Concurrency guard
# preserved; the Python version is no longer a literal pin here — see the
# single-parametric-source note above (.python-version via
# python-version-file:).
# =============================================================================
name: ci

on:
  push:
    # NARROWED TO `main` ONLY (this change, 2026-09-01) — previously
    # `[main, "feat-*", "fix-*"]`, so a bookkeeping commit on a branch that
    # already had an open pull request fired BOTH a `push` run and a
    # `pull_request` run for the SAME commit, duplicating the full 3-OS
    # matrix. Measured on `fix-memory-map-after-merge`: runs `33443984892`
    # (push) and `33443990141` (pull_request), both complete, both green, for
    # one commit. Merging then fired a THIRD full 3-OS matrix on `main`,
    # re-testing code the pull request had already cleared — one trivial
    # change cost three complete matrices. `main` carries a no-bypass
    # ruleset, so every commit that reaches it is a PR merge, never a direct
    # push; narrowing `push` to `main` removes the feature-branch duplicate
    # entirely and leaves exactly one run per feature-branch commit (from
    # `pull_request`) plus one lightweight post-merge canary run (from
    # `push`, see the `setup` job below for how that run is scoped down).
    #
    # GROUNDING (research on GitHub Actions trigger scoping,
    # Q1): the `branches` filter MECHANISM is officially documented
    # ("Workflow syntax for GitHub Actions", docs.github.com). Naming
    # "restrict `push` to `main`, leave `pull_request` unrestricted" as *the*
    # documented fix for push/pull_request duplication is NOT found in
    # GitHub's own docs — that framing is community corroboration only (a
    # named blog post + a GitHub Community discussion), flagged low
    # reliability. It is applied here because it follows
    # directly from the documented filter semantics plus the duplicate-run
    # evidence measured above, not because GitHub names it as "the" fix —
    # do not restate it elsewhere as officially documented.
    #
    # STALE COMMENT CORRECTED: a prior version of this block called the
    # `feat-*`/`fix-*` push filter a "PERMANENT" convention from 2026-08-02
    # that survived an earlier revert untouched. That claim no longer holds —
    # this change removes those patterns from `push` outright. The
    # underlying branch-naming convention itself (hyphen, never a slash — a
    # documented container-level layout rule, not something this workflow
    # enforces) is unaffected and still governs how branches are named; only
    # this workflow's `push` trigger no longer filters on it. Recorded here
    # rather than left silently contradicted, because a stale comment
    # asserting the opposite of the file is worse than no comment at all.
    branches: [main]
  pull_request:
    branches: [main]
  # Manual dispatch re-runs quality-gate + integration for this ref on
  # demand (e.g. retrying after a transient infra failure) without a new
  # push. No inputs: the on-demand release/maintenance jobs that used to
  # share this trigger via a `target` chooser input -- build-installers and
  # regenerate-constraints -- moved to their own dedicated workflow files
  # (this change, 2026-09-01), each self-triggering on workflow_dispatch in
  # its OWN file, so this input had nothing left to select between and is
  # removed rather than left as a chooser that selects nothing. See
  # .github/workflows/build-installers.yml and
  # .github/workflows/regenerate-constraints.yml.
  workflow_dispatch:

# Single-run concurrency guard: a new run for the same ref cancels the older one
# so two runs never contend for a shared runner (flaky-timeout avoidance, F11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen        # headless Qt (F11)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ===========================================================================
  # Event-conditional OS matrix for quality-gate (this change, 2026-09-01):
  # `pull_request` always gets the full 3-OS matrix — `main`'s ruleset
  # requires `quality-gate (ubuntu-latest)` / `(windows-latest)` /
  # `(macos-latest)` by exact job name, with NO bypass, so a pull request
  # missing any one of the three would block merging indefinitely. Per
  # docs.github.com's own troubleshooting page (research finding Q3,
  # verbatim): a job skipped by `if:` reports Success and does not block
  # merging, but a matrix leg that is never PRODUCED at all leaves its
  # required check PENDING and blocks merging indefinitely — remediation
  # stated on that same page: "Avoid requiring workflows that can be
  # skipped." So this reduction NEVER touches the `pull_request` matrix; it
  # only shrinks the matrix on every OTHER trigger (post-merge `push` to
  # `main`, `workflow_dispatch`), where nothing is required-check-gated and
  # the content was already fully tested by the `pull_request` run that
  # gated the merge — re-testing it on Windows/macOS a second time is
  # exactly the inverted weighting this change fixes.
  #
  # GROUNDING (research finding Q2): the
  # `${{ cond && fromJSON('[...]') || fromJSON('[...]') }}` ternary idiom in
  # matrix position is NOT documented — no operator-precedence table or
  # worked ternary example was found on the official expressions-reference
  # page. What that same page DOES demonstrate is a job that computes a
  # matrix and exposes it via `outputs`, consumed downstream via
  # `${{ fromJSON(needs.<job>.outputs.<name>) }}` — that documented pattern
  # is what this job implements, not the ternary idiom.
  #
  # FAILURE MODE, WRITTEN DOWN: if this job itself fails, `quality-gate`
  # never runs (it `needs: setup`), so none of its three required checks are
  # ever produced for that pull request, and `main`'s no-bypass ruleset means
  # the PR cannot merge until a new run succeeds. Accepted trade — this job's
  # only work is reading `github.event_name`, a value GitHub itself supplies
  # for every run and that cannot be absent or malformed.
  # ===========================================================================
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set-os.outputs.os }}
    steps:
      - name: Determine quality-gate OS matrix by trigger event
        id: set-os
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'os=["ubuntu-latest", "windows-latest", "macos-latest"]' >> "${GITHUB_OUTPUT}"
          else
            # Post-merge push leg runs on windows-latest, NOT
            # ubuntu-latest (changed 2026-09-01, maintainer decision after
            # inspecting the CI run lists) -- only the OS picked here
            # changed; the `pull_request` branch above is untouched, still
            # the full 3-OS matrix `main`'s ruleset requires.
            # `integration (ubuntu-latest)` is unaffected by this change and
            # stays on push unconditionally (see that job below) -- the
            # maintainer's own explicit call: it costs about a minute and is
            # a cheap post-merge canary.
            echo 'os=["windows-latest"]' >> "${GITHUB_OUTPUT}"
          fi

  quality-gate:
    name: quality-gate (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast OFF: a genuine platform-specific regression on one leg must NOT
      # cancel the other legs — we need every OS's result (13A discovery signal,
      # BUILD-001). Windows/macOS surface the suite for the FIRST time here.
      fail-fast: false
      matrix:
        # Resolved from the `setup` job's outputs (pull_request leg
        # unchanged; the other-trigger leg changed from ubuntu-latest to
        # windows-latest 2026-09-01, maintainer decision):
        # ["ubuntu-latest","windows-latest","macos-latest"] on `pull_request`,
        # ["windows-latest"] on every other trigger. Full grounding and the
        # accepted failure mode are recorded on the `setup` job above.
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    # Job-level wall-clock cap: a hung/deadlocked test can no longer pin a runner
    # for ~6h. The full offscreen-Qt UI suite measures ~46-48 min on the 2-core
    # Ubuntu runner (see run 28635312681, cancelled at 98% by an earlier 45-min
    # cap), so this is set comfortably above that with headroom for runner
    # variance (Windows/macOS runners vary). The per-test --timeout below (120s,
    # thread) is the fine-grained guard that fails fast and names a genuinely hung
    # test; this job cap is only the coarse backstop (FU-12).
    # Raised 75 -> 100 (maintainer ruling 2026-10-12): the Windows leg's pytest
    # grew to about 70 minutes, which left no headroom under 75. The cap stays a
    # runaway guard ONLY; the per-test --timeout and every quality gate are
    # unchanged.
    timeout-minutes: 100
    # Run every step under bash on ALL three OSes so the SAME pytest invocation
    # (with `\` line continuations) executes identically — the Windows default
    # shell (pwsh) would otherwise break the multi-line command (portability).
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 (full history), NOT the actions/checkout default
          # (depth-1 shallow clone). testing/suites/ui/test_input_scheme_regression.py
          # hardcodes commit 1244cd5 and shells out to `git diff --name-only
          # 1244cd5 HEAD -- web_viewer sync_backend`, which needs that commit
          # to exist in the local object graph. A depth-1 clone does not
          # contain it (`exit status 128`) -- this passed for a month only
          # because the retired self-hosted runner reused a persistent
          # workspace that still held full history; a hosted runner clones
          # fresh every time (measured: run 33427869334, all three
          # quality-gate legs, 4 log hits each). Scoped to THIS job only: the
          # `integration` job below never collects testing/suites/ui, so it
          # has no need of full history and keeps the cheaper shallow clone.
          # Repository cost is negligible (~510 commits).
          fetch-depth: 0

      # PRE-FLIGHT DIAGNOSTIC, not a repair: `shell: powershell` overrides the
      # job default for this ONE step so it can run before bash exists at all.
      # It reports whether bash is resolvable on this runner's own PATH before
      # any `shell: bash` step below depends on it, failing fast with a named
      # cause instead of a bare "command not found" one step later. On every
      # hosted `windows-latest` leg this is a documented no-op (Git for Windows
      # ships on PATH there already) — kept in place as a harmless safety net,
      # not removed merely because its history once involved a runner that no
      # longer exists here. Not added to the `build-installers`/
      # `regenerate-constraints` jobs below, whose hosted-only Windows/Linux
      # legs carry no evidence of ever needing it.
      - name: "Diagnose Git-for-Windows bash resolvability (does NOT repair 'shell: bash')"
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Get-Command bash -ErrorAction SilentlyContinue) {
            Write-Host "bash already resolvable on the runner's own PATH -- 'shell: bash' steps in this job will work. Nothing to do."
            exit 0
          }
          $candidates = @(
            "C:\Program Files\Git",
            "C:\Program Files (x86)\Git"
          )
          $gitRoot = $candidates | Where-Object { Test-Path (Join-Path $_ "bin\bash.exe") } | Select-Object -First 1
          if (-not $gitRoot) {
            Write-Host "::error::Git for Windows was not found at any known location ($($candidates -join ', ')), so this job's 'shell: bash' steps have no bash.exe to run. Install Git for Windows on this runner (https://git-scm.com/download/win) -- required, not optional, for this workflow -- then re-run."
            exit 1
          }
          $binDir = Join-Path $gitRoot "bin"
          $usrBinDir = Join-Path $gitRoot "usr\bin"
          $newPath = "$($env:PATH);$binDir;$usrBinDir"
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$newPath"
          Write-Host "Found Git for Windows at $gitRoot. Appended $binDir and $usrBinDir to PATH via GITHUB_ENV for the rest of this job -- but that ONLY helps a step whose own shell is not bash and that shells out to bash itself. It CANNOT make 'shell: bash' steps in this job work: GitHub Actions resolves that interpreter from the runner service's OWN process PATH before any step (including this one) runs, and a job-level PATH edit can never reach that lookup. On a hosted windows-latest runner this branch should not normally be reached at all -- Git for Windows ships preinstalled and is already resolvable via 'Get-Command bash' (see the branch above) -- so arriving here means this hosted image's bundled Git for Windows was not found at either checked location. There is no persistent machine to reconfigure and no local service to restart: every hosted run is a fresh, disposable VM, so a PATH edit made here would not even survive past this run. Failing this job now, with this cause named, instead of letting it repeat the bare 'bash: command not found' one step later."
          exit 1

      - name: Set up CI temp root (CI-PixelArtCreator)
        # CI temp standardization (supersedes the previous D:\tmp\ci\<workflow>-
        # <job> naming): the root is ONE product-owned segment under the
        # runner's OWN ${RUNNER_TEMP} -- no drive letter and no other path
        # segment is hardcoded into this file (the segment below,
        # "CI-PixelArtCreator/<leg name>", is the only literal contributed
        # here). The leg-scoped name (workflow job + matrix leg, no run id or
        # timestamp) is DETERMINISTIC, so a re-run of the same leg resolves to
        # the identical path; the `rm -rf` before `mkdir -p` makes that an
        # OVERWRITE, not an accumulation, of whatever a previous run left (the
        # ~68 randomly-named dirs + stray `pytest-of-<machine>` tree a prior audit
        # recorded). Every temp-producing surface in this job is routed under
        # this one root: the pytest steps below via --basetemp, and the
        # process TMP/TEMP/TMPDIR env so a bare `tempfile.mkdtemp()` call
        # inside a test (not just the pytest-managed tmp_path) lands here too
        # -- a --basetemp alone does not catch that. The final cleanup step
        # below deletes this same root again by reading the CI_TEMP_ROOT
        # variable exported here, never a re-typed path.
        run: |
          CI_TEMP_ROOT="${RUNNER_TEMP}/CI-PixelArtCreator/ci-quality-gate-${{ matrix.os }}"
          rm -rf "${CI_TEMP_ROOT}"
          mkdir -p "${CI_TEMP_ROOT}"
          echo "CI_TEMP_ROOT=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TEMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMPDIR=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "CI temp root for this leg: ${CI_TEMP_ROOT}"

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      # OS-level libraries required to import/run PySide6 (Qt6) headless on a
      # clean Ubuntu runner (F11: xkbcommon, EGL/GL, dbus, X libs for offscreen).
      # Ubuntu-only: Windows/macOS GitHub runners need no extra system libs for
      # offscreen Qt (plan §3.1).
      # fonts-dejavu-core: a bare Ubuntu runner ships no system font, so the
      # application font's fallback behaviour could not be exercised there at
      # all; installing one gives the font tests a real fallback face to find.
      # fonts-noto-cjk: the CJK probe font. DejaVu has no Han, Hangul or kana,
      # so without a face that does, the interface languages written in those
      # scripts could never be seen falling back to an operating-system font on
      # this leg: the fontconfig lookup would find nothing. The package is Noto
      # Sans/Serif CJK (SIL OFL), one set covering all three scripts, in Ubuntu
      # `main` for the runner's release (noble, 1:20230817+repack1-3), so it
      # needs no extra repository. It is a PROBE, not a requirement of the
      # product: the application ships its own faces and a user's system
      # supplies whatever else it has. Because it makes the system CJK lookup
      # succeed, a test that must prove the application's own family list does
      # the drawing has to hide system fonts from fontconfig, or register every
      # family it judges; a green result that depends on this package alone
      # proves nothing about the list.
      - name: Install Qt runtime OS libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            fonts-dejavu-core fonts-noto-cjk

      - name: Install project (runtime + dev) from manifest
        # -c constraints.txt: reproducibility lock — pins the full
        # resolved dependency closure (direct + transitive) so this install
        # matches every other CI run and any developer's local environment.
        # Regenerate command + rationale: constraints.txt's own header.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      # ----- Static / lint / type gates: Ubuntu-only (OS-invariant source lints;
      # keep the shipped Ubuntu gate as-is, plan §3.1). -----
      - name: Lint (flake8)
        if: runner.os == 'Linux'
        run: flake8 pixelart_creator scripts

      - name: Format check (black + isort)
        if: runner.os == 'Linux'
        run: |
          black --check pixelart_creator scripts
          isort --check-only pixelart_creator scripts

      - name: Type check (mypy)
        if: runner.os == 'Linux'
        run: mypy pixelart_creator

      - name: Path-portability lint (P11 script)
        if: runner.os == 'Linux'
        run: python scripts/path_portability_check.py --root .

      - name: Architecture layering + cycle checks (P11 scripts)
        if: runner.os == 'Linux'
        # check_layering is run over BOTH roots, because ONE root is not enough:
        #   --root pixelart_creator  enforces the three client layers (ui/logic/
        #                            data), whose rules key on parts[0] RELATIVE
        #                            to that root.
        #   --root .                 enforces the two non-three-layer top-level
        #                            packages (sync_backend/, web_viewer/), whose
        #                            rules key on parts[0] relative to the REPO
        #                            root — and, since the fail-closed fix, also
        #                            FAILS on any unregistered new top-level
        #                            package (a future mobile/VPS-host package is
        #                            guarded from its first commit instead of
        #                            being silently skipped while CI stayed green).
        # The `--root .` invocation was previously MISSING even though the comment
        # here claimed it dispatched everything, so sync_backend/ and web_viewer/
        # had ZERO layering enforcement. Both roots now run; neither is optional.
        # check_cycles stays per-package: it walks each top-level package's own
        # intra-import graph, so it needs one invocation per root.
        run: |
          python scripts/check_layering.py --root pixelart_creator
          python scripts/check_layering.py --root .
          python scripts/check_cycles.py --root pixelart_creator
          python scripts/check_cycles.py --root sync_backend
          python scripts/check_cycles.py --root web_viewer

      - name: I18n string audit (report, P11 script)
        if: runner.os == 'Linux'
        # BLOCKING (D-22, decision batch 2026-08-16): this step was
        # warn-and-continue (exit 1 findings swallowed to a `::warning::`,
        # only exit 2 script-error failed the build) because the script's own
        # contract is report-not-fix and pixelart_creator/ui carried findings.
        # Re-measured this session: pixelart_creator/ui is CLEAN (0 findings,
        # `string_audit_check.py --root pixelart_creator/ui` exits 0) — a
        # clean surface makes blocking cost-free, so the swallow is removed.
        # Exit codes, now both fatal to this step: 0 clean (pass); 1 findings
        # (FAILS the build — a future unwrapped string is caught at commit
        # time, the localisation owner clears it); 2 script error (FAILS the build, as
        # before — an audit that could not run is not an audit that found
        # nothing). No swallowing of any non-zero exit remains.
        run: python scripts/string_audit_check.py --root pixelart_creator/ui

      # ----- Visual-identity asset gates (REQ-VI-BUILD-001/-002/-004/-005/-008).
      # Ubuntu-only, like the other source-level gates: every result below is a
      # pure function of committed files and does not vary by OS. The one
      # property that does depend on the OS -- the fonts rebuilt byte for byte
      # -- is also proved on Windows, macOS and Linux by .github/workflows/
      # native-font.yml, which runs on a manual dispatch only. Each
      # script fails on a count of zero as well as on a finding, and prints the
      # number it examined, so a green step here cannot mean "looked at nothing".
      - name: Theme contrast gate (REQ-VI-BUILD-001)
        if: runner.os == 'Linux'
        # scripts/check_theme_contrast.py: WCAG contrast of every declared role
        # pair in all six style/mode combinations plus the focus pairs derived
        # from what the focus ring touches. `--control` first shows the
        # instrument a known failing pair and a known passing one and runs the
        # blind-pass cases (no pairs, a missing role key, an unknown role); the
        # real run does the same before it trusts any data, so the separate
        # invocation is for a log that names the controls on their own.
        run: |
          python scripts/check_theme_contrast.py --control
          python scripts/check_theme_contrast.py

      - name: Font source lint (REQ-VI-BUILD-003/-005/-011)
        if: runner.os == 'Linux'
        # Lints the glyph sources under fonts-src/nifen-art against the grid
        # contract and the licence and provenance rules. It exits non-zero on a
        # violation and when it examined nothing. fontTools comes from the dev
        # extra, pinned in constraints.txt.
        run: python scripts/font/build_nifen_art.py --lint

      - name: Font rebuild is byte-identical to the committed fonts (REQ-VI-BUILD-002)
        if: runner.os == 'Linux'
        # Builds both weights twice from the sources and compares both builds
        # with the committed TTFs in pixelart_creator/fonts, byte for byte.
        run: python scripts/font/build_nifen_art.py --check

      - name: Font glyph coverage (REQ-VI-BUILD-004)
        if: runner.os == 'Linux'
        # --gate-catalogues makes a character used in a shipped translation
        # catalogue, or in an interface string literal under ui/, that either
        # weight lacks a FAILURE; without it those are only reported. The
        # declared set and the probe text are always gated. Exit non-zero on
        # any missing character and when nothing was examined.
        run: python scripts/font/check_glyph_coverage.py --gate-catalogues --py-dir pixelart_creator/ui

      - name: Application icon family (REQ-VI-BUILD-007/-008)
        if: runner.os == 'Linux'
        # scripts/derive_app_icons.py --check: every committed icon member
        # equals the one re-derived from the five hand-drawn masters, compared
        # as decoded pixels (a re-encoded PNG's bytes depend on the platform's
        # zlib, so the bytes are not compared). Also the master hashes, the
        # border-adjacency rule and the fill floor. Exit non-zero on a mismatch
        # and when it examined nothing.
        run: python scripts/derive_app_icons.py --check

      - name: Asset-pipeline suite is collected (named-test presence check)
        if: runner.os == 'Linux'
        # The main pytest step below already runs testing/suites/asset_pipeline
        # as part of testpaths. This step makes that fact a gate of its own: a
        # suite that stops being collected (a moved folder, a renamed module, a
        # broken import) would otherwise leave the step below green with fewer
        # tests and nobody told. It collects the folder alone and fails when
        # the folder yields nothing, when any of its four modules yields
        # nothing, or when one of the named tests that anchor the gates above
        # is absent. The counts are printed; no total is pinned, so adding a
        # test never needs an edit here, but renaming an anchor does.
        run: |
          COLLECT_OUT="${CI_TEMP_ROOT}/asset-pipeline-collect.txt"
          python -m pytest --collect-only -q -p no:cacheprovider testing/suites/asset_pipeline/ | tee "${COLLECT_OUT}"
          TOTAL="$(grep -c '^testing/suites/asset_pipeline/.*::' "${COLLECT_OUT}" || true)"
          echo "asset-pipeline tests collected: ${TOTAL}"
          if [[ "${TOTAL}" -eq 0 ]]; then
            echo "::error::testing/suites/asset_pipeline/ collected no test"
            exit 1
          fi
          MISSING=0
          for MODULE in test_build_nifen_art test_check_glyph_coverage test_check_theme_contrast test_derive_app_icons; do
            COUNT="$(grep -c "^testing/suites/asset_pipeline/${MODULE}.py::" "${COLLECT_OUT}" || true)"
            echo "  ${MODULE}.py: ${COUNT} collected"
            if [[ "${COUNT}" -eq 0 ]]; then
              echo "::error::${MODULE}.py collected no test"
              MISSING=1
            fi
          done
          for ANCHOR in \
            test_build_nifen_art.py::test_two_builds_are_byte_identical_and_equal_the_committed_fonts \
            test_build_nifen_art.py::test_lint_of_the_committed_sources_is_clean_over_a_counted_denominator \
            test_build_nifen_art.py::test_sc_vi_build_005_2_the_check_examines_the_three_places \
            test_check_glyph_coverage.py::test_default_run_covers_the_declared_set_and_the_probe_text_in_both_weights \
            test_check_glyph_coverage.py::test_catalogues_interface_literals_and_guide_content_are_covered_when_gated \
            test_check_theme_contrast.py::test_sc_vi_build_001_1_shipped_themes_pass_with_a_nonzero_count_each \
            test_check_theme_contrast.py::test_sc_vi_build_001_2_control_mode_shows_a_known_failing_pair_failing \
            test_derive_app_icons.py::test_check_reports_zero_mismatches_against_committed_pixels \
            test_derive_app_icons.py::test_check_with_no_member_files_fails_on_zero_examined; do
            if grep -Eq "^testing/suites/asset_pipeline/${ANCHOR}(\[|$)" "${COLLECT_OUT}"; then
              echo "  anchor present: ${ANCHOR}"
            else
              echo "::error::named test not collected: ${ANCHOR}"
              MISSING=1
            fi
          done
          exit "${MISSING}"

      - name: Wheel content check (fonts, themes, licence notices; REQ-VI-BUILD-005)
        if: runner.os == 'Linux'
        # Builds the wheel from a clean export of the checked-out commit (the
        # build runs in the CI temp root, so no build/ or egg-info folder lands
        # in the workspace the later steps scan), unpacks it there and runs
        # packaging/check_payload.sh on the unpacked tree: every file
        # the repository ships under pixelart_creator/fonts and
        # pixelart_creator/themes must be in the wheel, byte for byte, and
        # OFL.txt must carry the donor's line, the typeface's own and the
        # Reserved Font Name. package-data globs miss a file silently and only
        # an installed copy shows it, so the wheel itself is what is examined.
        # The empty-folder control shows the check can fail before its result
        # is trusted. The installers get the same check in build-installers.yml.
        run: |
          WHEEL_DIR="${CI_TEMP_ROOT}/wheel"
          WHEEL_SRC="${CI_TEMP_ROOT}/wheel-src"
          rm -rf "${WHEEL_DIR}" "${WHEEL_SRC}"
          mkdir -p "${WHEEL_DIR}" "${WHEEL_SRC}"
          git archive HEAD | tar -x -C "${WHEEL_SRC}"
          python -m pip wheel "${WHEEL_SRC}" --no-deps -w "${WHEEL_DIR}" -q
          WHEEL="$(ls "${WHEEL_DIR}"/pixelart_creator-*.whl)"
          echo "wheel built: ${WHEEL}"
          python -m zipfile -e "${WHEEL}" "${WHEEL_DIR}/unpacked"
          CONTROL_DIR="${CI_TEMP_ROOT}/payload-control-empty"
          mkdir -p "${CONTROL_DIR}"
          if bash packaging/check_payload.sh "${CONTROL_DIR}" "control: empty folder" > /dev/null 2>&1; then
            echo "::error::payload check control FAILED: an empty folder passed"
            exit 1
          fi
          echo "payload check control OK: an empty folder is refused"
          bash packaging/check_payload.sh "${WHEEL_DIR}/unpacked" "wheel"

      # ----- Docs gates (REMEDIATION 2026-07-30, F14): neither gate below had
      # ever run in CI before this change — mkdocs build --strict and
      # pydocstyle both existed as tools the project used locally but were
      # never wired, so a red docs build or a docstring regression could never
      # have blocked a merge. Ubuntu-only, same as the other static gates. -----
      - name: Docs build (mkdocs --strict, F14)
        if: runner.os == 'Linux'
        # main/docs/site/mkdocs.yml (mkdocs-site skill). --strict turns
        # every warning (broken internal link, a nav entry with no matching
        # page, etc.) into a build failure so the published User Guide can
        # never drift silently out of sync with docs_dir. Measured 2026-07-30:
        # PASSES — exit 0, 16 pages, zero warnings. Gates immediately, no
        # exception needed.
        run: mkdocs build -f docs/site/mkdocs.yml --strict

      - name: Docstring lint (pydocstyle, PEP 257)
        if: runner.os == 'Linux'
        # Ruleset: [tool.pydocstyle] convention="pep257" in pyproject.toml (see
        # that file's comment for why pep257 -- the project's own documented
        # docstring discipline -- and not google/numpy, which would manufacture
        # section-formatting findings against a style never adopted here).
        #
        # A plain BLOCKING gate: the step's exit status is pydocstyle's own,
        # so any pep257 finding in pixelart_creator fails the Linux leg. The
        # target is the whole package; there is no ignore/select override, no
        # excluded path and no continue-on-error.
        #
        # History: the gate was wired on 2026-07-30 as a time-boxed exception
        # (a warning until 2026-08-31, a failure after it) while the first
        # findings were being cleared. pixelart_creator has exited 0 since
        # then, apart from a short regression repaid on 2026-08-18. The
        # time-boxed scaffold was removed on the owner's ruling of
        # 2026-10-23, leaving this step.
        run: pydocstyle pixelart_creator

      - name: Documentation-reference gate (ADR citations + control-label currency, P11 script)
        # scripts/check_doc_references.py checks two independent legs, both
        # over the WHOLE checkout (no OS-gate needed -- pure-Python, stdlib
        # only, deterministic):
        #   LEG 1 -- every `ADR-NNNN` citation found anywhere in product
        #     source/docs/workflows must resolve to a real file under
        #     docs/adr/. This is the gate the project did not have when three
        #     dangling citations (ADR numbers 0052, 0056 and 0057, against a
        #     highest-on-disk of ADR-0051) went unnoticed -- written here
        #     deliberately broken up (never as a literal "ADR-" immediately
        #     followed by four digits) so this very sentence cannot trip the
        #     LEG 1 scan it is describing.
        #   LEG 2 -- every shipped, user-facing FEATURE label (window/dialog
        #     titles, menu/toolbar actions, primary panel controls,
        #     file-dialog captions -- derived from the UI source itself, never
        #     hardcoded) must appear in at least one of the two documentation
        #     surfaces (the mkdocs usage pages, the in-app user guide). Each
        #     label is checked PER LOCALE, independently: en/es are their own
        #     pair, so a label documented only in English still fails as
        #     es-documentation-stale, and vice versa -- a check that only
        #     looked at one language would certify a property it never
        #     tested.
        #
        # BASELINE-AND-RATCHET, not all-or-nothing: 145 pre-existing findings
        # were real, measured documentation debt at the moment this gate was
        # wired -- clearing all of it first would have meant this gate never
        # landing. Every one of the 145 is recorded, one entry per finding, in
        # doc-reference-baseline.json (repository root -- NOT docs/, which is
        # gitignored by a deliberate privacy allowlist and would silently
        # strand this CI-gate state file as untracked); the human-readable
        # accounting of that debt is tracked separately, outside this
        # repository, so searching this repo will
        # not find it. The ratchet: a baselined finding does not fail the
        # build, but ANY finding NOT already in the baseline does -- the debt
        # is frozen at 145, never allowed to grow silently, and the user
        # explicitly accepted that baselined items "might provoke new fails in
        # the CI" as new code moves lines around.
        #
        # TWO FAILURE MODES a developer will actually hit -- read the one that
        # matches before touching this step, because an unexplained CI
        # failure here is exactly how a gate like this gets disabled instead
        # of obeyed:
        #   1. A genuinely NEW undocumented feature (a new finding, not a
        #      rename): either write the missing documentation (mkdocs page
        #      and/or in-app guide entry, both locales), or -- only if the
        #      label truly needs no documentation, e.g. an internal/debug
        #      action or a caption nobody looks up by name -- add it to
        #      doc-reference-allowlist.json (repository root) WITH a reason.
        #   2. A RENAMED label or a moved/renumbered ADR citation: this
        #      produces a STALE baseline entry (the old value/location, now
        #      gone) AND a NEW finding (the new value/location) TOGETHER --
        #      update the EXISTING doc-reference-baseline.json (repository
        #      root) entry to the new value/location; do not leave the stale
        #      one and add a second entry beside it.
        #
        # BASELINE vs ALLOWLIST are never merged -- they mean different
        # things:
        #   doc-reference-baseline.json (repository root) = debt OWED. Every
        #     entry is a real gap that should eventually be closed.
        #   doc-reference-allowlist.json (repository root) = NEEDS NO
        #     DOCUMENTATION, EVER.
        #     Every entry carries a reason and is not counted as debt.
        #
        # BLOCKING, unconditionally: no time-boxed exception, no `|| true`, no
        # advisory/warn-and-continue mode -- the script's own exit code (0
        # clean; 1 new finding and/or stale baseline entry, FAILS the build;
        # 2 script error, FAILS the build) is this step's verdict as-is. A
        # gate that reports and never blocks is the exact defect this gate
        # exists to catch. Run BEFORE the long pytest step below so a
        # documentation regression fails fast, not after a five-minute suite.
        # `--root .` matches the other P11 scripts' CI convention (checkout
        # root, no working-directory override); --allowlist/--baseline are
        # left at their defaults, which already resolve to
        # doc-reference-allowlist.json and doc-reference-baseline.json at the
        # repository root (relocated from docs/ 2026-08-19 -- docs/* is
        # gitignored, S19, and would have stranded these CI-gate state files
        # as untracked, never committed).
        run: python scripts/check_doc_references.py --root .

      - name: Internal-vocabulary regrowth gate (P11 script)
        # scripts/check_vocabulary_regrowth.py -- fails on any new occurrence,
        # in a tracked file OR in a commit message this pull request adds, of
        # one of the internal development-system identifier families cleaned
        # from this PUBLIC repository and measured at ZERO on 2026-09-06 (the
        # exact patterns are enumerated in that script's own module docstring,
        # not repeated here -- see "THE EIGHT PATTERNS" there). They regrew
        # TWICE inside one job that same day and were caught only by a
        # hand-run grep -- this step is the deterministic replacement for
        # that grep. Deliberately described only in prose here, never
        # spelled out literally in this file: `.github/workflows/ci.yml` is
        # itself an ordinary, routinely-edited file and exactly the category
        # this vocabulary has reappeared in before, so this step is written
        # to contain no literal instance of any pattern rather than being
        # exempted from the gate it wires (see the script's own
        # SELF-TRIPPING RESOLUTION section for why only the script itself is
        # exempt, and nothing else).
        #
        # Deliberately given NO `if: runner.os` guard, unlike the Ubuntu-only
        # static gates above: the script is stdlib-only and portable by
        # requirement, and this is the real proof of that on every push/PR --
        # it therefore runs on every leg of the matrix above (all three OSes
        # on a pull_request, the single post-merge leg otherwise), not just
        # Ubuntu.
        #
        # The commit-message half is BOUNDED to the commits this pull request
        # ADDS (base..head), never the whole history -- 61 of this
        # repository's 571 commits carry a cleaned-family token in their
        # MESSAGE and will not be rewritten, so a gate scanning all history
        # would land red on arrival and be switched off. On a `pull_request`
        # event the base/head SHAs come straight from the event payload (both
        # already resolvable here: the Checkout step above uses
        # `fetch-depth: 0`, full history). On any OTHER trigger (post-merge
        # `push`, `workflow_dispatch`) no range is available, and the script
        # itself SKIPS that half loudly (stderr names the reason) rather than
        # silently treating it as passing -- the file-scan half still runs
        # and still gates either way.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/check_vocabulary_regrowth.py --root . \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/check_vocabulary_regrowth.py --root .
          fi

      - name: VCS attribution gate (P11 script)
        # scripts/check_attribution.py -- fails on any AI/vendor authorship in
        # the commit MESSAGES or the author/committer IDENTITIES this pull
        # request adds: a vendor co-author trailer, an assistant session
        # trailer, a "generated with" credit, or a vendor noreply address.
        # Article IX 4 (docs/constitution-articles.md) calls such a trailer
        # "a gate failure, not a style preference". Until 2026-09-11 nothing
        # enforced it anywhere: five commits in the sibling development
        # repository carried one unnoticed for two weeks and cost a 60-commit
        # history rewrite. This step is that enforcement, and the commit-msg
        # hook beside it is the same gate run locally.
        #
        # MESSAGES AND IDENTITIES ONLY, never file contents -- this product
        # ships a legitimate vendor LLM adapter, and a gate matching vendor
        # names in files would flag a shipped feature. The reasoning is
        # recorded in that script's own docstring, not restated here. Like the
        # step above, this comment describes the forbidden forms in prose and
        # contains no literal instance of one: a workflow file is an ordinary,
        # routinely-edited file, and a literal here would be copied onward.
        #
        # pull_request ONLY, and that is complete coverage rather than a gap:
        # `main` admits no direct push (repository ruleset, no bypass), so every
        # commit reaches it through a pull request and so through this step. On
        # any other trigger there is no base..head range, and the script BLOCKS
        # (exit 2) rather than report a green it cannot justify -- so the step
        # announces the skip loudly instead of inventing a range to scan.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/check_attribution.py               --base-sha "${{ github.event.pull_request.base.sha }}"               --head-sha "${{ github.event.pull_request.head.sha }}"
          else
            echo "attribution gate SKIPPED: no pull-request commit range on event"                  "'${{ github.event_name }}'. This gate scans commit messages and"                  "identities only, so there is nothing to scan here. main admits no"                  "direct push, so every commit is gated on its pull request." >&2
          fi

      - name: Tests (pytest, headless, parallel, with coverage XML)
        # -n auto: pytest-xdist fans the suite across all runner cores, cutting
        # the ~46-48 min single-process wall-time to a fraction (FU-20). Per-test
        # QStandardPaths app-config is isolated to a per-test tmp dir in the ui
        # conftest so the parallel workers never race the shared favourites.json.
        # pytest-cov aggregates coverage across the xdist workers, so the coverage
        # gate below still sees the full merged result (verified >=90/>=80).
        # --timeout=120 --timeout-method=thread: per-test hard cap so a single
        # hung test fails fast (naming itself) instead of hanging the whole run.
        # --durations=15: always surface the 15 slowest tests in the CI log so a
        # creeping suite-runtime regression is visible (FU-12 / FU-20).
        # -m "not slow and not gpu and not cloud_live and not assistant_live":
        # cloud_live gates the live credential/OAuth provider tests (real OS
        # keyring, out-of-CI, CL-B2/CL-B3) so they skip here; the MOCKED provider
        # contract tests (tests/data/test_cloud_providers_*) carry NO marker and
        # still run. assistant_live (Phase-14, ADR-0040 §5 / DEP-4) likewise gates
        # the real external-LLM-provider path (14D, real key/credentials) so it
        # skips here; the 14B fake-adapter tests carry NO marker and still run. The
        # in-process real-time backend suite (tests/backend/) is collected via
        # testpaths=["tests", "web_viewer/tests"] and runs with the mocked
        # loopback/ws transports.
        # -m also deselects `integration` (Phase-13 13C): the deploy/ VPS
        # acceptance tests — since ADR-0043 in their OWN root tests/deploy/
        # (test_vps_localhost.py, test_nginx_wss_localhost.py) — reach outside the
        # process (launcher subprocess / Docker / Nginx / real socket) and would need
        # Docker+nginx that the Windows/macOS runners lack; they run ONLY in the
        # dedicated `integration` job below, keeping this cross-OS matrix green
        # without them. tests/deploy/ needs no new path here: it sits UNDER the
        # existing "tests" testpaths root, so this bare `pytest` collects it (and
        # then deselects it by marker) with no manifest change. The default-gate
        # deploy guard (tests/backend/test_hosting_default_unchanged.py) carries NO
        # integration marker and still runs here.
        # PIXELART_REQUIRE_FALLBACK_FONT (Linux only, where the font package above
        # is installed): turns the font-fallback test's "no fallback font found"
        # skip into a failure, so a runner image that loses its fonts is caught
        # rather than silently skipped. Windows and macOS ship fonts and need no flag.
        env:
          PIXELART_REQUIRE_FALLBACK_FONT: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          pytest -n auto -m "not slow and not gpu and not cloud_live and not assistant_live and not integration" \
            --basetemp="${CI_TEMP_ROOT}/pytest-main" \
            --timeout=120 --timeout-method=thread --durations=15 \
            --cov=pixelart_creator --cov-branch --cov-report=xml --cov-report=term

      - name: Print the font-cache measurements (font family chain, per-OS prints)
        # The main pytest step above runs this module too, but a passing test's
        # output is not shown there, so the per-OS measurements the module
        # prints (the `[tag-verdict]` lines: which style-strategy flags each
        # operating system keeps, the cache capacity, whether two font lists
        # share one tail) never reach the log. `-rP` adds the captured output
        # of every PASSED test to the summary, which is the whole purpose of
        # this second, narrower run. The prints are information about the
        # operating system; the assertions of the cases that make them are what
        # gate.
        #
        # A GATING step like any other: its exit status is pytest's own, with no
        # `continue-on-error` and no `|| true`. A selection that matches no test
        # exits 5 and fails the step, so a rename that stops the selection from
        # matching cannot leave this green while printing nothing. No `-n`: one
        # process keeps the prints in order. Same offscreen environment as the
        # main step (job-level QT_QPA_PLATFORM), its own --basetemp under the
        # leg's CI temp root, and the same per-test timeout options.
        env:
          PIXELART_REQUIRE_FALLBACK_FONT: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          python -m pytest -rP -p no:cacheprovider \
            -k "chain_tag or share_one_tail" \
            --basetemp="${CI_TEMP_ROOT}/pytest-font-cache" \
            --timeout=120 --timeout-method=thread \
            testing/suites/ui/test_font_family_chain_mechanism.py

      - name: Coverage gate — client package (>=90 line / >=80 branch, S13)
        if: runner.os == 'Linux'
        # SCOPE (made explicit): this gate reads the coverage.xml produced by the
        # pytest step above, which measures `--cov=pixelart_creator` ONLY. It
        # therefore says NOTHING about the two shipped non-three-layer packages
        # sync_backend/ and web_viewer/ — those are measured and gated by the two
        # steps that follow. Neither gate is optional and neither subsumes the
        # other. Thresholds are the constitutional 90/80 and are NOT lowered.
        run: python scripts/coverage_gate.py --xml coverage.xml --line 90 --branch 80

      # ----- Non-client coverage: sync_backend/ + web_viewer/ ------------------
      # WHY A SECOND MEASUREMENT: `--cov=pixelart_creator` above excludes both
      # shipped non-client packages, so until now they were entirely UNMEASURED
      # while CI reported green. They are measured here by the tests that
      # actually exercise them (tests/backend/ + web_viewer/tests/), in their own
      # coverage data file so the client run above is untouched. The XML is then
      # regenerated with `coverage xml --omit="*/tests/*"` — a SEPARATE report
      # invocation, not a second `--cov` source on the main run, because passing
      # several `--cov` roots to one pytest run makes pytest-cov relativise every
      # file to its own source root: `pixelart_creator/__init__.py`,
      # `sync_backend/__init__.py` and `web_viewer/__init__.py` then all collapse
      # into one Cobertura package "." with COLLIDING filenames, silently losing
      # files. The omit drops the test modules themselves from the measurement so
      # only shipped code is graded.
      - name: Measure non-client coverage (sync_backend + web_viewer)
        if: runner.os == 'Linux'
        env:
          COVERAGE_FILE: .coverage.nonclient
        run: |
          pytest -m "not slow and not gpu and not cloud_live and not assistant_live and not integration" \
            testing/suites/backend testing/suites/deploy web_viewer/tests \
            --basetemp="${CI_TEMP_ROOT}/pytest-nonclient" \
            --timeout=120 --timeout-method=thread \
            --cov=sync_backend --cov=web_viewer --cov-branch --cov-report=term
          # Written under coverage/ because that path is ALREADY gitignored, so
          # this CI artefact can never be committed by accident.
          python -m coverage xml --omit="*/tests/*" -o coverage/nonclient.xml

      - name: Coverage gate — non-client packages (>=90 line / >=80 branch, S13)
        if: runner.os == 'Linux'
        # Formerly a time-boxed exception (expired scaffolding removed
        # 2026-07-30): sync_backend/web_viewer measured below the
        # constitutional 90/80 on 2026-07-29 (sync_backend 93.57%/76.00%,
        # web_viewer 5.56%/0.00%). 33 new tests closed that gap; re-measured
        # 2026-07-30 at sync_backend 100.00%/100.00% and web_viewer
        # 100.00%/100.00%, gate exit 0. The debt is repaid, so this is now a
        # plain, unconditional gate at the constitutional 90/80 — same shape
        # as the client-coverage gate above. Thresholds are NOT lowered and
        # the packages are NOT excluded.
        run: python scripts/coverage_gate.py --xml coverage/nonclient.xml --line 90 --branch 80

      # ----- Web-viewer JS-unit gate (Phase-13, F11).
      # Ubuntu-only: node is available on the ubuntu runner (absent on the local
      # Windows host, where it is a documented SKIP). Frame-work-free, no bundler
      # (ADR-0036 D3) — the .mjs test file carries its OWN assert-based runner and
      # calls process.exit(1) on any failure, so it is run as a bare script
      # (`node <file>`), NOT via `node --test`. It imports the DOM-free pure-logic
      # module web_viewer/static/viewer_core.mjs and checks decode/LWW-accept/
      # integer-scale + render-fidelity vs the shipped Python reference (+/-1 LSB).
      # A distinct step: a JS-unit failure fails THIS leg. -----
      - name: Set up Node.js (web-viewer JS-unit)
        if: runner.os == 'Linux'
        # actions/setup-node@v7 (was @v4, CI-warning fix, 2026-08-18): v4 is
        # the only stale action in this file -- its own manifest declares
        # `using: node20`, a runtime GitHub has deprecated and is
        # force-upgrading off. Checked each tag's manifest directly: v5, v6
        # and v7 all declare `using: node24`; v7.0.0 (2026-07-14) is latest.
        # Picked v7 over v5/v6 on the release notes (gh api
        # repos/actions/setup-node/releases), not habit: v5.0.0 and v6.0.0
        # each carry an explicit "Breaking Changes" section (v5: bump to the
        # node24 runtime, already accounted for above, plus automatic
        # dependency-lockfile caching keyed off a package.json
        # `packageManager` field; v6: that automatic caching narrowed to npm
        # only) -- neither applies here because this repository has no
        # package.json anywhere (verified) and this step never sets a
        # `cache:` input, so no caching path, automatic or otherwise, is ever
        # exercised by this invocation. v7.0.0's own release body carries NO
        # "Breaking Changes" section (only Enhancements/Bug
        # fixes/Documentation/Dependency-update), so it is the latest major
        # with no breaking change for a node-version-only usage like this one.
        #
        # node-version bumped 20 -> 24 (same change): Node 20 ("Iron") reached
        # its own end-of-life 2026-04-30 (nodejs/Release schedule.json,
        # checked via the GitHub API), so this step was installing an EOL
        # runtime to run the web-viewer JS-unit suite. Node 22 ("Jod") is
        # Maintenance LTS as of this session (maintenance since 2025-10-21);
        # Node 24 ("Krypton") is the current ACTIVE LTS (Active LTS since
        # 2025-10-28, maintenance not until 2026-10-20) -- the version this
        # project should be pinning to. Nothing in web_viewer/tests or this
        # repository has any reason to stay on 20: the suite is a bare,
        # framework-free ESM script (grep for "node-version"/"Node 20" across
        # the tree turns up only this one line) with no lockfile, no bundler,
        # and no Node-20-specific syntax. Verified before landing: `node
        # web_viewer/tests/test_viewer_core.mjs` run locally on Node
        # v24.18.0 -- 11/11 passed, exit 0.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Web-viewer JS-unit tests (node, framework-free)
        if: runner.os == 'Linux'
        run: node web_viewer/tests/test_viewer_core.mjs

      # ----- Perf gates: Ubuntu-only. The ceilings are calibrated to the Ubuntu
      # GitHub runner; running them on Windows/macOS would compare against the
      # wrong baseline (plan §6, invoker directive). -----
      - name: 8K paint/redraw perf gate (P-A scenario, D-32, REQ-P1-UI-023)
        if: runner.os == 'Linux'
        # Phase-1 (D-32 rebuild, then CI wiring, decision
        # batch 2026-08-16). The rebuilt scripts/perf_profile.py default
        # (tiling) mode now imports and drives the REAL
        # `ui.canvas_scene.CanvasScene.drawBackground` against a real
        # `logic.document.Document` — replacing the self-described mirror
        # (`draw_background_tiles`) that CF-06 found imported no product UI
        # module. `--width`/`--height` are now LIVE: the exposed rect is
        # intersected with the real scene's own `sceneRect()`, exactly as a
        # QGraphicsView does. The invocation below is the **P-A scenario** —
        # 8K full-view at fit zoom, the gating case named in
        # the render-strategy spec §9 — and
        # exits non-zero if the median exceeds the UNRELAXED Tier-1
        # FRAME_BUDGET_MS (16 ms, logic/constants.py, the --budget-ms
        # default). Perf-model governance record §7
        # forbids manufacturing a Tier-2 ceiling for this REQ to make the
        # gate easier to pass — none is used here. Measured locally
        # 2026-08-16 (this Windows host — host-dependent, not a CI
        # result): 9.92 ms median, ~40% margin under budget.
        run: python scripts/perf_profile.py --width 7680 --height 4320 --zoom 0.25 --viewport 1920 1080 --frames 60

      - name: Compositor region-recomposite perf gate (FU-15)
        if: runner.os == 'Linux'
        # Standalone, Qt-free P11 gate: times the region-recomposite path on an
        # 8K multi-layer document and exits non-zero if the median exceeds
        # COMPOSITE_REGION_CEILING_MS (200 ms, logic/constants.py). No pytest
        # marker, no extra env — numpy + logic only. Catches the SC-UI-015-1
        # catastrophic O(full-canvas) recomposite regression class.
        run: python scripts/perf_profile.py --composite

      - name: Tilemap render_region perf gate — part 1 (interactive frame budget)
        if: runner.os == 'Linux'
        # Standalone, Qt-free P11 gate (Phase-6). Times
        # logic/tilemap.render_region over a typical interactive viewport tile
        # (256x256 px @ 16 px tiles = 16x16 cells) and exits non-zero if the
        # median exceeds FRAME_BUDGET_MS (16 ms, logic/constants.py — the default
        # --budget-ms). Guards the 60-fps interactive draw path (currently
        # ~0.54 ms). numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --tilemap --tm-region 256 256 --tm-tile 16 --frames 30

      - name: Tilemap render_region perf gate — part 2 (catastrophic ceiling)
        if: runner.os == 'Linux'
        # Companion catastrophic-ceiling gate: renders the full 8K region
        # (7680x4320 px @ 16 px tiles = 480x270 cells) and exits non-zero if the
        # median exceeds TILEMAP_VIEWPORT_CEILING_MS (3000 ms, logic/constants.py,
        # passed via --budget-ms 3000). Catches an O(full-map) worst-case
        # render regression class distinct from the interactive budget above
        # (currently ~247 ms). numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --tilemap --tm-region 7680 4320 --tm-tile 16 --frames 8 --budget-ms 3000

      - name: Visual-aids overlay perf gate — part 1 (worst-case iso overlay)
        if: runner.os == 'Linux'
        # Phase-9 (REQ-P9-UI-011). Times the REAL shipped iso-grid
        # overlay item's paint() over the full-scene worst case (fine 2 px tiles,
        # 1920x1080 viewport) and exits non-zero if the median frame exceeds
        # OVERLAY_FRAME_CEILING_MS (48 ms, logic/constants.py — passed via
        # --budget-ms 48). Article VI's per-frame budget APPLIES this phase because
        # the overlays + multi-view are on the interactive render loop (unlike the
        # Phase-7/8 batch work). Headless offscreen Qt via the job env.
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 2 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 2 (zoomed iso, exposed sub-rect)
        if: runner.os == 'Linux'
        # Companion iso gate at an interactive zoom (16x) over a small exposed
        # sub-rect (120x67 px) — the culled-viewport draw the user actually pays
        # for while editing. Same OVERLAY_FRAME_CEILING_MS (48 ms) ceiling.
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 2 --ov-zoom 16 --ov-exposed 120 67 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 3 (combined multi-view + preview)
        if: runner.os == 'Linux'
        # Combined dirty-rect composite: 7 extra views + the real-size preview each
        # blit a 64x64 dirty sub-rect (MinimalViewportUpdate — cost scales with the
        # dirty rect x views, not the 8K canvas x N). Guards the REQ-P9-UI-008
        # live-sync render loop against the same 48 ms OVERLAY_FRAME_CEILING_MS.
        run: python scripts/perf_profile.py --overlay --ov-kind combined --ov-views 7 --ov-dirty 64 64 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 4 (Slice-C live cursors)
        if: runner.os == 'Linux'
        # Phase-10 Slice C (report §5, REQ-P10-UI-013). Times the REAL
        # shipped Live_Cursors_Overlay.paint() with the worst case of
        # MAX_SHARED_MEMBERS (32) collaborator cursors all inside the exposed rect
        # (no cull) and exits non-zero if the median frame exceeds
        # OVERLAY_FRAME_CEILING_MS (48 ms, passed via --budget-ms 48). Headless
        # offscreen Qt via the job env (currently ~1.3 ms).
        run: python scripts/perf_profile.py --overlay --ov-kind cursors --ov-cursors 32 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 5 (Slice-C combined apply + cursors frame)
        if: runner.os == 'Linux'
        # Companion Slice-C gate: the COMBINED interactive frame — one
        # realtime_apply.apply_remote plus the 32-cursor overlay paint — against
        # the same 48 ms OVERLAY_FRAME_CEILING_MS. Guards the live-collab render
        # loop end-to-end (apply + draw), distinct from the sub-frame apply-only
        # --realtime gate below (currently ~1.6 ms).
        run: python scripts/perf_profile.py --overlay --ov-kind cursors-rt --ov-cursors 32 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 6 (D-29, 8K overlay catastrophic ceiling)
        if: runner.os == 'Linux'
        # Phase-9/Phase-12 (D-29 rebuild, then CI wiring, decision
        # batch 2026-08-16). The literal 8K overlay viewport
        # (`--ov-viewport 7680 4320`) was missing entirely from every wired
        # `--overlay` step above (all five run at 1920x1080), so no job
        # exercised the iso-grid CPU-raster cache-miss fallback risk at the
        # real canvas size. Gates at TIER 2 — OVERLAY_8K_CEILING_MS (2000 ms,
        # logic/constants.py, passed via --budget-ms 2000) — NOT the Tier-1
        # frame budget: this is a cache-miss-only catastrophic-cost edge case
        # (the shipped Iso_Grid_Overlay.paint() carries only the binary
        # paint-skip LOD gate; no line-budget LOD ships, confirmed by direct
        # code inspection), not a steady-state per-frame path
        # (DeviceCoordinateCache absorbs steady-state redraws; only
        # zoom/config-change frames pay this cost). Ceiling value derived
        # from the 2026-08-16 measurement (worst local p95 297.5 ms
        # across three runs; CI-scaled ~744 ms; ~2.7x headroom, consistent
        # with the other Tier-2 ceilings' margin discipline) — perf-model
        # governance record §3 rule 3
        # (a ceiling's value is set by measurement, never invented to clear a
        # scenario).
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 32 --ov-viewport 7680 4320 --frames 30 --budget-ms 2000

      - name: Realtime apply-remote perf gate (Slice-C, sub-frame ceiling)
        if: runner.os == 'Linux'
        # Phase-10 Slice C (REQ-P10-LOGIC — realtime_apply). Standalone
        # Qt-free P11 gate: times a single realtime_apply.apply_remote of a 47-tile
        # remote update on an 8K document and exits non-zero if the median exceeds
        # REALTIME_APPLY_CEILING_MS (10 ms, logic/constants.py — the --rt-ceiling-ms
        # default). This is a genuine sub-frame apply target (patch-apply must leave
        # headroom under the 16 ms frame for the cursor overlay draw), NOT the
        # per-frame overlay budget. numpy + pycrdt + logic only, no pytest marker,
        # no Qt (currently ~6.9 ms).
        run: python scripts/perf_profile.py --realtime --rt-tiles 47 --frames 30

      - name: Full-frame flatten perf gate (Slice-A, realistic-content ceiling)
        if: runner.os == 'Linux'
        # Phase-12 Slice A (RE-PROFILE, REQ-P12-LOGIC-001/-002/-003).
        # Standalone, Qt-free P11 gate: times the OPTIMISED cold full-frame flatten
        # — blend.composite_stack(region=None) over an 8K, 8-layer realistic stack
        # (sparse, predominantly NORMAL — the tiled + threaded fast-path the Slice-A
        # work targets) — and exits non-zero if the median exceeds the loose
        # catastrophic-regression ceiling COMPOSITE_FULL_CEILING_MS (15000 ms,
        # logic/constants.py). The ceiling is the single source of truth: the
        # scenario resolves it as the --full-frame default, so it is NOT hard-coded
        # here. This is the cold flatten regression class, NOT the 16 ms frame
        # budget. numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --full-frame --content realistic --layers 8 --frames 3

      - name: Viewport-recomposite commit perf gate (Slice-B, opacity-drag)
        if: runner.os == 'Linux'
        # Phase-12 Slice B (RE-PROFILE, REQ-P12-LOGIC-004/-005 + UI-001).
        # Standalone, Qt-free P11 gate: times the opacity-drag split-cache COMMIT
        # path — blend.composite_range suffix re-blend over the worst-case culled
        # viewport (1920x1920 px, 12-layer stack) — and exits non-zero if the
        # median exceeds VIEWPORT_RECOMPOSITE_CEILING_MS (3000 ms,
        # logic/constants.py). The scenario resolves that ceiling as its default
        # single source of truth (S12), so it is NOT hard-coded here; the gate is
        # also byte-exact-guarded (exit 2 if the committed suffix re-blend diverges
        # from a full recomposite). This is the interactive opacity-drag COMMIT
        # regression class, distinct from the Slice-A cold full-frame flatten and
        # from the record-only naive --composite witness. numpy + logic only, no
        # pytest marker, no Qt.
        run: python scripts/perf_profile.py --viewport-recomposite --vp-region-size 1920 --vp-layers 12

      - name: Clean up CI temp root (CI-PixelArtCreator)
        # `if: always()`: a failing leg must still clean up, or a red run
        # leaks its temp root by design. GUARD before deleting, per the CI
        # temp-standardization requirement: refuse unless CI_TEMP_ROOT is (a)
        # non-empty, (b) resolves under ${RUNNER_TEMP}, and (c) still carries
        # the expected CI-PixelArtCreator/<name> shape -- FAIL LOUDLY on any
        # mismatch rather than deleting something unexpected or silently
        # skipping. The path is read from the CI_TEMP_ROOT variable exported
        # by the "Set up CI temp root" step above -- computed there ONCE and
        # reused here, never re-typed. No wildcard is used anywhere in this
        # step. Only the scoped root is touched; the runner workspace, tool
        # cache and Actions cache are never in scope here.
        if: always()
        run: |
          if [[ -z "${CI_TEMP_ROOT:-}" ]]; then
            echo "::error::CI_TEMP_ROOT is not set; refusing to guess a path to delete."
            exit 1
          fi
          case "${CI_TEMP_ROOT}" in
            "${RUNNER_TEMP}"/CI-PixelArtCreator/*) ;;
            *)
              echo "::error::CI_TEMP_ROOT (${CI_TEMP_ROOT}) does not resolve under \${RUNNER_TEMP}/CI-PixelArtCreator/<name>; refusing to delete."
              exit 1
              ;;
          esac
          if [[ -d "${CI_TEMP_ROOT}" ]]; then
            echo "Removing CI temp root: ${CI_TEMP_ROOT}"
            rm -rf "${CI_TEMP_ROOT}"
            echo "Removed: ${CI_TEMP_ROOT}"
          else
            echo "CI temp root already absent (nothing to remove): ${CI_TEMP_ROOT}"
          fi

  # ===========================================================================
  # Phase-13 (REQ-P13-BACKEND-001/-002/-003): dedicated
  # integration job for the deploy/ VPS self-hosting artifacts.
  #
  # SEPARATE from the cross-OS quality-gate matrix above (which deselects
  # `integration` and stays green without Docker/nginx). Proves — over
  # localhost/loopback, with NO live external server and the sync_backend/
  # source byte-unmodified — that the shipped deploy/ artifacts run the relay:
  # the launcher-subprocess & Docker-container multi-client convergence
  # (BACKEND-001) and the Nginx TLS/WSS config + idle-survival tuning
  # (BACKEND-002).
  # ===========================================================================
  integration:
    name: integration (ubuntu-latest)
    runs-on: ubuntu-latest
    # Ample cap for a Docker image build (self-skips if the daemon is unusable)
    # plus the fast launcher/socket/config tests; far under the 6h default.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up CI temp root (CI-PixelArtCreator)
        # Same routing as the quality-gate job's identically-named step (see
        # that step's comment for the full rationale) -- duplicated here
        # rather than shared because a temp root set in one job does not
        # carry into another job. This job has no matrix, so the leg name is
        # just the job name (still deterministic, still overwritten on
        # re-run via the leading `rm -rf`).
        run: |
          CI_TEMP_ROOT="${RUNNER_TEMP}/CI-PixelArtCreator/ci-integration"
          rm -rf "${CI_TEMP_ROOT}"
          mkdir -p "${CI_TEMP_ROOT}"
          echo "CI_TEMP_ROOT=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TEMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMPDIR=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "CI temp root for this leg: ${CI_TEMP_ROOT}"

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      # nginx: the opt-in real idle-past-60s WSS proxy test (self-skips unless
      # PIXELART_NGINX_IDLE_TEST=1). openssl: mints the self-signed loopback cert
      # for that proxy. The Docker daemon is preinstalled on ubuntu-latest.
      # The Qt runtime libs (libegl1/libgl1/xcb/...) are also required even though
      # the deploy tests are Qt-free: the pytest-qt plugin (from [dev]) imports
      # QtGui at pytest_configure, which needs libEGL.so.1 to load the offscreen
      # platform plugin — without it pytest INTERNALERRORs before collecting.
      # Mirrors the quality-gate Ubuntu leg (QT_QPA_PLATFORM=offscreen is global).
      - name: Install Nginx + OpenSSL + Qt runtime OS libraries (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nginx openssl \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project (runtime + dev) from manifest
        # -c constraints.txt: reproducibility lock — pins the full
        # resolved dependency closure (direct + transitive) so this install
        # matches every other CI run and any developer's local environment.
        # Regenerate command + rationale: constraints.txt's own header.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Integration tests (deploy/ launcher, Docker, Nginx WSS — localhost)
        # Runs the `integration`-marked deployment acceptance, which ADR-0043 moved
        # out of tests/backend/ into its OWN root tests/deploy/ (this workflow's
        # owner owns deployment; the sync-backend service agent owns tests/backend/).
        # BOTH roots are named on purpose. tests/deploy/ holds all 9 integration
        # tests today; tests/backend/ holds none. Naming only tests/deploy/ would
        # silently stop running any integration test a future backend change adds
        # under tests/backend/ — the exact "moved file CI no longer names" failure
        # this ADR was written to avoid. Naming both is also what keeps this step
        # off pytest's exit-code 5 (NO_TESTS_COLLECTED): after the move,
        # `pytest -m integration tests/backend/` collects 0 and exits 5, failing
        # the job. Verified locally: 9 collected across the two roots. The fast
        # tests (launcher-subprocess convergence, Nginx config assertions, short
        # idle-survival) RUN and must pass. The Docker-container test builds the
        # shipped deploy/Dockerfile on the ubuntu daemon (self-skips if the daemon
        # is unusable). The SLOW real-nginx 60s+ idle test stays OPT-IN and
        # self-skips because PIXELART_NGINX_IDLE_TEST is unset here (CI-time
        # budget) — it is NOT forced on every push. No extra Qt libs beyond the
        # apt step above are needed: these tests import only the Qt-free
        # data/logic layer.
        run: pytest -m integration testing/suites/deploy/ testing/suites/backend/ --basetemp="${CI_TEMP_ROOT}/pytest"

      - name: Clean up CI temp root (CI-PixelArtCreator)
        # Same guard shape as the quality-gate job's identically-named step:
        # if: always() so a red run still cleans up; refuses to delete unless
        # CI_TEMP_ROOT is non-empty, under ${RUNNER_TEMP}, and still shaped
        # CI-PixelArtCreator/<name>; reads the SAME exported variable rather
        # than recomputing the path; no wildcard.
        if: always()
        run: |
          if [[ -z "${CI_TEMP_ROOT:-}" ]]; then
            echo "::error::CI_TEMP_ROOT is not set; refusing to guess a path to delete."
            exit 1
          fi
          case "${CI_TEMP_ROOT}" in
            "${RUNNER_TEMP}"/CI-PixelArtCreator/*) ;;
            *)
              echo "::error::CI_TEMP_ROOT (${CI_TEMP_ROOT}) does not resolve under \${RUNNER_TEMP}/CI-PixelArtCreator/<name>; refusing to delete."
              exit 1
              ;;
          esac
          if [[ -d "${CI_TEMP_ROOT}" ]]; then
            echo "Removing CI temp root: ${CI_TEMP_ROOT}"
            rm -rf "${CI_TEMP_ROOT}"
            echo "Removed: ${CI_TEMP_ROOT}"
          else
            echo "CI temp root already absent (nothing to remove): ${CI_TEMP_ROOT}"
          fi
