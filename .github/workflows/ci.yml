# =============================================================================
# CI pipeline (GitHub Actions) — PixelArt Creator
# Owner: AGT-09 GitHub/DevOps. Grounded by F11 (headless PySide6 CI) + F14
# (pyproject manifest). Mandatory software-dev extension (spec-driven-development
# .md §5) — may not be scoped out.
#
# Runs on push + pull_request: installs the project from pyproject.toml into a
# clean runner, then runs the full quality gate HEADLESS (QT_QPA_PLATFORM=
# offscreen) with the OS libraries PySide6 needs. Python 3.12 pinned. A
# single-run concurrency guard cancels superseded runs for the same ref.
#
# REPRODUCIBILITY (R-11, constraints.txt): every `pip install -e ...` step
# below also passes `-c constraints.txt` — a committed, regenerable pip
# constraints file pinning the FULL resolved dependency closure (direct +
# transitive, 53 packages) so every CI run and every developer installs the
# SAME versions instead of re-resolving pyproject.toml's floors against
# whatever is newest on PyPI that day. pyproject.toml's public `dependencies`
# floors are UNCHANGED by this — see constraints.txt's own header for the
# mechanism, the exact regeneration command, and why one file safely serves
# all three OS legs of the matrix below.
#
# Phase-13 Slice 13A (REQ-P13-BUILD-001, T13A-12): the quality-gate job is a
# 3-OS matrix — ubuntu-latest + windows-latest + macos-latest — each leg running
# the FULL test suite headless (QT_QPA_PLATFORM=offscreen; the SAME pytest
# invocation on every OS via `shell: bash`) so the platform is provably portable
# (plan §3.1). The static/lint/type/coverage gates and the calibrated perf gates
# stay Ubuntu-only (`if: runner.os == 'Linux'`) — the perf ceilings are tuned to
# the Ubuntu runner and the source-lint results are OS-invariant. fail-fast is
# OFF so a genuine Windows/macOS regression does not cancel the other legs (each
# leg's result is captured). The Ubuntu Qt apt install is Linux-guarded; Windows
# and macOS need no extra system libs for offscreen Qt. Concurrency guard +
# Python-3.12 pin preserved.
# =============================================================================
name: ci

on:
  push:
    # Branch-naming convention, user decision 2026-08-02: dev branches are
    # named `feat-<something>` / `fix-<something>` — HYPHEN, not slash. The
    # container directory is its own git repository versioning the
    # orchestration system separately, and branch worktrees are created as
    # sibling folders of `main/`; a branch named `feat/foo` would produce a
    # NESTED `feat/foo` directory that a top-level ignore pattern cannot
    # exclude cleanly, whereas `feat-foo` is one flat folder. This filter is
    # PERMANENT (see the "LEFT UNCHANGED" note in the temporary-scoping block
    # above) — it is not undone when the repository goes public.
    #
    # Deliberately `feat-*` / `fix-*`, NOT `feat-**` / `fix-**`: in GitHub's
    # branch-filter glob syntax, `*` does not match `/`, while `**` does. Using
    # the single star means this CI filter itself refuses to match a nested
    # name like `feat-foo/bar` — a second, independent enforcement of the
    # flatness rule on top of the container's own naming gate. Do NOT
    # "generalise" this to `**` in a future edit; that would silently remove
    # this guarantee.
    #
    # No migration needed: verified this session, the repository has exactly
    # one local branch (`main`) and exactly one remote branch (`origin/main`)
    # — no `feat/` branch exists anywhere, so this change strands nothing.
    branches: [main, "feat-*", "fix-*"]
    # Phase-13 Slice 13D (ADR-0038 §3): a v* tag is the release BUILD trigger for
    # the native-installer matrix below. Branch/PR pushes do NOT build installers
    # (the build-installers job self-guards) so PR CI is not slowed.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Manual trigger, shared by two independent on-demand jobs below (each reads
  # this input and self-guards; the input decides WHICH runs, so an ordinary
  # manual dispatch does not pay for both):
  #   - build-installers (ADR-0038 §3): the native-installer matrix.
  #   - regenerate-constraints (#31, R-11 residual): the Linux constraints
  #     regeneration review job.
  workflow_dispatch:
    inputs:
      target:
        description: "Which on-demand job to run"
        required: true
        default: "build-installers"
        type: choice
        options: ["build-installers", "regenerate-constraints"]

# Single-run concurrency guard: a new run for the same ref cancels the older one
# so two runs never contend for a shared runner (flaky-timeout avoidance, F11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen        # headless Qt (F11)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-gate:
    # Display name deliberately interpolates matrix.os, NOT matrix.runs_on: the
    # self-hosted leg's os label is windows-selfhosted (see the matrix below),
    # so this still resolves to three distinct, readable leg names in the UI —
    # "quality-gate (ubuntu-latest)", "quality-gate (windows-selfhosted)",
    # "quality-gate (macos-latest)" — instead of collapsing the renamed leg
    # back to a bare "windows-latest" a reader could mistake for the hosted
    # runner it replaces.
    name: quality-gate (${{ matrix.os }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      # fail-fast OFF: a genuine platform-specific regression on one leg must NOT
      # cancel the other legs — we need every OS's result (13A discovery signal,
      # BUILD-001). Windows/macOS surface the suite for the FIRST time here.
      fail-fast: false
      matrix:
        # SELF-HOSTED WINDOWS LEG (user decision, 2026-08-02): GitHub Actions
        # resumed billing against the Free-plan 2,000 included minutes/month on
        # 2026-08-02 (monthly reset) after this same matrix exhausted them
        # before; macOS bills at ~10x and Windows at ~1.67x the Linux minute,
        # so the window will exhaust again on an unchanged matrix. Self-hosted
        # runner minutes are FREE and unmetered per GitHub's own billing
        # reference, and exactly ONE self-hosted runner exists right now:
        # `pixelart-local-probe` (labels: self-hosted, Windows, X64,
        # selfhosted-probe) — a Windows x64 machine. There is no Linux and no
        # macOS self-hosted runner, and none can be created on this host (no
        # Docker/Podman, no WSL, Windows 11 Home has no Hyper-V so no Windows
        # containers either, and macOS cannot be virtualised on non-Apple
        # hardware at all) — so ONLY the Windows leg moves. ubuntu-latest and
        # macos-latest stay hosted, unchanged, on purpose: this is
        # additive/substitutive ONLY where possible, not a wholesale switch
        # (user directive, verbatim: "state self-hosted runner for GitHub
        # Actions for the legs that are possible, and the rest leave them as
        # they are now").
        #
        # `include:` (rather than a flat `os:` list) is used because the
        # self-hosted leg's runs-on target must be a LABEL ARRAY
        # ([self-hosted, Windows, X64]), not a hosted-runner string, so `os`
        # (the identity/display label — unchanged in meaning for the ubuntu and
        # macos legs) and `runs_on` (the literal runs-on target) are split into
        # two matrix keys. `os: windows-selfhosted` (not `windows-latest`) is
        # deliberate — see the job `name:` comment above.
        #
        # `timeout` is a PER-LEG matrix key (see `timeout-minutes:` below):
        # applying the shared 75-minute job cap to a runner that may not be
        # online turns a dead/offline self-hosted runner into a worst-case
        # 75-minute hang once a runner does pick the job up (a job that is
        # never picked up at all queues under GitHub's own ~24h queued-job
        # ceiling, which nothing in this file can shorten). The self-hosted leg
        # gets a much shorter cap instead — 45 minutes, MEASURED, not a guess:
        # run 30749285915 (the last all-hosted run before this change) timed
        # the hosted `windows-latest` leg at 15 min wall-clock, WARM (Python
        # already in the hosted tool cache, pip mostly cache-hit, git
        # pre-provisioned). 45 min is 3x that 15-min measured figure —
        # headroom sized for what a warm run does NOT pay for but a genuinely
        # COLD first run on this bare runner does: (a) actions/setup-python
        # downloading and installing CPython 3.12 from the
        # actions/python-versions release instead of hitting a pre-populated
        # tool cache, (b) `pip install -c constraints.txt -e ".[dev]"`
        # resolving/downloading the full runtime+dev closure with no local
        # wheel cache, and (c) the first-ever `actions/checkout` on this
        # machine. 25 min (the earlier, unmeasured value) gave only 10 min of
        # headroom over the same 15-min figure — too tight to survive a cold
        # run's extra cost without the cold run itself looking like a timeout
        # defect. If genuine warm runs start approaching or exceeding 45 min,
        # raise this value against a NEW measurement, same as this one — do
        # not reflexively raise it back to 75.
        include:
          # DISABLED (see the TEMPORARY revert block at the top of this file):
          # hosted Ubuntu leg commented out verbatim, ZERO hosted minutes
          # while this is in effect. Uncomment to restore.
          # - os: ubuntu-latest
          #   runs_on: ubuntu-latest
          #   timeout: 75
          - os: windows-selfhosted
            # PUBLIC-REPO HAZARD — READ BEFORE MAKING THIS REPOSITORY PUBLIC:
            # GitHub's own documentation says self-hosted runners "should
            # almost never be used for public repositories... because any user
            # can open pull requests against the repository and compromise the
            # environment." THIS LEG MUST BE REVERTED to a hosted
            # `windows-latest` runner (collapse `os`/`runs_on` back into a flat
            # `os: [ubuntu-latest, windows-latest, macos-latest]` list, restore
            # `runs-on: ${{ matrix.os }}` and the original `name:` /
            # `timeout-minutes: 75`) BEFORE this repository's visibility
            # changes to public. Do not carry this configuration into a public
            # repo.
            runs_on: [self-hosted, Windows, X64]
            timeout: 45
          # DISABLED (see the TEMPORARY revert block at the top of this file):
          # hosted macOS leg commented out verbatim, ZERO hosted minutes
          # while this is in effect. Uncomment to restore.
          # - os: macos-latest
          #   runs_on: macos-latest
          #   timeout: 75
    # Job-level wall-clock cap: a hung/deadlocked test can no longer pin a runner
    # for ~6h. The full offscreen-Qt UI suite measures ~46-48 min on the 2-core
    # Ubuntu runner (see run 28635312681, cancelled at 98% by an earlier 45-min
    # cap), so the two hosted legs (75 min, via matrix.timeout above) are set
    # comfortably above that with headroom for runner variance. The self-hosted
    # Windows leg uses a distinct, shorter 45-minute cap instead — MEASURED
    # against run 30749285915's 15-min warm hosted `windows-latest` figure (3x
    # headroom for a cold first run's extra setup-python/pip/checkout cost);
    # see the matrix comment above for the full rationale and tradeoff. The
    # per-test --timeout below (120s, thread) is the fine-grained guard that
    # fails fast and names a genuinely hung test; this job cap is only the
    # coarse backstop (FU-12).
    timeout-minutes: ${{ matrix.timeout }}
    # Run every step under bash on ALL three legs so the SAME pytest invocation
    # (with `\` line continuations) executes identically — the Windows default
    # shell (pwsh) would otherwise break the multi-line command (portability).
    # This still applies to the self-hosted Windows leg: `shell: bash` needs a
    # bash executable on PATH, which Git for Windows (commonly present on a dev
    # machine such as this one) provides — EXPECTED to work but not yet
    # exercised as an actual Actions job step on this runner, so treat as
    # UNVERIFIED alongside the other self-hosted assumptions below.
    defaults:
      run:
        shell: bash
    # SELF-HOSTED WINDOWS LEG — per-`uses:` compatibility assessment (this leg
    # only; the ubuntu-latest and macos-latest legs are unchanged hosted
    # runners and none of this applies to them):
    #   actions/checkout@v5      - needs a `git` executable on PATH. This
    #                              machine already has git (it is the dev
    #                              checkout of this very repository), so this
    #                              is EXPECTED to work but has never actually
    #                              been exercised as an Actions job step on
    #                              this runner — UNVERIFIED.
    #   actions/setup-python@v6  - hosted runners ship Python 3.12 in a
    #     (cache: pip)             pre-populated tool cache; this bare runner
    #                              does not, so the action will most likely
    #                              DOWNLOAD and install CPython 3.12 from the
    #                              actions/python-versions release the first
    #                              time it runs here (slower, needs network
    #                              egress) rather than hitting a local cache.
    #                              `cache: pip` itself keys off GitHub's remote
    #                              Actions cache service (not local disk), so it
    #                              should behave the same as on a hosted runner
    #                              PROVIDED this runner has outbound network
    #                              access to that service — UNVERIFIED here.
    #                              Because the runner process is currently a
    #                              foreground temp-dir process, not an
    #                              installed service (see the risk comment on
    #                              the matrix above), even a locally-populated
    #                              tool cache would not reliably survive
    #                              between sessions.
    #   actions/setup-node@v4    - Linux-gated (`if: runner.os == 'Linux'`), so
    #                              it never runs on this leg — not a
    #                              self-hosted concern here.
    # CONCURRENCY: exactly one self-hosted runner is registered against this
    # repository, so this leg now SERIALISES against any other job/run that
    # also targets [self-hosted, Windows, X64] — two pushes in flight, or a
    # future job added to the same label set, will queue behind one another
    # instead of running in parallel the way two hosted-runner jobs would.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (pinned)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # OS-level libraries required to import/run PySide6 (Qt6) headless on a
      # clean Ubuntu runner (F11: xkbcommon, EGL/GL, dbus, X libs for offscreen).
      # Ubuntu-only: Windows/macOS GitHub runners need no extra system libs for
      # offscreen Qt (plan §3.1).
      - name: Install Qt runtime OS libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project (runtime + dev) from manifest
        # -c constraints.txt: reproducibility lock (R-11) — pins the full
        # resolved dependency closure (direct + transitive) so this install
        # matches every other CI run and any developer's local environment.
        # Regenerate command + rationale: constraints.txt's own header.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      # ----- Static / lint / type gates: Ubuntu-only (OS-invariant source lints;
      # keep the shipped Ubuntu gate as-is, plan §3.1). -----
      - name: Lint (flake8)
        # UN-GATED (temporary, see revert block at top of file): this check is
        # OS-invariant and was only Linux-gated to avoid paying for it three
        # times across the hosted matrix, not because it needs Linux.
        run: flake8 pixelart_creator scripts

      - name: Format check (black + isort)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        run: |
          black --check pixelart_creator scripts
          isort --check-only pixelart_creator scripts

      - name: Type check (mypy)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        run: mypy pixelart_creator

      - name: Path-portability lint (P11 script)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        run: python scripts/path_portability_check.py --root .

      - name: Architecture layering + cycle checks (P11 scripts)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        # check_layering is run over BOTH roots, because ONE root is not enough:
        #   --root pixelart_creator  enforces the three client layers (ui/logic/
        #                            data), whose rules key on parts[0] RELATIVE
        #                            to that root.
        #   --root .                 enforces the two non-three-layer top-level
        #                            packages (sync_backend/, web_viewer/), whose
        #                            rules key on parts[0] relative to the REPO
        #                            root — and, since the fail-closed fix, also
        #                            FAILS on any unregistered new top-level
        #                            package (a future mobile/VPS-host package is
        #                            guarded from its first commit instead of
        #                            being silently skipped while CI stayed green).
        # The `--root .` invocation was previously MISSING even though the comment
        # here claimed it dispatched everything, so sync_backend/ and web_viewer/
        # had ZERO layering enforcement. Both roots now run; neither is optional.
        # check_cycles stays per-package: it walks each top-level package's own
        # intra-import graph, so it needs one invocation per root.
        run: |
          python scripts/check_layering.py --root pixelart_creator
          python scripts/check_layering.py --root .
          python scripts/check_cycles.py --root pixelart_creator
          python scripts/check_cycles.py --root sync_backend
          python scripts/check_cycles.py --root web_viewer

      - name: I18n string audit (report, P11 script; AGT-07)
        # UN-GATED for OS (temporary, see revert block at top of file): the
        # `if: runner.os == 'Linux'` guard removed here is OS-invariance
        # scoping only, unrelated to the pass/fail flip below.
        #
        # BLOCKING (D-22, WP-6.5, decision batch 2026-08-16): this step was
        # warn-and-continue (exit 1 findings swallowed to a `::warning::`,
        # only exit 2 script-error failed the build) because the script's own
        # contract is report-not-fix and pixelart_creator/ui carried findings.
        # Re-measured this session: pixelart_creator/ui is CLEAN (0 findings,
        # `string_audit_check.py --root pixelart_creator/ui` exits 0) — a
        # clean surface makes blocking cost-free, so the swallow is removed.
        # Exit codes, now both fatal to this step: 0 clean (pass); 1 findings
        # (FAILS the build — a future unwrapped string is caught at commit
        # time, AGT-07 clears it); 2 script error (FAILS the build, as
        # before — an audit that could not run is not an audit that found
        # nothing). No swallowing of any non-zero exit remains.
        run: python scripts/string_audit_check.py --root pixelart_creator/ui

      # ----- Docs gates (REMEDIATION 2026-07-30, F14): neither gate below had
      # ever run in CI before this change — mkdocs build --strict and
      # pydocstyle both existed as tools the project used locally but were
      # never wired, so a red docs build or a docstring regression could never
      # have blocked a merge. Ubuntu-only, same as the other static gates. -----
      - name: Docs build (mkdocs --strict, F14)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        # main/docs/site/mkdocs.yml (AGT-08 mkdocs-site skill). --strict turns
        # every warning (broken internal link, a nav entry with no matching
        # page, etc.) into a build failure so the published User Guide can
        # never drift silently out of sync with docs_dir. Measured 2026-07-30:
        # PASSES — exit 0, 16 pages, zero warnings. Gates immediately, no
        # exception needed.
        run: mkdocs build -f docs/site/mkdocs.yml --strict

      - name: Docstring lint (pydocstyle, PEP 257) [TIME-BOXED EXCEPTION, expires 2026-08-31]
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        # Ruleset: [tool.pydocstyle] convention="pep257" in pyproject.toml (see
        # that file's comment for why pep257 — the project's own documented
        # docstring discipline — and not google/numpy, which would manufacture
        # section-formatting findings against a style never adopted here).
        #
        # HONEST MEASUREMENT, EXPLICIT EXCEPTION — same pattern as the
        # non-client coverage gate above. This is the REAL pep257 check; it is
        # NOT weakened (no add-ignore/add-select) and pixelart_creator is NOT
        # excluded.
        #
        # Real numbers measured 2026-07-30 (local, py3.13, convention=pep257,
        # no add-ignore): 102 findings across 41 files — D102 x48 (missing
        # public-method docstring), D107 x16 (missing __init__ docstring),
        # D401 x13 (first line not imperative mood), D105 x11 (missing
        # magic-method docstring), plus D101/D209/D301/D402 (minor,
        # single-digit each). Concentrated in Phase 1-3 modules; this
        # redness is TRUE, not a tooling artefact — the gate simply never ran
        # before. Clearing the findings is AGT-08's job (docs content), not
        # this workflow's.
        #
        # DEBT REPAID: 0 findings measured 2026-08-16 (AGT-08, job
        # 20260816-spec-audit-test-rebuild-docs-move; `pydocstyle
        # pixelart_creator` exits 0). The 102-finding number above is now
        # historical context, not the current state. The time-boxed
        # exception scaffold below is left in place (unexercised while the
        # gate stays green) rather than removed, so a future regression is
        # still caught and self-expires on the same 2026-08-31 milestone.
        #
        # The time-box is SELF-ENFORCING, not a comment: past EXPIRY this step
        # starts failing the build unconditionally. Same 2026-08-31 milestone
        # as the non-client coverage exception above, so both known gaps are
        # repaid on one shared deadline instead of drifting independently.
        run: |
          EXPIRY=2026-08-31
          if pydocstyle pixelart_creator; then
            echo "pixelart_creator meets the pep257 docstring gate"
            exit 0
          fi
          TODAY="$(date -u +%F)"
          if [[ "${TODAY}" > "${EXPIRY}" ]]; then
            echo "::error::Time-boxed pydocstyle exception EXPIRED on ${EXPIRY}. pixelart_creator still fails the pep257 docstring gate (see step log above for current findings). This now BLOCKS: clear the findings (AGT-08) -- do not extend the box without an explicit decision."
            exit 1
          fi
          echo "::warning::pixelart_creator fails the pep257 docstring gate (102 findings measured 2026-07-30; D102/D107/D401/D105 dominant -- see pyproject.toml [tool.pydocstyle] for the ruleset and the step comment for the full breakdown). KNOWN and time-boxed until ${EXPIRY} (owner AGT-08). This step BLOCKS the build after ${EXPIRY}."

      - name: Tests (pytest, headless, parallel, with coverage XML)
        # -n auto: pytest-xdist fans the suite across all runner cores, cutting
        # the ~46-48 min single-process wall-time to a fraction (FU-20). Per-test
        # QStandardPaths app-config is isolated to a per-test tmp dir in the ui
        # conftest so the parallel workers never race the shared favourites.json.
        # pytest-cov aggregates coverage across the xdist workers, so the coverage
        # gate below still sees the full merged result (verified >=90/>=80).
        # --timeout=120 --timeout-method=thread: per-test hard cap so a single
        # hung test fails fast (naming itself) instead of hanging the whole run.
        # --durations=15: always surface the 15 slowest tests in the CI log so a
        # creeping suite-runtime regression is visible (FU-12 / FU-20).
        # -m "not slow and not gpu and not cloud_live and not assistant_live":
        # cloud_live gates the live credential/OAuth provider tests (real OS
        # keyring, out-of-CI, CL-B2/CL-B3) so they skip here; the MOCKED provider
        # contract tests (tests/data/test_cloud_providers_*) carry NO marker and
        # still run. assistant_live (Phase-14, ADR-0040 §5 / DEP-4) likewise gates
        # the real external-LLM-provider path (14D, real key/credentials) so it
        # skips here; the 14B fake-adapter tests carry NO marker and still run. The
        # in-process real-time backend suite (tests/backend/) is collected via
        # testpaths=["tests", "web_viewer/tests"] and runs with the mocked
        # loopback/ws transports.
        # -m also deselects `integration` (Phase-13 13C, T13C-06): the deploy/ VPS
        # acceptance tests — since ADR-0043 in their OWN root tests/deploy/
        # (test_vps_localhost.py, test_nginx_wss_localhost.py) — reach outside the
        # process (launcher subprocess / Docker / Nginx / real socket) and would need
        # Docker+nginx that the Windows/macOS runners lack; they run ONLY in the
        # dedicated `integration` job below, keeping this cross-OS matrix green
        # without them. tests/deploy/ needs no new path here: it sits UNDER the
        # existing "tests" testpaths root, so this bare `pytest` collects it (and
        # then deselects it by marker) with no manifest change. The default-gate
        # deploy guard (tests/backend/test_hosting_default_unchanged.py) carries NO
        # integration marker and still runs here.
        run: |
          pytest -n auto -m "not slow and not gpu and not cloud_live and not assistant_live and not integration" \
            --timeout=120 --timeout-method=thread --durations=15 \
            --cov=pixelart_creator --cov-branch --cov-report=xml --cov-report=term

      - name: Coverage gate — client package (>=90 line / >=80 branch, S13)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        # SCOPE (made explicit): this gate reads the coverage.xml produced by the
        # pytest step above, which measures `--cov=pixelart_creator` ONLY. It
        # therefore says NOTHING about the two shipped non-three-layer packages
        # sync_backend/ and web_viewer/ — those are measured and gated by the two
        # steps that follow. Neither gate is optional and neither subsumes the
        # other. Thresholds are the constitutional 90/80 and are NOT lowered.
        run: python scripts/coverage_gate.py --xml coverage.xml --line 90 --branch 80

      # ----- Non-client coverage: sync_backend/ + web_viewer/ ------------------
      # WHY A SECOND MEASUREMENT: `--cov=pixelart_creator` above excludes both
      # shipped non-client packages, so until now they were entirely UNMEASURED
      # while CI reported green. They are measured here by the tests that
      # actually exercise them (tests/backend/ + web_viewer/tests/), in their own
      # coverage data file so the client run above is untouched. The XML is then
      # regenerated with `coverage xml --omit="*/tests/*"` — a SEPARATE report
      # invocation, not a second `--cov` source on the main run, because passing
      # several `--cov` roots to one pytest run makes pytest-cov relativise every
      # file to its own source root: `pixelart_creator/__init__.py`,
      # `sync_backend/__init__.py` and `web_viewer/__init__.py` then all collapse
      # into one Cobertura package "." with COLLIDING filenames, silently losing
      # files. The omit drops the test modules themselves from the measurement so
      # only shipped code is graded.
      - name: Measure non-client coverage (sync_backend + web_viewer)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        env:
          COVERAGE_FILE: .coverage.nonclient
        run: |
          pytest -m "not slow and not gpu and not cloud_live and not assistant_live and not integration" \
            tests/backend tests/deploy web_viewer/tests \
            --timeout=120 --timeout-method=thread \
            --cov=sync_backend --cov=web_viewer --cov-branch --cov-report=term
          # Written under coverage/ because that path is ALREADY gitignored, so
          # this CI artefact can never be committed by accident.
          python -m coverage xml --omit="*/tests/*" -o coverage/nonclient.xml

      - name: Coverage gate — non-client packages (>=90 line / >=80 branch, S13)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        # Formerly a time-boxed exception (expired scaffolding removed
        # 2026-07-30): sync_backend/web_viewer measured below the
        # constitutional 90/80 on 2026-07-29 (sync_backend 93.57%/76.00%,
        # web_viewer 5.56%/0.00%). 33 new tests closed that gap; re-measured
        # 2026-07-30 at sync_backend 100.00%/100.00% and web_viewer
        # 100.00%/100.00%, gate exit 0. The debt is repaid, so this is now a
        # plain, unconditional gate at the constitutional 90/80 — same shape
        # as the client-coverage gate above. Thresholds are NOT lowered and
        # the packages are NOT excluded.
        run: python scripts/coverage_gate.py --xml coverage/nonclient.xml --line 90 --branch 80

      # ----- Web-viewer JS-unit gate (Phase-13 Slice 13E, T13E-G04, F11).
      # Ubuntu-only: node is available on the ubuntu runner (absent on the local
      # Windows host, where it is a documented SKIP). Frame-work-free, no bundler
      # (ADR-0036 D3) — the .mjs test file carries its OWN assert-based runner and
      # calls process.exit(1) on any failure, so it is run as a bare script
      # (`node <file>`), NOT via `node --test`. It imports the DOM-free pure-logic
      # module web_viewer/static/viewer_core.mjs and checks decode/LWW-accept/
      # integer-scale + render-fidelity vs the shipped Python reference (+/-1 LSB).
      # A distinct step: a JS-unit failure fails THIS leg. -----
      - name: Set up Node.js (web-viewer JS-unit)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant
        # (Node runs fine on the self-hosted Windows leg; setup-node installs
        # its own toolchain rather than relying on a pre-provisioned one).
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web-viewer JS-unit tests (node, framework-free)
        # UN-GATED (temporary, see revert block at top of file): OS-invariant.
        run: node web_viewer/tests/test_viewer_core.mjs

      # ----- Perf gates: Ubuntu-only. The ceilings are calibrated to the Ubuntu
      # GitHub runner; running them on Windows/macOS would compare against the
      # wrong baseline (plan §6, invoker directive). -----
      - name: 8K paint/redraw perf gate (P-A scenario, D-32, REQ-P1-UI-023)
        if: runner.os == 'Linux'
        # Phase-1 (AGT-10 D-32 rebuild -> AGT-09 wiring, WP-6.4, decision
        # batch 2026-08-16). The rebuilt scripts/perf_profile.py default
        # (tiling) mode now imports and drives the REAL
        # `ui.canvas_scene.CanvasScene.drawBackground` against a real
        # `logic.document.Document` — replacing the self-described mirror
        # (`draw_background_tiles`) that CF-06 found imported no product UI
        # module. `--width`/`--height` are now LIVE: the exposed rect is
        # intersected with the real scene's own `sceneRect()`, exactly as a
        # QGraphicsView does. The invocation below is the **P-A scenario** —
        # 8K full-view at fit zoom, the gating case named in
        # design-docs/specs/phase-1-ui-canvas/render-strategy.md §9 — and
        # exits non-zero if the median exceeds the UNRELAXED Tier-1
        # FRAME_BUDGET_MS (16 ms, logic/constants.py, the --budget-ms
        # default). Perf-model governance record
        # design-docs/auxiliary/perf-model-governance-20260816.md §7
        # forbids manufacturing a Tier-2 ceiling for this REQ to make the
        # gate easier to pass — none is used here. Measured locally
        # 2026-08-16 (AGT-10, this Windows host — host-dependent, not a CI
        # result): 9.92 ms median, ~40% margin under budget.
        run: python scripts/perf_profile.py --width 7680 --height 4320 --zoom 0.25 --viewport 1920 1080 --frames 60

      - name: Compositor region-recomposite perf gate (FU-15)
        if: runner.os == 'Linux'
        # Standalone, Qt-free P11 gate: times the region-recomposite path on an
        # 8K multi-layer document and exits non-zero if the median exceeds
        # COMPOSITE_REGION_CEILING_MS (200 ms, logic/constants.py). No pytest
        # marker, no extra env — numpy + logic only. Catches the SC-UI-015-1
        # catastrophic O(full-canvas) recomposite regression class.
        run: python scripts/perf_profile.py --composite

      - name: Tilemap render_region perf gate — part 1 (interactive frame budget)
        if: runner.os == 'Linux'
        # Standalone, Qt-free P11 gate (Phase-6, AGT-10/AGT-01). Times
        # logic/tilemap.render_region over a typical interactive viewport tile
        # (256x256 px @ 16 px tiles = 16x16 cells) and exits non-zero if the
        # median exceeds FRAME_BUDGET_MS (16 ms, logic/constants.py — the default
        # --budget-ms). Guards the 60-fps interactive draw path (currently
        # ~0.54 ms). numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --tilemap --tm-region 256 256 --tm-tile 16 --frames 30

      - name: Tilemap render_region perf gate — part 2 (catastrophic ceiling)
        if: runner.os == 'Linux'
        # Companion catastrophic-ceiling gate: renders the full 8K region
        # (7680x4320 px @ 16 px tiles = 480x270 cells) and exits non-zero if the
        # median exceeds TILEMAP_VIEWPORT_CEILING_MS (3000 ms, logic/constants.py,
        # passed via --budget-ms 3000). Catches an O(full-map) worst-case
        # render regression class distinct from the interactive budget above
        # (currently ~247 ms). numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --tilemap --tm-region 7680 4320 --tm-tile 16 --frames 8 --budget-ms 3000

      - name: Visual-aids overlay perf gate — part 1 (worst-case iso overlay)
        if: runner.os == 'Linux'
        # Phase-9 (AGT-10/AGT-01, REQ-P9-UI-011). Times the REAL shipped iso-grid
        # overlay item's paint() over the full-scene worst case (fine 2 px tiles,
        # 1920x1080 viewport) and exits non-zero if the median frame exceeds
        # OVERLAY_FRAME_CEILING_MS (48 ms, logic/constants.py — passed via
        # --budget-ms 48). Article VI's per-frame budget APPLIES this phase because
        # the overlays + multi-view are on the interactive render loop (unlike the
        # Phase-7/8 batch work). Headless offscreen Qt via the job env.
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 2 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 2 (zoomed iso, exposed sub-rect)
        if: runner.os == 'Linux'
        # Companion iso gate at an interactive zoom (16x) over a small exposed
        # sub-rect (120x67 px) — the culled-viewport draw the user actually pays
        # for while editing. Same OVERLAY_FRAME_CEILING_MS (48 ms) ceiling.
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 2 --ov-zoom 16 --ov-exposed 120 67 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 3 (combined multi-view + preview)
        if: runner.os == 'Linux'
        # Combined dirty-rect composite: 7 extra views + the real-size preview each
        # blit a 64x64 dirty sub-rect (MinimalViewportUpdate — cost scales with the
        # dirty rect x views, not the 8K canvas x N). Guards the REQ-P9-UI-008
        # live-sync render loop against the same 48 ms OVERLAY_FRAME_CEILING_MS.
        run: python scripts/perf_profile.py --overlay --ov-kind combined --ov-views 7 --ov-dirty 64 64 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 4 (Slice-C live cursors)
        if: runner.os == 'Linux'
        # Phase-10 Slice C (AGT-10 report §5, REQ-P10-UI-013). Times the REAL
        # shipped Live_Cursors_Overlay.paint() with the worst case of
        # MAX_SHARED_MEMBERS (32) collaborator cursors all inside the exposed rect
        # (no cull) and exits non-zero if the median frame exceeds
        # OVERLAY_FRAME_CEILING_MS (48 ms, passed via --budget-ms 48). Headless
        # offscreen Qt via the job env (currently ~1.3 ms).
        run: python scripts/perf_profile.py --overlay --ov-kind cursors --ov-cursors 32 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 5 (Slice-C combined apply + cursors frame)
        if: runner.os == 'Linux'
        # Companion Slice-C gate: the COMBINED interactive frame — one
        # realtime_apply.apply_remote plus the 32-cursor overlay paint — against
        # the same 48 ms OVERLAY_FRAME_CEILING_MS. Guards the live-collab render
        # loop end-to-end (apply + draw), distinct from the sub-frame apply-only
        # --realtime gate below (currently ~1.6 ms).
        run: python scripts/perf_profile.py --overlay --ov-kind cursors-rt --ov-cursors 32 --ov-viewport 1920 1080 --frames 30 --budget-ms 48

      - name: Visual-aids overlay perf gate — part 6 (D-29, 8K overlay catastrophic ceiling)
        if: runner.os == 'Linux'
        # Phase-9/Phase-12 (AGT-10 D-29 -> AGT-09 wiring, WP-6.4, decision
        # batch 2026-08-16). The literal 8K overlay viewport
        # (`--ov-viewport 7680 4320`) was missing entirely from every wired
        # `--overlay` step above (all five run at 1920x1080), so no job
        # exercised the iso-grid CPU-raster cache-miss fallback risk at the
        # real canvas size. Gates at TIER 2 — OVERLAY_8K_CEILING_MS (2000 ms,
        # logic/constants.py, passed via --budget-ms 2000) — NOT the Tier-1
        # frame budget: this is a cache-miss-only catastrophic-cost edge case
        # (the shipped Iso_Grid_Overlay.paint() carries only the binary
        # paint-skip LOD gate; no line-budget LOD ships, confirmed by direct
        # code inspection), not a steady-state per-frame path
        # (DeviceCoordinateCache absorbs steady-state redraws; only
        # zoom/config-change frames pay this cost). Ceiling value derived
        # from AGT-10's 2026-08-16 measurement (worst local p95 297.5 ms
        # across three runs; CI-scaled ~744 ms; ~2.7x headroom, consistent
        # with the other Tier-2 ceilings' margin discipline) — perf-model
        # governance record
        # design-docs/auxiliary/perf-model-governance-20260816.md §3 rule 3
        # (a ceiling's value is set by measurement, never invented to clear a
        # scenario).
        run: python scripts/perf_profile.py --overlay --ov-kind iso --ov-tile 32 --ov-viewport 7680 4320 --frames 30 --budget-ms 2000

      - name: Realtime apply-remote perf gate (Slice-C, sub-frame ceiling)
        if: runner.os == 'Linux'
        # Phase-10 Slice C (AGT-10, REQ-P10-LOGIC — realtime_apply). Standalone
        # Qt-free P11 gate: times a single realtime_apply.apply_remote of a 47-tile
        # remote update on an 8K document and exits non-zero if the median exceeds
        # REALTIME_APPLY_CEILING_MS (10 ms, logic/constants.py — the --rt-ceiling-ms
        # default). This is a genuine sub-frame apply target (patch-apply must leave
        # headroom under the 16 ms frame for the cursor overlay draw), NOT the
        # per-frame overlay budget. numpy + pycrdt + logic only, no pytest marker,
        # no Qt (currently ~6.9 ms).
        run: python scripts/perf_profile.py --realtime --rt-tiles 47 --frames 30

      - name: Full-frame flatten perf gate (Slice-A, realistic-content ceiling)
        if: runner.os == 'Linux'
        # Phase-12 Slice A (AGT-10 RE-PROFILE, REQ-P12-LOGIC-001/-002/-003).
        # Standalone, Qt-free P11 gate: times the OPTIMISED cold full-frame flatten
        # — blend.composite_stack(region=None) over an 8K, 8-layer realistic stack
        # (sparse, predominantly NORMAL — the tiled + threaded fast-path the Slice-A
        # work targets) — and exits non-zero if the median exceeds the loose
        # catastrophic-regression ceiling COMPOSITE_FULL_CEILING_MS (15000 ms,
        # logic/constants.py). The ceiling is the single source of truth: the
        # scenario resolves it as the --full-frame default, so it is NOT hard-coded
        # here. This is the cold flatten regression class, NOT the 16 ms frame
        # budget. numpy + logic only, no pytest marker, no Qt.
        run: python scripts/perf_profile.py --full-frame --content realistic --layers 8 --frames 3

      - name: Viewport-recomposite commit perf gate (Slice-B, opacity-drag)
        if: runner.os == 'Linux'
        # Phase-12 Slice B (AGT-10 RE-PROFILE, REQ-P12-LOGIC-004/-005 + UI-001).
        # Standalone, Qt-free P11 gate: times the opacity-drag split-cache COMMIT
        # path — blend.composite_range suffix re-blend over the worst-case culled
        # viewport (1920x1920 px, 12-layer stack) — and exits non-zero if the
        # median exceeds VIEWPORT_RECOMPOSITE_CEILING_MS (3000 ms,
        # logic/constants.py). The scenario resolves that ceiling as its default
        # single source of truth (S12), so it is NOT hard-coded here; the gate is
        # also byte-exact-guarded (exit 2 if the committed suffix re-blend diverges
        # from a full recomposite). This is the interactive opacity-drag COMMIT
        # regression class, distinct from the Slice-A cold full-frame flatten and
        # from the record-only naive --composite witness. numpy + logic only, no
        # pytest marker, no Qt.
        run: python scripts/perf_profile.py --viewport-recomposite --vp-region-size 1920 --vp-layers 12

  # ===========================================================================
  # Phase-13 Slice 13C (REQ-P13-BACKEND-001/-002/-003, T13C-06): dedicated
  # integration job for the deploy/ VPS self-hosting artifacts.
  #
  # SEPARATE from the cross-OS quality-gate matrix above (which deselects
  # `integration` and stays green without Docker/nginx). Proves — over
  # localhost/loopback, with NO live external server and the sync_backend/
  # source byte-unmodified — that the shipped deploy/ artifacts run the relay:
  # the launcher-subprocess & Docker-container multi-client convergence
  # (BACKEND-001) and the Nginx TLS/WSS config + idle-survival tuning
  # (BACKEND-002).
  # ===========================================================================
  # ACTIVE, SELF-HOSTED WINDOWS LEG (WP-6.2, D-16/D-17, re-enabled
  # 2026-08-16 — see the TEMPORARY revert block at the top of this file,
  # revert step 2): this job now targets the SAME self-hosted label set as
  # the quality-gate windows-selfhosted leg, [self-hosted, Windows, X64] —
  # ZERO GitHub-hosted minutes, the same hard constraint. It was originally
  # authored for a hosted `ubuntu-latest` runner (Docker + nginx preinstalled
  # there); on this Windows leg the Docker-container test and the opt-in
  # real-Nginx 60s+ idle test both self-skip with a stated reason (no
  # `docker` / no `nginx`+`openssl` on this runner's PATH) rather than fail —
  # the SAME reasoned-skip contract those tests already carry for any
  # environment lacking the binary, not a new exception carved out here. All
  # 9 `integration`-marked tests under tests/deploy/ remain collected and
  # runnable; only the two opt-in/Docker cases skip. The Ubuntu-only
  # "Install Nginx + OpenSSL + Qt runtime OS libraries (apt)" step the hosted
  # form used is REMOVED for this leg: apt does not exist on Windows, and
  # Windows needs no extra system libs for offscreen Qt (same reasoning as
  # the quality-gate job's own Ubuntu-only Qt-libs step) — nginx/openssl
  # absence is exactly what makes the opt-in idle test self-skip, which is
  # the intended, documented behaviour here, not a gap.
  integration:
    name: integration (windows-selfhosted)
    # PUBLIC-REPO HAZARD — READ BEFORE MAKING THIS REPOSITORY PUBLIC: the same
    # hazard as the quality-gate windows-selfhosted leg above (GitHub's own
    # guidance: self-hosted runners "should almost never be used for public
    # repositories... because any user can open pull requests against the
    # repository and compromise the environment"). THIS JOB MUST BE REVERTED
    # to a hosted `ubuntu-latest` runner (see revert step 2 at the top of
    # this file) BEFORE this repository's visibility changes to public. Do
    # not carry this configuration into a public repo.
    runs-on: [self-hosted, Windows, X64]
    # Cold-setup headroom: this job re-installs the project on the same bare
    # runner as the quality-gate windows-selfhosted leg, so it pays the same
    # cold actions/setup-python / pip-install cost the first time it runs
    # here (see that leg's matrix comment for the full measured rationale).
    # 30 min (the original hosted-Ubuntu cap) is under-provisioned for that
    # cold path; 45 min matches the same measured/derived cap used there.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (pinned)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (runtime + dev) from manifest
        # -c constraints.txt: reproducibility lock (R-11) — pins the full
        # resolved dependency closure (direct + transitive) so this install
        # matches every other CI run and any developer's local environment.
        # Regenerate command + rationale: constraints.txt's own header.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Integration tests (deploy/ launcher, Docker, Nginx WSS — localhost)
        # Runs the `integration`-marked deployment acceptance, which ADR-0043 moved
        # out of tests/backend/ into its OWN root tests/deploy/ (AGT-09 owns
        # deployment; the sync-backend service agent owns tests/backend/).
        # BOTH roots are named on purpose. tests/deploy/ holds all 9 integration
        # tests today; tests/backend/ holds none. Naming only tests/deploy/ would
        # silently stop running any integration test a future backend change adds
        # under tests/backend/ — the exact "moved file CI no longer names" failure
        # this ADR was written to avoid. Naming both is also what keeps this step
        # off pytest's exit-code 5 (NO_TESTS_COLLECTED): after the move,
        # `pytest -m integration tests/backend/` collects 0 and exits 5, failing
        # the job. Verified locally: 9 collected across the two roots. The fast
        # tests (launcher-subprocess convergence, Nginx config assertions, short
        # idle-survival) RUN and must pass on this leg. The Docker-container test
        # self-skips (no `docker` on this runner's PATH). The SLOW real-nginx 60s+
        # idle test stays OPT-IN and self-skips (PIXELART_NGINX_IDLE_TEST is unset
        # here; nginx/openssl are not installed on this leg) — it is NOT forced on
        # every push. No Qt-libs install needed on Windows: the PySide6 wheel
        # bundles its own Qt binaries (mirrors the quality-gate windows-selfhosted
        # leg, which needs none either).
        run: pytest -m integration tests/deploy/ tests/backend/

  # ===========================================================================
  # R-11 residual (#31, 2026-07-31): constraints.txt closure gap on Linux/macOS.
  # constraints.txt was generated on Windows (its own header explains the
  # implication in full) — a package resolved ONLY on Linux or macOS by a
  # `sys_platform` marker this project's graph does not currently exhibit would
  # be silently absent from that file. This job closes the gap by resolving on
  # the REAL Linux target and publishing the result for a human to diff and
  # decide whether to commit — it deliberately does NOT commit on its own:
  # auto-committing regenerated dependency pins without a human reviewing the
  # diff is a decision for this file's owner (AGT-09), not something CI should
  # do unattended. Manual trigger only (workflow_dispatch) — this is a review
  # tool run on demand when a manifest dependency changes or the lock needs a
  # refresh, not a gate on every push.
  # ===========================================================================
  # NOTE (2026-08-02, cost-avoidance change): left FUNCTIONAL, NOT disabled —
  # this still targets a hosted ubuntu-latest runner and WILL consume metered
  # hosted minutes if manually dispatched with target=regenerate-constraints.
  # It is workflow_dispatch-only, so it only bills on a deliberate manual act,
  # not on every push. Not touched because tagging/manual-dispatch is a
  # deliberate act, unlike the always-on quality-gate matrix above.
  regenerate-constraints:
    name: regenerate-constraints (ubuntu-latest, manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'regenerate-constraints' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (pinned, matches ci.yml + constraints.txt)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Deliberately a CLEAN venv, not the runner's system/cached pip
      # environment, so the freeze reflects only this project's own resolved
      # closure — mirrors the POSIX command constraints.txt's own header
      # documents as the regeneration procedure.
      - name: Resolve the full dependency closure on Linux (clean venv)
        run: |
          python -m venv venv-lock
          venv-lock/bin/python -m pip install --upgrade pip
          venv-lock/bin/python -m pip install -e ".[dev]"
          venv-lock/bin/python -m pip freeze | grep -v '^-e ' > constraints.linux.txt

      - name: Diff against the committed (Windows-generated) constraints.txt
        # Informational only (never fails the job): surfaces exactly what a
        # Linux resolution adds/changes/removes relative to the committed
        # file, so the human reviewer sees the real delta at a glance instead
        # of having to diff the two artifacts by hand.
        run: |
          echo "--- diff constraints.txt (committed, Windows) vs constraints.linux.txt (this run, Linux) ---"
          diff -u constraints.txt constraints.linux.txt || true

      # Uploaded as an artifact, NOT committed or pushed — the human reviewer
      # downloads it, reviews the diff above, and decides whether/how to merge
      # it into the committed constraints.txt (C1: no unattended commit).
      - name: Upload the Linux-resolved constraints file for review
        uses: actions/upload-artifact@v4
        with:
          name: constraints-linux
          path: constraints.linux.txt
          if-no-files-found: error

  # ===========================================================================
  # Phase-13 Slice 13D (REQ-P13-BUILD-002/-003/-004/-005, ADR-0038): native
  # installer BUILD matrix. SEPARATE from the always-on quality-gate TEST matrix
  # so PR CI is not slowed by full packaging on every push. Runs ONLY on a
  # build/tag trigger (ADR-0038 §3): `workflow_dispatch` (manual) or a `v*` tag
  # push — the job-level `if` blocks it on ordinary branch/PR pushes.
  #
  # One matrix over ubuntu/windows/macos builds all three native distributables
  # on their respective OS legs and publishes each as a downloadable artifact
  # (actions/upload-artifact). fail-fast is OFF so a per-leg build failure fails
  # THAT leg VISIBLY without cancelling the others (BUILD-005). Python 3.12 is
  # pinned.
  #
  # OWN, PER-OS concurrency group (BUILD-005, ADR-0038): the build matrix uses a
  # DISTINCT group (build-installers-<ref>-<os>) instead of inheriting the
  # top-level ci-<ref> quality-gate guard. A routine quality-gate push to the ref
  # therefore can no longer cancel an in-flight native-installer build (the
  # Windows+Linux legs of run 28888610411 were cancelled mid-Nuitka-compile by
  # exactly that shared-guard collision). The group MUST include ${{ matrix.os }}:
  # a job-level group that did not vary per leg would place all three matrix legs
  # in ONE group and cancel-in-progress would make them cancel EACH OTHER (run
  # 28891596191: the macos+ubuntu legs were cancelled at t=0 by the windows leg
  # entering the same group). Per-OS groups keep cancel-in-progress:true useful —
  # a NEW build dispatch's per-OS leg still supersedes a stale same-OS leg for the
  # ref — while letting all three legs of one dispatch run concurrently.
  #
  # Deterministic smoke: PIXELART_SMOKE_EXIT_MS makes the packaged app boot the
  # full UI + bundled Qt plugins headless (QT_QPA_PLATFORM=offscreen, global env)
  # then auto-quit with exit 0 — proving the frozen binary launches on a clean
  # runner without a display (the shipped pixelart_creator/ui/app.py:main honours
  # the env var). PIXELART_SMOKE_EXIT_MS is set at job env level below and is thus
  # inherited by every smoke step; each smoke step asserts a zero exit explicitly.
  # ===========================================================================
  # NOTE (2026-08-02, cost-avoidance change): left FUNCTIONAL, NOT disabled —
  # this matrix still targets three HOSTED runners (ubuntu/windows/macos-latest)
  # and WILL consume metered hosted minutes (macOS at ~10x, Windows at ~1.67x
  # the Linux minute) if a `v*` tag is pushed or workflow_dispatch selects
  # target=build-installers. Not touched because tagging/manual-dispatch is a
  # deliberate act, unlike the always-on quality-gate matrix above.
  build-installers:
    name: build-installers (${{ matrix.os }})
    # BUILD/TAG trigger only — never on a normal branch/PR push (ADR-0038 §3).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'build-installers') || startsWith(github.ref, 'refs/tags/v') }}
    # Isolated PER-OS concurrency group (see job header): distinct from the
    # top-level ci-<ref> quality-gate guard so a routine push to the ref cannot
    # cancel an in-flight installer build, and varied by ${{ matrix.os }} so the
    # three matrix legs do NOT share a group and cancel each other.
    # cancel-in-progress:true supersedes only a stale same-OS leg for the ref.
    concurrency:
      group: build-installers-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast OFF: a per-leg packaging failure must fail THAT leg visibly
      # without cancelling the other two legs (BUILD-005).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Nuitka compile times can be long per leg (ADR-0038 negative/risk); ample
    # cap, still far under the 6h default.
    timeout-minutes: 90
    env:
      # Credential-gated macOS signing (ADR-0038 §4, Article XI). ABSENT by
      # default → the signing step self-skips and the leg ships the unsigned/
      # ad-hoc artifact; its absence does NOT fail the build. NEVER commit a
      # credential — these read GitHub secrets at CI time only.
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      # Deterministic headless smoke-launch window (ms) — see job header.
      PIXELART_SMOKE_EXIT_MS: "5000"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 (pinned)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Ubuntu: the same Qt runtime libs the test matrix installs (needed for
      # Nuitka to bundle Qt + for the offscreen smoke-launch) plus patchelf
      # (Nuitka standalone RPATH fixups + AppImage packaging).
      - name: Install Qt runtime OS libraries + patchelf (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            patchelf

      - name: Install project + packaging toolchain (pyside6-deploy / Nuitka)
        # -c constraints.txt on the project install only (R-11): pins the
        # same runtime-dependency versions as the quality-gate/integration
        # jobs so a packaged installer is built from the SAME resolved
        # numpy/Pillow/PySide6/pycrdt/websockets versions the test matrix
        # verified. Nuitka itself is a build-toolchain dep, not part of the
        # project's dependency closure, so it is left unconstrained.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e .
          python -m pip install nuitka
        # pyside6-deploy ships inside the PySide6 wheel (a project runtime dep);
        # pre-installing Nuitka keeps the build non-interactive & reproducible.

      # ---------------- Windows leg (T13D-02, BUILD-002): onefile .exe --------
      - name: Build Windows .exe (pyside6-deploy / Nuitka onefile)
        if: runner.os == 'Windows'
        run: |
          pyside6-deploy -c packaging/pysidedeploy-windows.spec --force --keep-deployment-files
          mkdir -p artifact
          cp dist/PixelArtCreator.exe "artifact/PixelArtCreator-windows.exe"

      - name: Smoke-launch the Windows .exe (offscreen, auto-quit)
        if: runner.os == 'Windows'
        run: |
          BIN="./artifact/PixelArtCreator-windows.exe"
          echo "smoke binary: ${BIN}"
          if "${BIN}"; then
            echo "smoke OK: launched offscreen and self-exited 0 (PIXELART_SMOKE_EXIT_MS)"
          else
            rc=$?
            echo "::error::Windows smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
        # Exit 0 proves the packaged onefile .exe started, loaded the offscreen
        # platform plugin + full UI, and quit cleanly via PIXELART_SMOKE_EXIT_MS;
        # any non-zero exit or crash fails this leg visibly.

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-windows
          path: artifact/PixelArtCreator-windows.exe
          if-no-files-found: error

      # ---------------- Linux leg (T13D-03, BUILD-004): AppImage --------------
      - name: Build Linux standalone (pyside6-deploy / Nuitka)
        if: runner.os == 'Linux'
        run: pyside6-deploy -c packaging/pysidedeploy-linux.spec --force --keep-deployment-files

      - name: Smoke-launch the Linux standalone binary (offscreen, auto-quit)
        if: runner.os == 'Linux'
        run: |
          # Nuitka standalone names the dist folder + binary after the input-file
          # stem (pixelart_creator/__main__.py → `__main__`); see the linux spec.
          BIN="dist/__main__.dist/__main__"
          echo "smoke binary: ${BIN}"
          if "${BIN}"; then
            echo "smoke OK: launched offscreen and self-exited 0 (PIXELART_SMOKE_EXIT_MS)"
          else
            rc=$?
            echo "::error::Linux standalone smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi

      - name: Package Linux AppImage (appimagetool)
        if: runner.os == 'Linux'
        run: bash packaging/build_appimage.sh

      - name: Smoke-launch the AppImage (offscreen, auto-quit)
        if: runner.os == 'Linux'
        run: |
          chmod +x artifact/PixelArtCreator-x86_64.AppImage
          # --appimage-extract-and-run is intercepted by the AppImage runtime
          # (FUSE-free); AppRun then execs usr/bin/__main__, which self-exits via
          # PIXELART_SMOKE_EXIT_MS.
          if ./artifact/PixelArtCreator-x86_64.AppImage --appimage-extract-and-run; then
            echo "smoke OK: AppImage launched offscreen and self-exited 0"
          else
            rc=$?
            echo "::error::Linux AppImage smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-linux
          path: artifact/PixelArtCreator-x86_64.AppImage
          if-no-files-found: error

      # ---------------- macOS leg (T13D-04, BUILD-003): .app in .dmg ----------
      - name: Build macOS .app (pyside6-deploy / Nuitka standalone bundle)
        if: runner.os == 'macOS'
        run: pyside6-deploy -c packaging/pysidedeploy-macos.spec --force --keep-deployment-files

      - name: Ad-hoc sign + smoke-launch + wrap .dmg (unsigned baseline)
        if: runner.os == 'macOS'
        run: |
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n1)"
          echo "app bundle: ${APP}"
          # Ad-hoc sign so a local run of the unsigned build is permitted.
          codesign --force --deep --sign - "${APP}"
          # Smoke: launch the inner binary offscreen (auto-quits via env). The
          # standalone .app's inner Mach-O is located inside the bundle, so the
          # produced-artifact path is discovered via `find`, not a fixed stem.
          BIN="$(find "${APP}/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n1)"
          echo "smoke binary: ${BIN}"
          if "${BIN}"; then
            echo "smoke OK: .app inner binary launched offscreen and self-exited 0"
          else
            rc=$?
            echo "::error::macOS .app smoke-launch FAILED (exit ${rc})"
            exit "${rc}"
          fi
          mkdir -p artifact
          hdiutil create -volname "PixelArt Creator" -srcfolder "${APP}" \
            -ov -format UDZO artifact/PixelArtCreator-macos.dmg

      - name: Developer-ID sign + notarize + staple (credential-gated, NON-blocking)
        # Runs ONLY when an Apple Developer ID secret is supplied (ADR-0038 §4,
        # Article XI). Its ABSENCE self-skips this step and does NOT fail the leg
        # — the unsigned/ad-hoc .dmg above is the accepted Phase-13 artifact.
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID != '' }}
        run: |
          APP="$(find dist -maxdepth 2 -type d -name '*.app' | head -n1)"
          codesign --force --deep --options=runtime --timestamp \
            --sign "${APPLE_DEVELOPER_ID}" "${APP}"
          hdiutil create -volname "PixelArt Creator" -srcfolder "${APP}" \
            -ov -format UDZO artifact/PixelArtCreator-macos.dmg
          xcrun notarytool submit artifact/PixelArtCreator-macos.dmg \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --team-id "${APPLE_NOTARY_TEAM_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" --wait
          xcrun stapler staple artifact/PixelArtCreator-macos.dmg

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: pixelart-creator-macos
          path: artifact/PixelArtCreator-macos.dmg
          if-no-files-found: error
