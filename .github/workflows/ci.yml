# =============================================================================
# CI pipeline (GitHub Actions) — PixelArt Creator
# Owner: AGT-09 GitHub/DevOps. Grounded by F11 (headless PySide6 CI) + F14
# (pyproject manifest). Mandatory software-dev extension (spec-driven-development
# .md §5) — may not be scoped out.
#
# Runs on push + pull_request: installs the project from pyproject.toml into a
# clean runner, then runs the full quality gate HEADLESS (QT_QPA_PLATFORM=
# offscreen) with the OS libraries PySide6 needs. Python version is a SINGLE
# PARAMETRIC SOURCE, not a literal pinned here: every actions/setup-python
# site below reads it from the repository's own .python-version file via
# the `python-version-file:` input, so bumping the interpreter is a one-file
# change (CI-STANDARDIZATION, 2026-08-24) instead of four hand-edited sites.
# A single-run concurrency guard cancels superseded runs for the same ref.
#
# REPRODUCIBILITY (R-11, constraints.txt): every `pip install -e ...` step
# below also passes `-c constraints.txt` — a committed, regenerable pip
# constraints file pinning the FULL resolved dependency closure (direct +
# transitive, 53 packages) so every CI run and every developer installs the
# SAME versions instead of re-resolving pyproject.toml's floors against
# whatever is newest on PyPI that day. pyproject.toml's public `dependencies`
# floors are UNCHANGED by this — see constraints.txt's own header for the
# mechanism, the exact regeneration command, and why one file safely serves
# all three OS legs of the matrix below.
#
# Phase-13 Slice 13A (REQ-P13-BUILD-001, T13A-12): the quality-gate job is a
# 3-OS matrix — ubuntu-latest + windows-latest + macos-latest — each leg running
# the FULL test suite headless (QT_QPA_PLATFORM=offscreen; the SAME pytest
# invocation on every OS via `shell: bash`) so the platform is provably portable
# (plan §3.1). The static/lint/type/coverage gates and the calibrated perf gates
# stay Ubuntu-only (`if: runner.os == 'Linux'`) — the perf ceilings are tuned to
# the Ubuntu runner and the source-lint results are OS-invariant. fail-fast is
# OFF so a genuine Windows/macOS regression does not cancel the other legs (each
# leg's result is captured). The Ubuntu Qt apt install is Linux-guarded; Windows
# and macOS need no extra system libs for offscreen Qt. Concurrency guard
# preserved; the Python version is no longer a literal pin here — see the
# single-parametric-source note above (.python-version via
# python-version-file:).
# =============================================================================
name: ci

on:
  push:
    # Branch-naming convention, user decision 2026-08-02: dev branches are
    # named `feat-<something>` / `fix-<something>` — HYPHEN, not slash. The
    # container directory is its own git repository versioning the
    # orchestration system separately, and branch worktrees are created as
    # sibling folders of `main/`; a branch named `feat/foo` would produce a
    # NESTED `feat/foo` directory that a top-level ignore pattern cannot
    # exclude cleanly, whereas `feat-foo` is one flat folder. This filter is
    # PERMANENT (see the "LEFT UNCHANGED" note in the temporary-scoping block
    # above) — it is not undone when the repository goes public.
    #
    # Deliberately `feat-*` / `fix-*`, NOT `feat-**` / `fix-**`: in GitHub's
    # branch-filter glob syntax, `*` does not match `/`, while `**` does. Using
    # the single star means this CI filter itself refuses to match a nested
    # name like `feat-foo/bar` — a second, independent enforcement of the
    # flatness rule on top of the container's own naming gate. Do NOT
    # "generalise" this to `**` in a future edit; that would silently remove
    # this guarantee.
    #
    # No migration needed: verified this session, the repository has exactly
    # one local branch (`main`) and exactly one remote branch (`origin/main`)
    # — no `feat/` branch exists anywhere, so this change strands nothing.
    branches: [main, "feat-*", "fix-*"]
    # Phase-13 Slice 13D (ADR-0038 §3): a v* tag is the release BUILD trigger for
    # the native-installer matrix below. Branch/PR pushes do NOT build installers
    # (the build-installers job self-guards) so PR CI is not slowed.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Manual trigger, shared by two independent on-demand jobs below (each reads
  # this input and self-guards; the input decides WHICH runs, so an ordinary
  # manual dispatch does not pay for both):
  #   - build-installers (ADR-0038 §3): the native-installer matrix.
  #   - regenerate-constraints (#31, R-11 residual): the Linux constraints
  #     regeneration review job.
  workflow_dispatch:
    inputs:
      target:
        description: "Which on-demand job to run"
        required: true
        default: "build-installers"
        type: choice
        options: ["build-installers", "regenerate-constraints"]

# Single-run concurrency guard: a new run for the same ref cancels the older one
# so two runs never contend for a shared runner (flaky-timeout avoidance, F11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen        # headless Qt (F11)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-gate:
    # Display name deliberately interpolates matrix.os, NOT matrix.runs_on: the
    # self-hosted leg's os label is windows-selfhosted (see the matrix below),
    # so this still resolves to three distinct, readable leg names in the UI —
    # "quality-gate (ubuntu-latest)", "quality-gate (windows-selfhosted)",
    # "quality-gate (macos-latest)" — instead of collapsing the renamed leg
    # back to a bare "windows-latest" a reader could mistake for the hosted
    # runner it replaces.
    name: quality-gate (${{ matrix.os }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      # fail-fast OFF: a genuine platform-specific regression on one leg must NOT
      # cancel the other legs — we need every OS's result (13A discovery signal,
      # BUILD-001). Windows/macOS surface the suite for the FIRST time here.
      fail-fast: false
      matrix:
        # SELF-HOSTED WINDOWS LEG (user decision, 2026-08-02): GitHub Actions
        # resumed billing against the Free-plan 2,000 included minutes/month on
        # 2026-08-02 (monthly reset) after this same matrix exhausted them
        # before; macOS bills at ~10x and Windows at ~1.67x the Linux minute,
        # so the window will exhaust again on an unchanged matrix. Self-hosted
        # runner minutes are FREE and unmetered per GitHub's own billing
        # reference, and exactly ONE self-hosted runner exists right now:
        # `pixelart-local-probe` (labels: self-hosted, Windows, X64,
        # selfhosted-probe) — a Windows x64 machine. There is no Linux and no
        # macOS self-hosted runner, and none can be created on this host (no
        # Docker/Podman, no WSL, Windows 11 Home has no Hyper-V so no Windows
        # containers either, and macOS cannot be virtualised on non-Apple
        # hardware at all) — so ONLY the Windows leg moves. ubuntu-latest and
        # macos-latest stay hosted, unchanged, on purpose: this is
        # additive/substitutive ONLY where possible, not a wholesale switch
        # (user directive, verbatim: "state self-hosted runner for GitHub
        # Actions for the legs that are possible, and the rest leave them as
        # they are now").
        #
        # `include:` (rather than a flat `os:` list) is used because the
        # self-hosted leg's runs-on target must be a LABEL ARRAY
        # ([self-hosted, Windows, X64]), not a hosted-runner string, so `os`
        # (the identity/display label — unchanged in meaning for the ubuntu and
        # macos legs) and `runs_on` (the literal runs-on target) are split into
        # two matrix keys. `os: windows-selfhosted` (not `windows-latest`) is
        # deliberate — see the job `name:` comment above.
        #
        # `timeout` is a PER-LEG matrix key (see `timeout-minutes:` below):
        # applying the shared 75-minute job cap to a runner that may not be
        # online turns a dead/offline self-hosted runner into a worst-case
        # 75-minute hang once a runner does pick the job up (a job that is
        # never picked up at all queues under GitHub's own ~24h queued-job
        # ceiling, which nothing in this file can shorten). The self-hosted leg
        # gets a much shorter cap instead — 45 minutes, MEASURED, not a guess:
        # run 30749285915 (the last all-hosted run before this change) timed
        # the hosted `windows-latest` leg at 15 min wall-clock, WARM (Python
        # already in the hosted tool cache, pip mostly cache-hit, git
        # pre-provisioned). 45 min is 3x that 15-min measured figure —
        # headroom sized for what a warm run does NOT pay for but a genuinely
        # COLD first run on this bare runner does: (a) actions/setup-python
        # downloading and installing the pinned Python version (read from
        # .python-version via python-version-file: — no version literal here
        # to go stale on the next bump) from the actions/python-versions
        # release instead of hitting a pre-populated tool cache, (b)
        # `pip install -c constraints.txt -e ".[dev]"`
        # resolving/downloading the full runtime+dev closure with no local
        # wheel cache, and (c) the first-ever `actions/checkout` on this
        # machine. 25 min (the earlier, unmeasured value) gave only 10 min of
        # headroom over the same 15-min figure — too tight to survive a cold
        # run's extra cost without the cold run itself looking like a timeout
        # defect. If genuine warm runs start approaching or exceeding 45 min,
        # raise this value against a NEW measurement, same as this one — do
        # not reflexively raise it back to 75.
        include:
          # DISABLED (see the TEMPORARY revert block at the top of this file):
          # hosted Ubuntu leg commented out verbatim, ZERO hosted minutes
          # while this is in effect. Uncomment to restore.
          # - os: ubuntu-latest
          #   runs_on: ubuntu-latest
          #   timeout: 75
          - os: windows-selfhosted
            # PUBLIC-REPO HAZARD — READ BEFORE MAKING THIS REPOSITORY PUBLIC:
            # GitHub's own documentation says self-hosted runners "should
            # almost never be used for public repositories... because any user
            # can open pull requests against the repository and compromise the
            # environment." THIS LEG MUST BE REVERTED to a hosted
            # `windows-latest` runner (collapse `os`/`runs_on` back into a flat
            # `os: [ubuntu-latest, windows-latest, macos-latest]` list, restore
            # `runs-on: ${{ matrix.os }}` and the original `name:` /
            # `timeout-minutes: 75`) BEFORE this repository's visibility
            # changes to public. Do not carry this configuration into a public
            # repo.
            runs_on: [self-hosted, Windows, X64]
            timeout: 45
          # DISABLED (see the TEMPORARY revert block at the top of this file):
          # hosted macOS leg commented out verbatim, ZERO hosted minutes
          # while this is in effect. Uncomment to restore.
          # - os: macos-latest
          #   runs_on: macos-latest
          #   timeout: 75
    # Job-level wall-clock cap: a hung/deadlocked test can no longer pin a runner
    # for ~6h. The full offscreen-Qt UI suite measures ~46-48 min on the 2-core
    # Ubuntu runner (see run 28635312681, cancelled at 98% by an earlier 45-min
    # cap), so the two hosted legs (75 min, via matrix.timeout above) are set
    # comfortably above that with headroom for runner variance. The self-hosted
    # Windows leg uses a distinct, shorter 45-minute cap instead — MEASURED
    # against run 30749285915's 15-min warm hosted `windows-latest` figure (3x
    # headroom for a cold first run's extra setup-python/pip/checkout cost);
    # see the matrix comment above for the full rationale and tradeoff. The
    # per-test --timeout below (120s, thread) is the fine-grained guard that
    # fails fast and names a genuinely hung test; this job cap is only the
    # coarse backstop (FU-12).
    timeout-minutes: ${{ matrix.timeout }}
    # Run every step under bash on ALL three legs so the SAME pytest invocation
    # (with `\` line continuations) executes identically — the Windows default
    # shell (pwsh) would otherwise break the multi-line command (portability).
    # This still applies to the self-hosted Windows leg: `shell: bash` needs a
    # bash executable on PATH, which Git for Windows (commonly present on a dev
    # machine such as this one) provides.
    #
    # UPDATE (2026-08-18, no longer "UNVERIFIED"): this WAS exercised, and it
    # failed six consecutive runs with `##[error]bash: command not found` —
    # Git for Windows was present, but only on the interactive user's PATH,
    # invisible to the Actions Runner's own SYSTEM-service PATH.
    #
    # UPDATE 2 (2026-08-18, run 32128981766): an in-workflow `GITHUB_ENV`
    # PATH-repair step was tried NEXT and RAN CORRECTLY, reporting Git for
    # Windows found and PATH appended — and the very next `shell: bash` step
    # still failed with the IDENTICAL bare error. Runner diagnostic logs
    # (`_diag/Worker_*.log`) show why, conclusively: the failure is thrown
    # inside `Handler.PrepareExecution` -> `ScriptHandler.PrintActionDetails`
    # -> `WhichUtil.Which('bash', ...)`, which resolves the interpreter
    # against the Actions Runner WORKER PROCESS's own inherited PATH — fixed
    # at that process's launch from the `actions.runner...` Windows service
    # (confirmed running as `NT AUTHORITY\SYSTEM` on this host), and this
    # resolution happens BEFORE the step's script exists and BEFORE
    # `GITHUB_ENV` is applied to any child process. `ProcessInvokerWrapper`
    # (which WOULD honour the `GITHUB_ENV`-updated environment dictionary)
    # is never reached for the failing step. No step in ANY job of this
    # workflow can repair a `shell: bash` step's own interpreter lookup —
    # the failure precedes the workflow. MACHINE REQUIREMENT for whichever
    # host carries the `[self-hosted, Windows, X64]` labels (a rebuilt
    # runner needs this too): Git for Windows must be installed at
    # `C:\Program Files\Git` (or the x86 equivalent) AND that install's
    # `bin`/`usr\bin` must be on the MACHINE (System) PATH, with the runner
    # service restarted afterward to pick it up — see the AGT-09 report's
    # 2026-08-18 follow-up for the exact elevated command and its
    # verification. The "Diagnose Git-for-Windows bash resolvability" step
    # below (renamed from "Ensure ... (self-hosted-safe PATH fix)" to stop
    # overclaiming what it does) no longer pretends to repair this: it
    # reports whether bash is already resolvable and, if not, FAILS FAST
    # with a named cause instead of letting the job reach the same bare
    # "command not found" one step later.
    defaults:
      run:
        shell: bash
    # SELF-HOSTED WINDOWS LEG — per-`uses:` compatibility assessment (this leg
    # only; the ubuntu-latest and macos-latest legs are unchanged hosted
    # runners and none of this applies to them):
    #   actions/checkout@v5      - needs a `git` executable on PATH. VERIFIED
    #                              working: every one of the six runs that
    #                              failed on the bash-PATH defect above
    #                              (2026-08-17/18) reached and passed this
    #                              step first, failing only at the first
    #                              `shell: bash` run step that followed it —
    #                              `git.exe` (Git\cmd) is on this runner's
    #                              MACHINE PATH even though bash.exe (Git\bin)
    #                              was not, which is exactly what the fix step
    #                              above now repairs.
    #   actions/setup-python@v6  - hosted runners ship a pre-populated tool
    #     (cache: pip)             cache for common versions; this bare runner
    #                              does not, so the action will most likely
    #                              DOWNLOAD and install the pinned Python
    #                              version (from .python-version via
    #                              python-version-file:) from the
    #                              actions/python-versions release the first
    #                              time it runs here (slower, needs network
    #                              egress) rather than hitting a local cache.
    #                              `cache: pip` itself keys off GitHub's remote
    #                              Actions cache service (not local disk), so it
    #                              should behave the same as on a hosted runner
    #                              PROVIDED this runner has outbound network
    #                              access to that service — UNVERIFIED here.
    #                              Because the runner process is currently a
    #                              foreground temp-dir process, not an
    #                              installed service (see the risk comment on
    #                              the matrix above), even a locally-populated
    #                              tool cache would not reliably survive
    #                              between sessions.
    #   actions/setup-node@v4    - Linux-gated (`if: runner.os == 'Linux'`), so
    #                              it never runs on this leg — not a
    #                              self-hosted concern here.
    # CONCURRENCY: exactly one self-hosted runner is registered against this
    # repository, so this leg now SERIALISES against any other job/run that
    # also targets [self-hosted, Windows, X64] — two pushes in flight, or a
    # future job added to the same label set, will queue behind one another
    # instead of running in parallel the way two hosted-runner jobs would.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # INCIDENT (2026-08-17/18) for the repeated `##[error]bash: command
      # not found` failures on the self-hosted Windows leg (runner
      # `pixelart-local-probe`, labels [self-hosted, Windows, X64]): six
      # consecutive CI runs failed here because this job's
      # `defaults.run.shell: bash` (see the comment on that key above) needs
      # bash.exe, which Git for Windows ships at
      # `<GitInstallRoot>\bin\bash.exe`. That directory sits on the
      # INTERACTIVE USER's PATH only; the Actions Runner on this machine runs
      # as a SERVICE under NT AUTHORITY\SYSTEM, which sees only the MACHINE
      # PATH -- so every `shell: bash` step failed with "command not found".
      #
      # ATTEMPT 1 -- machine-local file (rejected, unversioned): a prior
      # remediation wrote the machine PATH (plus Git's two bin dirs, appended
      # at the end) to `D:\ci-runner\.path` on the runner host. That file is
      # UNVERSIONED, machine-local configuration: invisible to anyone reading
      # this repository, silently lost if the runner is ever
      # re-registered/moved/rebuilt, and -- empirically confirmed by
      # re-running CI before touching the service and reproducing the
      # identical failure -- read by the Runner Listener ONLY at the
      # Listener's OWN process startup, not per job.
      #
      # ATTEMPT 2 -- in-workflow `GITHUB_ENV` PATH repair (2026-08-18, run
      # 32128981766: RAN CORRECTLY AND DID NOT WORK). This step used to
      # append Git's `bin`/`usr\bin` to `PATH` via `GITHUB_ENV` whenever it
      # found Git for Windows, on the theory that this would repair PATH "for
      # the rest of this job". It ran, reported success -- and the VERY NEXT
      # step (`shell: bash` by job default) still failed with the IDENTICAL
      # bare "command not found". The runner's own diagnostic logs
      # (`_diag/Worker_*.log`) show why, conclusively: resolving the
      # executable for a step's `shell:` directive happens via
      # `WhichUtil.Which`, called from `Handler.PrepareExecution` ->
      # `ScriptHandler.PrintActionDetails`, BEFORE the step's own script
      # exists and BEFORE `GITHUB_ENV` is applied to any child process --
      # `ProcessInvokerWrapper` (which WOULD honour the `GITHUB_ENV`-updated
      # environment) is never reached for the failing step. `WhichUtil.Which`
      # reads the Actions Runner WORKER PROCESS's own inherited PATH,
      # fixed at that process's launch from the `actions.runner...` Windows
      # SERVICE (confirmed running as `NT AUTHORITY\SYSTEM` on this host,
      # whose MACHINE PATH is confirmed to carry `Git\cmd` but NOT `Git\bin`
      # or `Git\usr\bin` -- which is exactly why `actions/checkout@v5`
      # (needs only `git.exe`) has always worked while every `shell: bash`
      # step has always failed). A `GITHUB_ENV` PATH edit changes what a
      # LATER step's own script (once ITS interpreter is already running) or
      # something THAT script explicitly spawns can see; it can never change
      # which interpreter the runner looks up in order to START that script
      # in the first place. NO STEP IN ANY JOB OF THIS WORKFLOW CAN REPAIR A
      # `shell: bash` STEP'S OWN INTERPRETER LOOKUP -- the failure precedes
      # the workflow.
      #
      # THE ACTUAL FIX is therefore back on the machine, but done right this
      # time: the runner's MACHINE (System) PATH itself must carry Git's
      # `bin`/`usr\bin`, and the `actions.runner...pixelart-local-probe`
      # service must be restarted so its own process re-inherits that PATH at
      # launch. Unlike Attempt 1, this is exactly the configuration GitHub's
      # own hosted `windows-latest` images ship with, survives runner
      # re-registration (it is OS configuration, not a runner-internal file),
      # and needs no unversioned file -- see the AGT-09 report's 2026-08-18
      # follow-up for the exact elevated command and its verification. This
      # is the user's step (elevation required); it is NOT executed by this
      # workflow or by any CI job.
      #
      # THIS STEP's role, given the above: a PRE-FLIGHT DIAGNOSTIC, not a
      # repair. `shell: powershell` (Windows PowerShell 5.1) overrides the
      # job default for this ONE step so it can run before bash exists at
      # all -- unlike bash, `powershell.exe` ships inside every Windows
      # installation under `System32` and is on the SYSTEM account's MACHINE
      # PATH by construction, so it never hits this same defect. It reports
      # whether bash is ALREADY resolvable (true once the machine-PATH fix
      # above has been applied and the service restarted, and true on every
      # hosted `windows-latest` leg regardless -- so this step is a
      # documented no-op there, safe to leave in place across the eventual
      # revert to a hosted Windows leg; see the TEMPORARY revert block at the
      # top of this file). If bash is NOT resolvable, the step FAILS FAST
      # with a named, actionable `::error::` instead of letting the job limp
      # one more step to the same bare "command not found" -- naming either
      # "Git for Windows is not installed at all" (the well-known-location
      # search comes up empty) or "Git for Windows is installed but its
      # `bin`/`usr\bin` are not on the MACHINE PATH" (found, but a
      # `GITHUB_ENV` PATH extension is written anyway before failing, since
      # that DOES still help any step whose OWN shell is NOT bash and that
      # shells out to bash itself -- a real, narrower benefit the step's
      # message states honestly rather than implying a general repair). Not
      # added to the `build-installers`/`regenerate-constraints` jobs below,
      # whose hosted-only Windows/Linux legs have no incident evidence of
      # this defect (Git for Windows ships fully on-PATH on those images).
      - name: "Diagnose Git-for-Windows bash resolvability (does NOT repair 'shell: bash')"
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Get-Command bash -ErrorAction SilentlyContinue) {
            Write-Host "bash already resolvable on the runner's own PATH -- 'shell: bash' steps in this job will work. Nothing to do."
            exit 0
          }
          $candidates = @(
            "C:\Program Files\Git",
            "C:\Program Files (x86)\Git"
          )
          $gitRoot = $candidates | Where-Object { Test-Path (Join-Path $_ "bin\bash.exe") } | Select-Object -First 1
          if (-not $gitRoot) {
            Write-Host "::error::Git for Windows was not found at any known location ($($candidates -join ', ')), so this job's 'shell: bash' steps have no bash.exe to run. Install Git for Windows on this runner (https://git-scm.com/download/win) -- required, not optional, for this workflow -- then re-run."
            exit 1
          }
          $binDir = Join-Path $gitRoot "bin"
          $usrBinDir = Join-Path $gitRoot "usr\bin"
          $newPath = "$($env:PATH);$binDir;$usrBinDir"
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$newPath"
          Write-Host "Found Git for Windows at $gitRoot. Appended $binDir and $usrBinDir to PATH via GITHUB_ENV for the rest of this job -- but that ONLY helps a step whose own shell is not bash and that shells out to bash itself. It CANNOT make 'shell: bash' steps in this job work: GitHub Actions resolves that interpreter from the runner service's OWN process PATH before any step (including this one) runs, and a job-level PATH edit can never reach that lookup. THE REAL FIX is the runner's MACHINE PATH (System 'Environment Variables', or the elevated setx/registry command in the AGT-09 report) plus a restart of the 'actions.runner...pixelart-local-probe' service so it re-inherits that PATH at its own process start. Failing this job now, with this cause named, instead of letting it repeat the bare 'bash: command not found' one step later."
          exit 1

      - name: Set up CI temp root (CI-PixelArtCreator)
        # CI temp standardization (supersedes DEV-36a's D:\tmp\ci\<workflow>-
        # <job> naming): the root is ONE product-owned segment under the
        # runner's OWN ${RUNNER_TEMP} -- no drive letter and no other path
        # segment is hardcoded into this file (the segment below,
        # "CI-PixelArtCreator/<leg name>", is the only literal contributed
        # here). The leg-scoped name (workflow job + matrix leg, no run id or
        # timestamp) is DETERMINISTIC, so a re-run of the same leg resolves to
        # the identical path; the `rm -rf` before `mkdir -p` makes that an
        # OVERWRITE, not an accumulation, of whatever a previous run left (the
        # ~68 randomly-named dirs + stray `pytest-of-<machine>` tree DEV-36a
        # recorded). Every temp-producing surface in this job is routed under
        # this one root: the pytest steps below via --basetemp, and the
        # process TMP/TEMP/TMPDIR env so a bare `tempfile.mkdtemp()` call
        # inside a test (not just the pytest-managed tmp_path) lands here too
        # -- a --basetemp alone does not catch that. The final cleanup step
        # below deletes this same root again by reading the CI_TEMP_ROOT
        # variable exported here, never a re-typed path.
        run: |
          CI_TEMP_ROOT="${RUNNER_TEMP}/CI-PixelArtCreator/ci-quality-gate-${{ matrix.os }}"
          rm -rf "${CI_TEMP_ROOT}"
          mkdir -p "${CI_TEMP_ROOT}"
          echo "CI_TEMP_ROOT=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TEMP=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "TMPDIR=${CI_TEMP_ROOT}" >> "${GITHUB_ENV}"
          echo "CI temp root for this leg: ${CI_TEMP_ROOT}"

      - name: Set up Python (pinned via .python-version)
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      # OS-level libraries required to import/run PySide6 (Qt6) headless on a
      # clean Ubuntu runner (F11: xkbcommon, EGL/GL, dbus, X libs for offscreen).
      # Ubuntu-only: Windows/macOS GitHub runners need no extra system libs for
      # offscreen Qt (plan §3.1).
      - name: Install Qt runtime OS libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install project (runtime + dev) from manifest
        # -c constraints.txt: reproducibility lock (R-11) — pins the full
        # resolved dependency closure (direct + transitive) so this install
        # matches every other CI run and any developer's local environment.
        # Regenerate command + rationale: constraints.txt's own header.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

