# =============================================================================
# Packaging / dependency manifest — PixelArt Creator
# Owner: AGT-09 GitHub/DevOps (+ coding agents keep deps current). Grounded by
# F14 (build backend + runtime & dev deps + tool config). Mandatory software-dev
# extension (spec-driven-development.md §5): declares BOTH runtime and dev deps so
# CI installs exactly what tests import — no "works on my machine" gaps.
# =============================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelart-creator"
version = "0.2.1"
description = "Unified pixel-art platform: 8K editable grid, colour tools, layers, GPU render pipeline."
readme = "NOTICE"
# PYTHON VERSION — SINGLE PARAMETRIC SOURCE (2026-08-24): the repo-root
# `.python-version` file is the ONE source of truth for the exact interpreter,
# pinned to "3.13.13" (CPython 3.13.13, released 2026-04-07; the 3.13 line is
# bugfix-supported until 2029-10, versus 3.12's security-only track ending
# 2028-10 — confirmed by
# design-docs/research/research-ci-python-3-13-13-pins.md). ci.yml reads this
# SAME file via actions/setup-python's `python-version-file:` input, so CI and
# any local pyenv/pyenv-win/uv/asdf/IDE Python-version picker that reads
# `.python-version` resolve to the IDENTICAL interpreter — the local/CI
# divergence this comment used to document (a "3.12" floor here vs a
# separately hardcoded "3.12" in ci.yml) no longer exists by construction.
# The floor below (">=3.13") is therefore equal to what CI actually tests, not
# a looser public promise. scripts/check_python_version.py is the enforcement
# gate that keeps this file, the floor, the classifier, mypy's `python_version`,
# black's `target-version`, the deployment container base image, and the
# systemd unit's interpreter reference all in agreement going forward.
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Garcia Sanchez" }]
keywords = ["pixel-art", "editor", "pyside6", "qt6", "graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors",
]

# Runtime dependencies (S8 fixed stack).
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "Pillow>=10.0",
    # Phase-10 Slice B: CRDT convergence core. PINNED — ships prebuilt wheels
    # for BOTH cp312 and cp313 across manylinux x86_64, manylinux aarch64, and
    # macOS (universal2, covering x86_64+arm64) — confirmed 2026-07-30 against
    # the PyPI file listing for this exact pinned version (no source build on
    # Linux/py3.12 CI, only anyio at runtime). pycrdt ships NO abi3 wheel — its
    # wheel matrix is per-CPython-version and must be re-checked on any future
    # pin or Python-version change. Ships py.typed, so it is NOT in mypy
    # ignore_missing_imports. Re-verify at the source rather than trusting this
    # note: the research record behind it is kept outside this repository.
    "pycrdt==0.14.1",
    # Phase-10 Slice C: real-time sync wire protocol. CORE runtime dep — the
    # sync_backend service, data/cloud/ws_transport.py, AND the in-CI backend
    # tests (tests/backend/) all import it, so CI must install it unconditionally.
    # PINNED to 16.0 — confirmed 2026-07-30 installing cleanly with its own
    # compiled speedups extension under BOTH cp312 and cp313; ships py.typed,
    # so NOT in mypy ignore_missing_imports.
    "websockets==16.0",
]

[project.optional-dependencies]
# Real live-provider credential access ONLY (out-of-CI, credential-gated —
# CL-B2/CL-B3). NOT a core dep: the mocked provider tests monkeypatch
# token_store, so CI must NOT require a real OS keyring backend. Installed
# manually by users who exercise the real Drive/OneDrive/Dropbox adapters.
cloud_live = [
    "keyring==25.7.0",
]

# Phase-14 Slice 14B (ADR-0040 §5, DEP-4): live-provider credential access for
# the AI assistant ONLY (out-of-CI, credential-gated — REQ-P14-DATA-003/-006).
# NOT a core dep: 14A–14C + the fake adapter monkeypatch token_store and import
# keyring LAZILY, so CI must NOT require a real OS keyring backend. The real LLM
# adapter (14D) is STDLIB-only (urllib — D4, no new hard dep), so keyring is the
# SOLE live dep here (same pin as cloud_live). Kept as an INDEPENDENT, self-
# describing extra (not folded into cloud_live) so the two credential surfaces
# install/deselect separately (ADR-0040 alternatives; spec D5 names it explicitly).
assistant_live = [
    "keyring==25.7.0",
]

# Dev/test dependencies — CI installs `.[dev]` so it runs exactly what tests import.
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pydocstyle>=6.3",
    # REMEDIATION 2026-07-30: `mkdocs build --strict` (main/docs/site/mkdocs.yml,
    # AGT-08's mkdocs-site skill) was runnable locally but NEVER declared as a
    # project dependency, so a clean CI runner installing only `.[dev]` did not
    # have it — the docs-build gate could not have passed in CI even though it
    # passes here. Declared so the new CI step actually has the tool it invokes.
    "mkdocs>=1.6",
    # ES translation of the public docs site (user decision 2026-08-19, scope:
    # README + docs/site only). mkdocs-static-i18n itself declares
    # `Requires-Dist: mkdocs>=1.5.2` (verified from its 1.3.1 wheel METADATA on
    # PyPI), which the pinned mkdocs==1.6.1 in constraints.txt satisfies. Same
    # "runnable locally but never declared" trap as the mkdocs entry above, so
    # declared here up front, before the plugin is configured or any translated
    # page exists.
    "mkdocs-static-i18n>=1.3",
    # User decision (2026-08-19): adopt mkdocs-material now, ahead of an
    # eventual published docs site, rather than hand-roll a language switcher —
    # the theme's built-in i18n language selector is the UI switch this project
    # wants once the i18n content module is configured. DEPENDENCY ONLY here:
    # theme selection/config in mkdocs.yml is a separate, later dispatch. Its
    # own wheel METADATA declares `Requires-Python >=3.8` and
    # `Requires-Dist: mkdocs<2,>=1.6`, satisfied by the pinned mkdocs==1.6.1.
    # Checked against every already-pinned neighbour it also depends on
    # (colorama, Jinja2, Markdown, Pygments) by real resolution against
    # constraints.txt, not by inspection — mkdocs-material==9.7.7 accepted all
    # four exact pins with no conflict.
    "mkdocs-material>=9.7",
]

# Console entry points (installed on `pip install`). T7C-07 (REQ-P7-DATA-004);
# pixelart-run added by T8D-04 (Phase-8 automation CLI).
[project.scripts]
pixelart-export = "pixelart_creator.data.export_cli:main"
pixelart-run = "pixelart_creator.data.automation_cli:main"
pixelart-assistant = "pixelart_creator.data.assistant_cli:main"

# GUI entry point (installed on `pip install`). gui-scripts (NOT console-scripts)
# so no console window pops up alongside the app on Windows (pythonw launcher).
# Targets the SHIPPED launcher pixelart_creator.ui.app:main (T13D). Equivalent to
# `python -m pixelart_creator` (pixelart_creator/__main__.py).
[project.gui-scripts]
pixelart-creator = "pixelart_creator.ui.app:main"

[tool.setuptools.packages.find]
include = ["pixelart_creator*"]
# Exclude non-shipped infra from the distributed package (scripts/ are dev tooling).
# sync_backend is a SEPARATE real-time relay service, not part of the desktop
# distributable — exclude it explicitly (the include whitelist already omits it,
# this is defence-in-depth so it never leaks into the wheel).
# web_viewer is the SEPARATE Phase-13 13E web-client package (its own build/runtime,
# not part of the desktop distributable) — excluded the same way as sync_backend for
# defence-in-depth (ADR-0027/0035) so it never leaks into the desktop wheel.
exclude = ["testing*", "scripts*", "docs*", "sync_backend*", "web_viewer*"]

# Non-Python package data shipped inside the wheel. The offline in-app User
# Guide bundle (REQ-UG-DATA-001) lives under pixelart_creator/userguide_content/
# and MUST ship so data/guide_content.py can locate it via importlib.resources.
# The two globs cover manifest.json (userguide_content/*.json) and every
# per-topic Markdown file at any depth (userguide_content/**/*.md, e.g.
# content/en/*.md). No source build; no new dependency.
#
# B6 FIX: the translation catalogues moved from a repository-top-level
# `i18n/` folder (OUTSIDE the package, so pip never installed them) into
# pixelart_creator/i18n/ (a sibling of pixelart_creator/ui/, resolved by
# ui/i18n.py's _default_translations_dir()). The two globs below ship the
# compiled catalogues actually loaded at runtime (i18n/*.qm) and their .ts
# sources (i18n/*.ts) alongside them, matching the userguide entry's
# compiled+source-together style. No source build; no new dependency.
[tool.setuptools.package-data]
pixelart_creator = [
    "userguide_content/**/*.md",
    "userguide_content/*.json",
    "i18n/*.qm",
    "i18n/*.ts",
]

# ------------------------------- tool config ---------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
# Strict typing for the pure layers; UI/Qt stubs are looser.
[[tool.mypy.overrides]]
module = ["pixelart_creator.logic.*", "pixelart_creator.data.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# keyring.* is the optional live-credential dep shared by BOTH the cloud_live and
# assistant_live extras (ADR-0040 §5); it ships no stubs and is imported lazily,
# so ignore_missing_imports covers it for both surfaces consistently.
[[tool.mypy.overrides]]
module = ["PySide6.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# Phase-13 Slice 13E (T13E-G04): web_viewer is a SEPARATE package (its own
# build/runtime, excluded from the desktop wheel) whose Python tests live under
# web_viewer/tests — OUTSIDE the default "tests" root. Add it here so the DEFAULT
# `pytest` invocation collects the 13E web_viewer suite (in-process SyncServer,
# no docker/nginx — these carry NO `integration` marker, unlike the deploy/ VPS
# tests). The marker deselection below (not slow/gpu/cloud_live/integration)
# still applies uniformly across both roots.
#
# ADR-0043 (tests/deploy split): NO entry is needed here for the new
# `tests/deploy/` root — it is a subdirectory of the existing "tests" root, so a
# bare `pytest` recurses into it. Verified by collection, not by inspection:
# before the move `pytest --collect-only -q` reported 5656 tests with
# tests/backend at 49; after the move it reports the SAME 5656 with
# tests/backend at 40 and tests/deploy at 9. A NEW TOP-LEVEL test root (a
# sibling of "tests", as web_viewer/tests is) WOULD have to be added here or it
# would never be collected.
testpaths = ["testing/suites", "web_viewer/tests"]
addopts = "-ra"
# Machine-agnostic default: heavy/host-sensitive tests are deselectable markers.
markers = [
    "slow: long-running tests, deselected in the default gate",
    "gpu: tests needing a real GPU/display, deselected in headless CI",
    "integration: tests that reach outside the process, deselected by default",
    "cloud_live: live credential-gated provider tests (real OAuth/keyring), deselected in CI",
    "assistant_live: requires a real external LLM provider + credentials; deselected in CI",
]

[tool.coverage.run]
branch = true
source = ["pixelart_creator"]

[tool.coverage.report]
show_missing = true
# Gate is enforced by scripts/coverage_gate.py (>=90 line / >=80 branch, S13),
# not by fail_under here, so the verdict is a single P11 script (per-package).
# Lines/idioms excluded from coverage measurement project-wide. NOTE: setting
# exclude_lines OVERRIDES coverage.py's built-in default of ["pragma: no cover"],
# so that entry MUST be kept here or every inline `# pragma: no cover` in the
# tree would silently start counting again. The `if __name__ == .__main__.:`
# regex is the standard coverage.py idiom for module entry guards (e.g.
# pixelart_creator/__main__.py's `python -m` launch shim), which only execute in
# a subprocess as __main__ and are therefore uncoverable by the in-process suite.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# pydocstyle: the docstring-discipline gate (F14, mkdocs-site skill, REMEDIATION
# 2026-07-30). convention="pep257" is chosen deliberately, NOT left implicit,
# because it is the ONLY convention that matches what this codebase already
# does: logic-scaffold (AGT-03's owned skill) mandates "module + function
# docstrings (PEP 257)" project-wide — there is no Google-style Args/Returns
# section discipline and no NumPy-style underlined-section discipline anywhere
# in pixelart_creator/. Selecting "google" or "numpy" here would not reveal a
# real gap; it would MANUFACTURE hundreds of new D4xx section-formatting
# findings against a formatting style the project never adopted (explicitly
# rejected per the remediation directive). pep257 is ALSO pydocstyle's
# built-in default when no convention is configured, so writing it out here
# changes nothing about what is enforced today — it only makes the
# previously-implicit ruleset explicit, durable, and immune to a future
# pydocstyle major-version default change. NO add-ignore/add-select: the 102
# real findings this convention surfaces (D101/D102/D105/D107/D209/D301/D401/
# D402) are genuine gaps, not convention noise, and are gated (with a
# time-boxed exception) in ci.yml rather than suppressed here.
[tool.pydocstyle]
convention = "pep257"

[tool.flake8]
# flake8 reads setup.cfg/.flake8 natively; this block documents intent. The
# repo also carries a .flake8 mirror if the installed flake8 version ignores
# pyproject. Keep line-length aligned with black.
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
