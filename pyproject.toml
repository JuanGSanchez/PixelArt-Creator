# =============================================================================
# Packaging / dependency manifest — PixelArt Creator
# Owner: AGT-09 GitHub/DevOps (+ coding agents keep deps current). Grounded by
# F14 (build backend + runtime & dev deps + tool config). Mandatory software-dev
# extension (spec-driven-development.md §5): declares BOTH runtime and dev deps so
# CI installs exactly what tests import — no "works on my machine" gaps.
# =============================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelart-creator"
version = "0.1.0"
description = "Unified pixel-art platform: 8K editable grid, colour tools, layers, GPU render pipeline."
readme = "NOTICE"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Juan Garcia Sanchez" }]
keywords = ["pixel-art", "editor", "pyside6", "qt6", "graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]

# Runtime dependencies (S8 fixed stack).
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "Pillow>=10.0",
    # Phase-10 Slice B: CRDT convergence core. PINNED — ships prebuilt cp312
    # manylinux x86_64 wheels (only anyio at runtime, no source build on
    # Linux/py3.12 CI). Ships py.typed, so it is NOT in mypy ignore_missing_imports.
    "pycrdt==0.14.1",
    # Phase-10 Slice C: real-time sync wire protocol. CORE runtime dep — the
    # sync_backend service, data/cloud/ws_transport.py, AND the in-CI backend
    # tests (tests/backend/) all import it, so CI must install it unconditionally.
    # PINNED to 16.0 (prebuilt py3.12 wheels; ships py.typed, so NOT in mypy
    # ignore_missing_imports).
    "websockets==16.0",
]

[project.optional-dependencies]
# Real live-provider credential access ONLY (out-of-CI, credential-gated —
# CL-B2/CL-B3). NOT a core dep: the mocked provider tests monkeypatch
# token_store, so CI must NOT require a real OS keyring backend. Installed
# manually by users who exercise the real Drive/OneDrive/Dropbox adapters.
cloud_live = [
    "keyring==25.7.0",
]

# Dev/test dependencies — CI installs `.[dev]` so it runs exactly what tests import.
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pydocstyle>=6.3",
]

# Console entry points (installed on `pip install`). T7C-07 (REQ-P7-DATA-004);
# pixelart-run added by T8D-04 (Phase-8 automation CLI).
[project.scripts]
pixelart-export = "pixelart_creator.data.export_cli:main"
pixelart-run = "pixelart_creator.data.automation_cli:main"

# GUI entry point (installed on `pip install`). gui-scripts (NOT console-scripts)
# so no console window pops up alongside the app on Windows (pythonw launcher).
# Targets the SHIPPED launcher pixelart_creator.ui.app:main (T13D). Equivalent to
# `python -m pixelart_creator` (pixelart_creator/__main__.py).
[project.gui-scripts]
pixelart-creator = "pixelart_creator.ui.app:main"

[tool.setuptools.packages.find]
include = ["pixelart_creator*"]
# Exclude non-shipped infra from the distributed package (scripts/ are dev tooling).
# sync_backend is a SEPARATE real-time relay service, not part of the desktop
# distributable — exclude it explicitly (the include whitelist already omits it,
# this is defence-in-depth so it never leaks into the wheel).
# web_viewer is the SEPARATE Phase-13 13E web-client package (its own build/runtime,
# not part of the desktop distributable) — excluded the same way as sync_backend for
# defence-in-depth (ADR-0027/0035) so it never leaks into the desktop wheel.
exclude = ["tests*", "scripts*", "docs*", "sync_backend*", "web_viewer*"]

# Non-Python package data shipped inside the wheel. The offline in-app User
# Guide bundle (REQ-UG-DATA-001) lives under pixelart_creator/userguide_content/
# and MUST ship so data/guide_content.py can locate it via importlib.resources.
# The two globs cover manifest.json (userguide_content/*.json) and every
# per-topic Markdown file at any depth (userguide_content/**/*.md, e.g.
# content/en/*.md). No source build; no new dependency.
[tool.setuptools.package-data]
pixelart_creator = ["userguide_content/**/*.md", "userguide_content/*.json"]

# ------------------------------- tool config ---------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# Strict typing for the pure layers; UI/Qt stubs are looser.
[[tool.mypy.overrides]]
module = ["pixelart_creator.logic.*", "pixelart_creator.data.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
# Machine-agnostic default: heavy/host-sensitive tests are deselectable markers.
markers = [
    "slow: long-running tests, deselected in the default gate",
    "gpu: tests needing a real GPU/display, deselected in headless CI",
    "integration: tests that reach outside the process, deselected by default",
    "cloud_live: live credential-gated provider tests (real OAuth/keyring), deselected in CI",
]

[tool.coverage.run]
branch = true
source = ["pixelart_creator"]

[tool.coverage.report]
show_missing = true
# Gate is enforced by scripts/coverage_gate.py (>=90 line / >=80 branch, S13),
# not by fail_under here, so the verdict is a single P11 script (per-package).
# Lines/idioms excluded from coverage measurement project-wide. NOTE: setting
# exclude_lines OVERRIDES coverage.py's built-in default of ["pragma: no cover"],
# so that entry MUST be kept here or every inline `# pragma: no cover` in the
# tree would silently start counting again. The `if __name__ == .__main__.:`
# regex is the standard coverage.py idiom for module entry guards (e.g.
# pixelart_creator/__main__.py's `python -m` launch shim), which only execute in
# a subprocess as __main__ and are therefore uncoverable by the in-process suite.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.flake8]
# flake8 reads setup.cfg/.flake8 natively; this block documents intent. The
# repo also carries a .flake8 mirror if the installed flake8 version ignores
# pyproject. Keep line-length aligned with black.
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
