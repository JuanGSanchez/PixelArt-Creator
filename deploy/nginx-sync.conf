# Nginx TLS/WSS reverse-proxy config for the shipped sync_backend/ relay.
# Phase-13 (REQ-P13-BACKEND-002, Researcher Q4). Terminates TLS at the proxy
# and forwards WSS -> plain WS to the backend, which serves plain WS behind it. NO
# backend source change.
#
# This file is INCLUDED FROM the http{} block of your nginx.conf, e.g.:
#     http {
#         include /etc/nginx/conf.d/pixelart-sync.conf;   # <- this file
#     }
# (upstream{}, map{} and server{} are all http-context directives.)
#
# Values marked OPERATOR are substituted for your host/certs.

# Backend upstream — the relay serves plain WS on loopback (Docker/systemd bind
# 0.0.0.0, but the proxy reaches it via 127.0.0.1). Port matches PIXELART_SYNC_PORT
# (default 8765) in deploy/Dockerfile / deploy/pixelart-sync.service.
upstream pixelart_sync {
    server 127.0.0.1:8765;
}

# Canonical WebSocket Upgrade map (Q4 recipe): resolves the `Connection` header sent
# upstream to "upgrade" for a WebSocket handshake (when the client sends
# `Upgrade: websocket`) and to "" for ordinary keep-alive requests. This is what
# forwards the Connection header correctly for WSS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional: redirect plain HTTP to HTTPS so clients always land on TLS/WSS.
server {
    listen 80;
    server_name sync.example.com;                 # OPERATOR: your DNS name
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sync.example.com;                 # OPERATOR: your DNS name

    # TLS termination. OPERATOR: point these at your certificate + private key
    # (e.g. Let's Encrypt fullchain/privkey; a self-signed loopback pair is enough
    # for the localhost acceptance run — no public certificate required).
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # OPERATOR: cert path
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;      # OPERATOR: key path
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://pixelart_sync;

        # --- Query-string token log redaction (ADR-0036 Addendum A.2) ---------------
        # The share-link token rides the WS handshake as `?token=<...>` on this
        # location's request URI (Addendum A.1). Addendum A.2 makes it a MANDATORY
        # contract requirement that Nginx never persist that query string. We take the
        # SIMPLEST sanctioned option — disable the access log for the WS-upgrade
        # location entirely — so `$request`/`$args` (and thus `token=`) are never
        # written to disk. (The alternative in A.2, a custom `log_format` that omits
        # `$query_string`/`$args`, is more machinery for the same guarantee; the WS
        # relay does not need per-request access logging, so `off` is the correct,
        # minimal choice. Error-level diagnostics are unaffected — nginx error_log
        # does not emit the request query string.) The backend independently redacts
        # the token in its own handshake logging (A.2 item 2), and the token is
        # short-lived (A.2 item 4) and verified-never-stored (A.2 item 3).
        access_log off;

        # WebSocket upgrade handshake requires HTTP/1.1 + the Upgrade/Connection
        # headers forwarded to the backend (Q4). Without these the WSS -> WS proxy
        # never completes the handshake.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle WebSocket connections alive. Nginx's default proxy_read_timeout is
        # 60s, which silently drops idle WS; raise it far above (86400s = 24h, per the
        # Q4 recipe) so long-lived, low-traffic collaboration sessions are not killed.
        proxy_read_timeout 86400s;   # >> 60s default (Q4)
        proxy_send_timeout 86400s;   # match, so a slow/idle writer is not dropped either
    }

    # Static serving of the vanilla web viewer (Phase-13;
    # REQ-P13-WEB-001 view a shared project in a browser, REQ-P13-WEB-004 web_viewer/
    # is a headless, Qt-free top-level component served by the existing 13C stack —
    # NO new web-framework dependency, per spec §10 D1). The share link is
    # `https://<host>/viewer/?t=<token>&p=<project_id>` (ADR-0036 §2 step 1); the
    # client loads these static assets and then opens its WSS data connection back to
    # `wss://<same-host>/` (the `location /` proxy above). Because `/viewer/` is a
    # more-specific prefix than `/`, viewer asset requests match here and the WS
    # handshake still matches `location /` — the two do not collide.
    location /viewer/ {
        # OPERATOR: point this alias at the directory where you deployed the contents
        # of the repo's `web_viewer/static/` (index.html, viewer.css, viewer.js).
        # `alias` (NOT `root`) maps `/viewer/<file>` -> "<this path>/<file>", so the
        # trailing slash on both the location and the alias is REQUIRED. Example
        # deployment path shown; substitute your own.
        alias /srv/pixelart/web_viewer/static/;   # OPERATOR: deployed static dir (trailing slash required)

        index index.html;
        try_files $uri $uri/ =404;

        # Correct MIME types come from the standard `mime.types` map, which your
        # nginx.conf MUST `include` at http scope (this file is included from http{});
        # that maps .html->text/html, .css->text/css, .js->text/javascript. A
        # conservative default for anything unmapped:
        default_type application/octet-stream;

        # Serve the pixel-art client assets byte-for-byte with NO lossy transformation
        # (pixel-faithful rendering, REQ-P13-WEB-001 / ADR-0036 §4). `no-transform`
        # tells any intermediary cache/CDN not to recompress or rewrite the payload;
        # nginx itself never alters the bytes. The pixels themselves are rendered
        # client-side on <canvas> from the WSS stream, so there is nothing here for a
        # proxy to re-encode — this header just makes the intent explicit.
        add_header Cache-Control "no-transform" always;
    }
}
